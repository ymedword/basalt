# 读数：工具选择 —— 一条助手消息里给出**两个**工具调用时，循环按声明顺序逐条执行、
# 逐条回填结果，然后才回到模型。
#
# US-24 语境：同一轮的两次工具结果回填各自经归属保护写入（先锁租约行再校验负责人 +
# 归属代次 + 未过期），任何一次被误伤都会少一条工具结果或打乱顺序。判据只落在模型面
# 读数上：tool_sequence 逐位相等、两条审计行都是 success、最终回答用上两份内容。
id: tool-selection-two-calls-one-turn
kind: 工具选择
provider: ""
description: 一轮两个工具调用（read_file a.txt、read_file b.txt）——期望按声明顺序串行执行、两份结果都回到模型
message: 同时读一下 a.txt 和 b.txt，把两个值都告诉我。
fixture:
  agent: batcher-agent
  agent_md: |
    ---
    name: batcher-agent
    description: 评测夹具——工具选择读数（一轮两次调用）
    provider:
      name: probe
      model: eval-probe-model
    tools:
      - read_file
      - list_dir
    settings:
      max_iterations: 10
    ---

    你是评测夹具 Agent：按用户点名的文件逐个读取，最后合并回答。
  files:
    a.txt: |
      A=1
    b.txt: |
      B=2
budget:
  max_iterations: 4
  max_tool_calls: 5
  context_tokens: 32768
script:
  # 第一轮：一条消息里两个工具调用——顺序即声明顺序，循环逐条执行后再回模型。
  - content: 两个文件一起读。
    usage:
      prompt: 140
      completion: 24
      total: 164
    tool_calls:
      - id: call-batch-1
        name: read_file
        arguments: '{"path": "a.txt"}'
      - id: call-batch-2
        name: read_file
        arguments: '{"path": "b.txt"}'
  - content: a.txt 里是 A=1，b.txt 里是 B=2。
    usage:
      prompt: 230
      completion: 12
      total: 242
expect:
  status: completed
  tool_sequence:
    - read_file
    - read_file
  text_contains:
    - A=1
    - B=2
  tool_results_contain:
    - A=1
    - B=2
  audit:
    - tool_call_id: call-batch-1
      status: success
    - tool_call_id: call-batch-2
      status: success
  llm_calls: 2
  min_total_tokens: 406
  usage_complete: true
