# 读数：业务结果（预算档）——预算收紧到 max_iterations: 1 时，循环在第一轮的工具调用
# 之后必须停下并落 `limit_reached`：达上限是**预期终止、不是错误**（契约 §1.3）。
# 判据：status = limit_reached、那一轮的工具仍然真执行过（审计行 success）、模型只被叫了一次。
# 达上限时 FinalText 恒空（冻结签名收不下"已得部分文本"），故本用例不写 text_contains。
id: outcome-iteration-limit
kind: 业务结果
provider: ""
description: 迭代上限收紧到 1——期望第一轮工具照常执行、随后落 limit_reached 且模型只被叫一次
message: 列一下当前目录里有哪些文件。
fixture:
  agent: loop-guard-agent
  agent_md: |
    ---
    name: loop-guard-agent
    description: 评测夹具——预算档读数
    provider:
      name: probe
      model: eval-probe-model
    tools:
      - list_dir
    settings:
      max_iterations: 10
    ---

    你是评测夹具 Agent：按用户要求列目录。
  files:
    first.txt: |
      第一个文件。
    second.txt: |
      第二个文件。
budget:
  # 用例预算只能收紧：Profile 里的 10 在这里被压到 1。
  max_iterations: 1
  max_tool_calls: 5
  context_tokens: 32768
script:
  # 只写一条回答：上限为 1 时模型只该被叫一次——多写的回答不会被执行。
  - content: 我列一下当前目录。
    usage:
      prompt: 90
      completion: 12
      total: 102
    tool_calls:
      - id: call-limit-1
        name: list_dir
        arguments: '{"path": "."}'
expect:
  status: limit_reached
  tool_sequence:
    - list_dir
  tool_results_contain:
    - first.txt
  audit:
    - tool_call_id: call-limit-1
      status: success
  llm_calls: 1
  min_total_tokens: 102
  usage_complete: true
