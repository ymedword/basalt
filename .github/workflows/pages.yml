name: Publish website

# 网站发布只在 CI 完整通过后自动执行；保留手动触发作为回退。
# 不直接监听 push：CI 的 test / console / build / website 四类 job 全部通过才发布。
# 手动触发仍会重新构建、测试、检查后再发布，不复用 CI 的 dist 工件。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 的 github.sha 是默认分支尖端，不一定是刚完成的运行提交；
    # 只有 CI 成功且其 head_sha 等于当前默认分支尖端时才发布，避免发布旧提交。
    # Manual dispatch is always allowed and builds the selected ref.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build and check website
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build
          npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist
      - name: Publish static website
        id: deployment
        uses: actions/deploy-pages@v4
