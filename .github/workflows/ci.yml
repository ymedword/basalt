name: CI

# job 按工具链边界拆分，不是"跑得快"：
#   test     job —— 默认开 CGO（`-race` 需要 cgo 运行时与 C 编译器），跑**全量门禁**；
#                   自 T125 / D-01 起 `test-integration`、`test-pg` 与 `cover` 缺 DSN 即失败，
#                   故本 job 也带 PostgreSQL service——单元测试本身不读 DSN，外部引擎只
#                   在这三个目标里出现。`test-pg`（T136）是引擎层唯一的 `-race` 面，包范围
#                   是 `test-integration` 的子集但判据面不是，两者都保留；
#   postgres job —— 独立的引擎判据：真实 PostgreSQL 17.11 + pgvector 0.8.7 服务容器，
#                   先 fail-closed 断言扩展版本，同 job 内跑 `-tags=integration`；
#                   镜像 tag 在两处写死且相同；
#   console  job —— Node 前端工具链（npm ci / test / build + 产物可复现）。**必须**独立成
#                   job：Go 门禁不调用 Node / npm，本机没有 Node 时 `make check` 照常判卷；
#   build    job —— `CGO_ENABLED=0` 四平台交叉编译，验证单二进制承诺，**不得**跑 -race；
#   container job —— US-18 的部署验收：真实 linux/amd64 镜像 + 真实 Compose，跑
#                   `us18-linux` stage。独立 job 是因为这些用例独占 Docker 守护进程、
#                   单条 stage 预算约 170 分钟；**不得**与 `test` 合并，`test` 名称也
#                   不得改（它是 main 的必过检查）。
# 参见 docs/DevelopmentLoop.md §2.2 的"三条实测纪律"；前端约束见模块卡约束 42。
#
# 触发面覆盖**所有分支**（`'**'` 只匹配分支、不匹配 tag）：US 分支一推即判卷，
# 问题在分支阶段暴露，而不是等合回 main 才发现——US-4 的 runner_unix.go 就吃过这个亏
# （本地 Windows 门禁编译不到 unix 文件，main-only 触发让 CI 红直到合回主干才出现，
# 用户 2026-10-17 裁决扩面）。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 名称是 main 分支保护的必过检查（contexts 逐字匹配），**不得**改名。名称里没列
    # `test-pg` 是因为改名会挡住所有 PR，不是因为它不跑——它随 `--profile ci` 执行。
    # This exact name is a required status check on main; renaming it blocks every PR.
    name: test（默认 CGO：fmt / lint / sec / test / test-integration / cover）
    runs-on: ubuntu-latest
    # T125 / D-01：`test-integration`、`test-pg` 与 `cover` 缺 BASALT_TEST_PG_DSN 即失败，
    # 而本 job 跑全量门禁——service 因此是**判据前提**，不是可选加速。单元测试
    # （`make test`）不读 DSN；引擎版本断言仍只在 postgres job 做（两处镜像 tag 相同）。
    # service 只保证"有引擎"，**不保证扩展已装**：pgtemp 每条用例都按扩展所在 schema 拼
    # `search_path`，读不到 vector / pg_trgm 即 fail-closed，故本 job 在跑门禁前显式建扩展。
    # The service is a precondition of this job's verdict (D-01), not an optimization;
    # the extensions are provisioned explicitly below because the tag alone does not
    # install them into basalt_test (pgtemp fails closed when they are absent).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          # 一次性口令，只存活于本 job 的服务容器内，用完即弃——**不是**凭据，**不得**被
          # 复用到任何真实实例；真实凭证一律 ${ENV_VAR} 注入，不落盘。
          POSTGRES_USER: basalt
          POSTGRES_PASSWORD: basalt_ci_only
          POSTGRES_DB: basalt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basalt -d basalt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASALT_TEST_PG_DSN: postgres://basalt:basalt_ci_only@127.0.0.1:5432/basalt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 toolchain 行一致：准确构建版本由这两处表达。
          go-version: "1.27.3"
          cache: true

      # 四检查工具固定版本安装——"干净检出 + Go"不足以跑全门禁。
      # 注意传给 go install 的是**含 /cmd/... 的安装路径**（module 路径另算）。
      # gosec **不得**用 `go install ...@v2.29.0`：它带的 x/tools v0.49.0 读不了 Go 1.27 的
      # 导出数据（版本 5 > 最高支持 4），扫描会静默降级成只判语法树、类型相关规则整批失效。
      # 配方因此固定 x/tools v0.50.0，依据与探针读数见 docs/DevelopmentLoop.md §10.2.5.1。
      - name: Install check tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          mkdir -p "$RUNNER_TEMP/gosec-build" && cd "$RUNNER_TEMP/gosec-build"
          go mod init basalt-gosec-build
          go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go get golang.org/x/tools@v0.50.0
          go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec

      # 扩展**显式建**，不赌镜像预置：`pgvector/pgvector` 镜像只带扩展文件，装进
      # `basalt_test` 仍需 CREATE EXTENSION。缺扩展时 pgtemp 在**每条**依赖库的用例上
      # fail-closed（"读取扩展 vector 所在 schema: sql: no rows in result set"），
      # 表现为 test-integration / test-pg / cover / behavior / injection 一并判红。
      # 这里只建不判版本：引擎与扩展的版本断言仍归 postgres job（两处镜像 tag 相同）。
      # Provision the extensions here: the image ships the extension files, not an
      # installed extension. Version assertions stay in the postgres job.
      - name: Provision extensions in the test database
        run: |
          set -euo pipefail
          cid="${{ job.services.postgres.id }}"
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U basalt -d basalt_test \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          # 建完回读：ON_ERROR_STOP 只管语句级错误，扩展是否真装上以 pg_extension 为准。
          ext=$(docker exec "$cid" psql -tA -U basalt -d basalt_test \
            -c "SELECT extname FROM pg_extension WHERE extname IN ('vector','pg_trgm') ORDER BY extname")
          echo "$ext"
          echo "$ext" | grep -qx 'pg_trgm'
          echo "$ext" | grep -qx 'vector'

      - name: Unified acceptance (mandatory fake-model evals; explicit real-model skip)
        # 控制台输出也落盘：报告被中断/覆盖时，console 是唯一的逐条进度证据。
        # 运行目录带 run id + attempt：同一 run 的重试（run_attempt 递增）会撞上已存在目录，
        # 固定名还会让不同运行互相覆盖证据；accept 拒绝已存在目录、record_id 也会冲突。
        # Keep the console stream as evidence too, not only report.json. Every --out carries
        # both GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT (enforced by TestRepoInvariants_CIRunDirsUnique).
        run: |
          set -o pipefail
          mkdir -p .loop/runs
          sh scripts/check-acceptance.sh --profile ci --out ".loop/runs/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>&1 | tee ".loop/runs/ci-console-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"

      # stage lint 只做只读存在性预检（-list 变换）：lint 通过不等于测试执行通过，
      # 执行判据是下一段 current stage 的具名 PASS。
      - name: Lint stage definitions (read-only existence precheck)
        run: sh scripts/check-acceptance.sh --lint-stages --stage harness/stages/current.json

      # 现行累计清单：历史 US-8 / 9 / 10 的专属 check 持续回归，加 US-15 专属 check。
      - name: Current cumulative stage (historical checks keep regressing)
        run: sh scripts/check-acceptance.sh --stage harness/stages/current.json --stage-only --out ".loop/runs/current-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      # Linux 专属通道：信号优雅停机与调度停机顺序只能在 Linux 上判卷（Windows 按平台限制未验证）。
      # us15-real 不接入 CI：真实凭证与费用只在用户授权后于收口时执行。
      - name: Linux-only stage (signal and scheduler shutdown)
        run: sh scripts/check-acceptance.sh --stage harness/stages/us15-linux.json --stage-only --out ".loop/runs/us15-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload acceptance evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          # 整目录上传（报告 / 逐检查日志 / 评测报告 / console），缺文件即判红。
          # Upload the whole runs tree; an empty artifact means evidence was lost.
          path: .loop/runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # tzdata 隔离组**必跑**（不入 make check）：默认层在装有系统时区的机器上
      # 没有判别力，只有真删掉系统数据与 GOROOT 的 zoneinfo.zip 才成立。
      # 删后**断言不存在**（fail-closed）：删不动就只能判红，不能静默降级成"没隔离也算过"。
      # 容器里跑 go test 需要拉依赖，故代理用默认值（runner 可直连 proxy.golang.org）。
      - name: tzdata isolated check
        # 具名 PASS 事件是判据：退出码 0 也可能意味着 -run 没匹配到任何测试。
        # A named pass event is required; exit 0 alone can mean the filter matched nothing.
        run: |
          docker run --rm -v "$PWD":/src -w /src golang:1.27.3 bash -c '
            set -eo pipefail
            rm -rf /usr/share/zoneinfo "$(go env GOROOT)/lib/time/zoneinfo.zip"
            test ! -e /usr/share/zoneinfo && test ! -e "$(go env GOROOT)/lib/time/zoneinfo.zip"
            go test -tags=tzisolated -json ./cmd/basalt -run "^TestTZData_Isolated(EmbeddedFallback|ControlWithoutImport)$" -count=1 | tee /tmp/tz.json
            grep -q "\"Action\":\"pass\".*\"Test\":\"TestTZData_IsolatedEmbeddedFallback\"" /tmp/tz.json
            grep -q "\"Action\":\"pass\".*\"Test\":\"TestTZData_IsolatedControlWithoutImport\"" /tmp/tz.json
          '

  postgres:
    # 存储集成测试要连**带扩展的真实引擎**，不是内存替代：单元 job 不读 DSN，DSN 只在本 job 注入。
    # 镜像按设计卡 §4.7 / D-04 实测读数冻结：`pgvector/pgvector:0.8.7-pg17` 内含
    # PostgreSQL **17.11**（`PG_VERSION=17.11-1.pgdg12+2`）+ vector **0.8.7**；pg_trgm 1.6 随 PG contrib。
    # tag **写死**：**不得** `latest`、**不得**浮动 tag、**不得**在本 job 现场构建镜像替代候选；
    # digest 待 T008d 部署实测后补入（T113 / tasks.md R2.4 勘误 3）。
    # 2026-10-28 核对读数（registry 清单 + 镜像 config，来源见 run-state §2.3 的 T113 行）：
    #   索引 digest sha256:ac08538c…；amd64 清单 sha256:cd4ccfda…；镜像构建 2026-10-01。
    name: postgres（PostgreSQL 17.11 + pgvector 0.8.7：-tags=integration）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          # 一次性口令，只存活于本 job 的服务容器内，用完即弃——**不是**凭据，**不得**被复用到
          # 任何真实实例；真实凭证一律 ${ENV_VAR} 注入，不落盘。
          POSTGRES_USER: basalt
          POSTGRES_PASSWORD: basalt_ci_only
          POSTGRES_DB: basalt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basalt -d basalt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASALT_TEST_PG_DSN: postgres://basalt:basalt_ci_only@127.0.0.1:5432/basalt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      # **扩展版本 fail-closed**：tag 只是命名，扩展版本才是判据——读数不符即判红，
      # 不静默降级成"tag 对了就算过"。pg_trgm 与 vector 都显式建，不赌镜像预置。
      - name: Assert engine version (PG 17.11 / vector 0.8.7 / pg_trgm 1.6)
        run: |
          set -euo pipefail
          cid="${{ job.services.postgres.id }}"
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U basalt -d basalt_test \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          sv=$(docker exec "$cid" psql -tA -U basalt -d basalt_test -c 'SHOW server_version')
          echo "server_version=$sv"
          echo "$sv" | grep -Eq '^17\.11([ .]|$)'
          ext=$(docker exec "$cid" psql -tA -U basalt -d basalt_test \
            -c "SELECT extname || '=' || extversion FROM pg_extension WHERE extname IN ('vector','pg_trgm') ORDER BY extname")
          echo "$ext"
          echo "$ext" | grep -qx 'pg_trgm=1.6'
          echo "$ext" | grep -qx 'vector=0.8.7'

      # T125 裁决（2026-10-28，用户授权 Claude 代行技术评审与裁决）：acceptance 里
      # 依赖 PG 的目标**留在 test job**，由其同款 service 提供 DSN；本 job 保留为独立的
      # 引擎版本证据（上面的 fail-closed 断言）+ 集成套件运行位置。缺 DSN 时三处入口
      # （Makefile / check-coverage.sh / 测试助手）各自失败，不得跳过换绿。
      - name: Integration tests (real PostgreSQL)
        run: go test -tags=integration -count=1 ./...

  console:
    # 前端构建期工具链独立成 job（约束 42）：Go job **不得**调用 Node / npm——
    # 本机没有 Node 时 `make check` 与验收入口必须照常判卷。Node 版本由
    # `assets/console/.nvmrc` 固定，不依赖 runner 的默认版本。
    # The Node toolchain is its own job; Go gates never invoke Node (constraint 42).
    name: console（Node：npm ci / test / build + 产物可复现）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/console
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node（版本由 .nvmrc 固定）
        uses: actions/setup-node@v4
        with:
          node-version-file: assets/console/.nvmrc
          cache: npm
          cache-dependency-path: assets/console/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (typecheck + Vite + integrity manifest)
        run: npm run build

      # 可复现判据两条**同时**成立（约束 42）：
      # ① 重建后的 dist 与提交树逐字节一致——`git status --porcelain` 连 `??` 未跟踪
      #    文件一起判（新增文件不会被 `git diff` 看见，所以不得只看 diff）；
      # ② 目录文件集合与 `integrity.json` 的 path 集合完全一致，且逐文件 sha256 相等。
      # Two checks together: a clean worktree after rebuild (untracked files included)
      # and manifest set/hash equality. `git diff` alone would miss new files.
      - name: Verify rebuilt dist is reproducible and matches integrity.json
        working-directory: .
        run: |
          set -euo pipefail
          status=$(git status --porcelain -- assets/console/dist)
          if [ -n "$status" ]; then
            echo "前端构建不可复现：重新构建后 assets/console/dist 与提交树不一致" >&2
            echo "$status" >&2
            exit 1
          fi
          node <<'EOF'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, statSync } = require('node:fs');
          const { join, relative, sep } = require('node:path');

          const root = 'assets/console/dist';
          const manifest = JSON.parse(readFileSync(join(root, 'integrity.json'), 'utf8'));
          const files = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir).sort()) {
              const full = join(dir, name);
              if (statSync(full).isDirectory()) walk(full);
              else files.push(relative(root, full).split(sep).join('/'));
            }
          };
          walk(root);

          const listed = Object.keys(manifest).sort();
          const actual = files.filter((path) => path !== 'integrity.json').sort();
          if (JSON.stringify(actual) !== JSON.stringify(listed)) {
            console.error('integrity.json 的 path 集合与 dist 不一致');
            console.error('  integrity.json:', listed);
            console.error('  dist:', actual);
            process.exit(1);
          }

          let failures = 0;
          for (const path of actual) {
            const sum = createHash('sha256').update(readFileSync(join(root, path))).digest('hex');
            if (sum !== manifest[path]) {
              console.error(`${path}: sha256 ${sum} != integrity.json 的 ${manifest[path]}`);
              failures += 1;
            }
          }
          if (failures > 0) process.exit(1);
          console.log(`ok: ${actual.length} 个文件与 integrity.json 一致`);
          EOF

  build:
    name: build（CGO_ENABLED=0 四平台交叉编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      # 单二进制承诺的判据：无 CGO 也能出四平台产物。
      # 版本标识经 -X main.version 注入，与本机 make build 同形。
      - name: Cross-compile four targets
        run: |
          set -e
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os=${target%%/*}
            arch=${target##*/}
            out="bin/basalt-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o "$out" ./cmd/basalt
            echo "built $out"
          done

      # 单二进制的**静态**判据：CGO_ENABLED=0 只是手段，产物本身要无动态依赖。
      # 判据两条证据都要（宪法 VIII 的复核方式 = file / ldd）：file 认"statically
      # linked"，ldd 必须报"not a dynamic executable"——ldd 若成功列出依赖即判红。
      # 只断言原生架构（linux/amd64）：ldd 对异架构产物无法给出可靠读数。
      # 本机 Windows 验不了 Linux 产物，这里是取得该读数的唯一途径。
      - name: Assert Linux artifact is static (file / ldd)
        run: |
          set -e
          file bin/basalt-linux-amd64
          file bin/basalt-linux-amd64 | grep -q "statically linked"
          if out=$(ldd bin/basalt-linux-amd64 2>&1); then
            echo "ldd 列出了动态依赖（单二进制承诺被破坏）：$out" >&2
            exit 1
          fi
          case "$out" in
            *"not a dynamic executable"*) echo "ldd: ok（无动态依赖）" ;;
            *) echo "ldd 输出无法确认静态（预期 not a dynamic executable）：$out" >&2; exit 1 ;;
          esac

      # 验收工具也按 Windows 目标编译：它**不**在产品四目标内，
      # 只在 Linux 上跑测试会漏掉 windows 构建标签与 syscall 用法。
      # Compile the acceptance tool for Windows even when checks run on Linux.
      - name: Cross-compile development harness for Windows
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/acceptance-windows.exe ./scripts/acceptance

      # 上传产物必须随附许可与第三方声明，不等正式 Release 打包。
      # Every uploaded binary artifact carries LICENSE, NOTICE and THIRD_PARTY_NOTICES.
      - name: Stage license notices with binaries
        run: cp LICENSE NOTICE THIRD_PARTY_NOTICES bin/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basalt-binaries
          path: bin/
          if-no-files-found: error

  container:
    # US-18 部署验收：真实 linux/amd64 镜像 + 真实 Compose。stage 内每条 check 的
    # timeout_seconds 之和约 170 分钟，180 分钟给失败日志与清理留余量。
    # 只做匿名 pull（两个固定 digest 的公开基础镜像）：**没有** docker login、
    # registry secret 或 push——推送仍是首发动作（U18-Q2）。
    # 本 job 名称不是 main 的必过检查；`test` job 的名称不得因此改动。
    # US-18 deployment acceptance on a real image and real Compose. Anonymous pulls
    # only; no registry credentials and no push.
    name: container（真实镜像 + Compose：us18-linux）
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 缺 daemon / 镜像时用例必须失败而不是跳过——干净 runner 上跳过等于假绿。
      # REQUIRE_DOCKER turns missing daemon or images into failures, never skips.
      BASALT_E2E_REQUIRE_DOCKER: "1"
      # 项目名 = us18-ci-<run_id>-<用例名>-<随机后缀>：清理与残留断言都按该前缀。
      BASALT_E2E_PROJECT_PREFIX: us18-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      # 宿主环境登记进 job 日志：版本读数就是验收证据的一部分。
      - name: Record runner Docker / Compose versions
        run: |
          docker version
          docker compose version

      # 两个基础镜像的 digest 由 release/image-lock.json 单一维护；匿名拉取，
      # 失败即红（后续 docker build / compose 也会用同一引用）。
      - name: Pull pinned public base images (anonymous)
        run: |
          set -euo pipefail
          app_base=$(jq -r .app_base release/image-lock.json)
          postgres=$(jq -r .postgres release/image-lock.json)
          echo "app_base=${app_base}"
          echo "postgres=${postgres}"
          docker pull "${app_base}"
          docker pull "${postgres}"

      - name: Build basalt binary
        run: make build

      # **必须**带 --stage-only：不带时默认 full profile 缺 BASALT_TEST_PG_DSN，
      # 会在起跑前 exit 2，容器用例一条都跑不到。
      # --stage-only is mandatory: the default full profile exits 2 without a test DSN.
      - name: US-18 container stage (real image and real Compose)
        run: |
          set -o pipefail
          mkdir -p .loop/runs
          sh scripts/check-acceptance.sh --stage-only --stage harness/stages/us18-linux.json \
            --out ".loop/runs/us18-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            2>&1 | tee ".loop/runs/us18-ci-console-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"

      # 失败诊断写入同一目录，随 artifact 一起上传；不依赖上一步成功。
      - name: Collect failure diagnostics
        if: failure()
        run: |
          set -uo pipefail
          log=".loop/runs/us18-ci-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          mkdir -p .loop/runs
          {
            echo "== docker ps -a =="
            docker ps -a
            echo
            echo "== docker compose ls -a =="
            docker compose ls -a
            echo
            echo "== docker images =="
            docker images
          } > "$log" 2>&1 || true
          prefix="us18-ci-${GITHUB_RUN_ID}-"
          projects=$(docker compose ls -a --format json | jq -r '.[].Name' | awk -v p="$prefix" 'index($0,p)==1')
          for project in $projects; do
            {
              echo
              echo "== compose logs: $project =="
              docker compose -p "$project" logs --no-color --tail 200
            } >> "$log" 2>&1 || true
          done

      - name: Upload acceptance evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: .loop/runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # 清理按真实对象枚举，**不能**只执行一条 `-p <prefix>`（它只匹配精确项目名）；
      # 先按 `docker compose ls` 逐个 down，再按统一前缀兜底删四类对象，最后断言零
      # 残留——有残留即 job 失败，不允许 warning + exit 0 静默漏清理。
      # Cleanup enumerates real projects, sweeps the shared prefix across all four
      # object classes, and fails the job if anything remains.
      - name: Clean up US-18 projects and assert zero residue
        if: always()
        run: |
          # `-e` 是判据的一部分：枚举命令失败时 `$(...)` 只会得到空集，循环静默跳过，
          # 最后的残留计数为 0——"没查成"会被读成"已清理"。四条枚举一律先落变量再使用。
          # `-e` is part of the verdict: a failed enumeration expands to nothing, the
          # loops skip silently and the residue count stays zero, turning "could not
          # check" into "cleaned up". Every enumeration lands in a variable first.
          set -euo pipefail
          prefix="us18-ci-${GITHUB_RUN_ID}-"
          echo "清理前缀：${prefix}"

          projects=$(docker compose ls -a --format json | jq -r '.[].Name' | awk -v p="$prefix" 'index($0,p)==1')
          for project in $projects; do
            echo "::group::compose down ${project}"
            docker compose -p "$project" down -v --remove-orphans --timeout 30 \
              || echo "compose down ${project} 失败，交由前缀清理兜底"
            echo "::endgroup::"
          done

          # Compose 卷 / 网络名是 <project>_<name>，容器名是 <project>-<service>-<n>，
          # project 本身以带尾随 - 的前缀开头，因此同一前缀覆盖四类对象；
          # 尾随 - 防止 run 123 误配 1234。
          # The trailing "-" keeps run 123 from matching 1234.
          container_ids=$(docker ps -aq)
          for id in $container_ids; do
            name=$(docker inspect -f '{{.Name}}' "$id" | sed 's|^/||')
            case "$name" in
              "$prefix"*) echo "删除残留容器 ${name}"; docker rm -f "$id" ;;
            esac
          done
          volumes=$(docker volume ls -q)
          for volume in $volumes; do
            case "$volume" in
              "$prefix"*) echo "删除残留卷 ${volume}"; docker volume rm -f "$volume" ;;
            esac
          done
          networks=$(docker network ls --format '{{.Name}}')
          for network in $networks; do
            case "$network" in
              "$prefix"*) echo "删除残留网络 ${network}"; docker network rm "$network" ;;
            esac
          done
          images=$(docker images --format '{{.Repository}}:{{.Tag}}')
          for image in $images; do
            case "$image" in
              "$prefix"*) echo "删除残留镜像 ${image}"; docker image rm -f "$image" ;;
            esac
          done

          remaining=0
          container_names=$(docker ps -a --format '{{.Names}}')
          for name in $container_names; do
            case "$name" in "$prefix"*) echo "残留容器：${name}"; remaining=$((remaining + 1)) ;; esac
          done
          volumes=$(docker volume ls -q)
          for volume in $volumes; do
            case "$volume" in "$prefix"*) echo "残留卷：${volume}"; remaining=$((remaining + 1)) ;; esac
          done
          networks=$(docker network ls --format '{{.Name}}')
          for network in $networks; do
            case "$network" in "$prefix"*) echo "残留网络：${network}"; remaining=$((remaining + 1)) ;; esac
          done
          images=$(docker images --format '{{.Repository}}:{{.Tag}}')
          for image in $images; do
            case "$image" in "$prefix"*) echo "残留镜像：${image}"; remaining=$((remaining + 1)) ;; esac
          done
          if [ "$remaining" -ne 0 ]; then
            echo "::error::清理后仍有 ${remaining} 项 ${prefix}* 残留"
            exit 1
          fi
          echo "ok：${prefix}* 容器 / 卷 / 网络 / 镜像均为零残留"

  website:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Test website
        working-directory: website
        run: npm test
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Check website artifacts
        working-directory: website
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/.vitepress/dist
          if-no-files-found: error
