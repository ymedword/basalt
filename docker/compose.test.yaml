# 测试 overlay：只给容器 e2e 用，不并入生产编排，也不放任何 mock 服务。
# Test overlay for the container e2e suite only; it never joins the production
# orchestration and carries no mock service.
#
# 用途：应用容器需要经宿主回环访问测试进程的 mock 模型端点时，
# `host.docker.internal` 在 Linux 上不会自动解析，由本 overlay 显式映射。
# Purpose: on Linux `host.docker.internal` is not resolved by default, so the app
# container cannot reach a mock endpoint bound on the host loopback without it.

services:
  basalt:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 测试模型的凭证占位符：容器内的 basalt.yaml 只能写 `${VAR}`（明文凭证被装载层
      # 拒绝），因此测试 overlay 提供一个一次性的假 Key，由 e2e 夹具恒定注入。
      # Credential placeholder for the test model: the config may only carry a
      # ${VAR} placeholder, so the test overlay supplies a throwaway fake key.
      BASALT_US18_FAKE_KEY: ${BASALT_US18_FAKE_KEY:?set by the e2e fixture}
