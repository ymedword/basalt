<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1920" viewBox="0 0 2300 1920" role="img" aria-labelledby="title desc">
<title id="title">Basalt Agent OS 核心架构</title>
<desc id="desc">从左向右阅读运行主线：CLI、REST 与管理台、定时调度归一进入 AgentService.Run，随后进入手写 ReActLoop。循环内从上向下为 PromptBuilder、ProviderService、ToolExecutor；工具结果在卡片外侧回填至下一轮。下方独立区域包含声明式工作区、加载与配置快照、MemoryService、内置工具与 MCP 适配，以及 SQLite 和文件系统。右侧模型服务与 MCP Server 位于进程外。内置工具由 WhitelistPolicy 授权，shell 由 LocalRunner 执行；外部 MCP Server 的内部行为不经过本地 Policy。大框表示 Basalt 实例的 Go 运行时与本地工作区。实线表示调用与返回，虚线表示上下文或持久化关系，不表示 Go 包的 import 方向。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476585"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#77869a"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#127e78"/></marker>
</defs><style>text {font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Segoe UI",Arial,sans-serif;} .mono {font-family:Consolas,"SFMono-Regular",monospace;}</style>
