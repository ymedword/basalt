<text x="300" y="94" font-size="34" fill="#66788a" font-weight="500">Agent OS</text>
<text x="80" y="140" font-size="26" fill="#516174" font-weight="400">三条入口统一归约为 Run，由 ReAct 驱动模型与工具。</text>
