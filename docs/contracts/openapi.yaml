    post:
      tags: [callers]
      summary: 核对未知结局的预留
      description: |
        只由管理面发起，写管理审计。把 `pending` 预留收敛为 `committed`（给 `actual`）或 `released`（给理由）；
        `actual` 大于 `amount` 时记 `overage`，**不**截断、**不**回滚已发生的调用。
        非 `pending` 的预留 → 409 `CONFLICT`（不得二次结算）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationReconcileRequest' }
      responses:
