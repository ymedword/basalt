  # ==========================================================
  # US-16：诊断读取（diagnostics）—— **管理面**
  # 诊断可丢弃、审计 fail-closed，两者不互相替代。证据缺口必须显式表达，不得用空集冒充"一切正常"：
  # 全量采样下的空结果用 `missing=true`；采样率 < 1 时的空结果用 `sampled_out=true`（二者互斥）。
  # ==========================================================
  /diagnostics:
    get:
      tags: [diagnostics]
      summary: 按关联标识读取诊断事件
      description: |
        管理面只读；caller key 一律拒绝（`diagnostics:read` 只随 admin token 的内置 `local-admin` 生效）。
        必须给出**至少一个主锚点**（`run_id` / `request_id` / `operation_id` / `ingest_job_id` / `session_id`），
        否则 400 `BAD_REQUEST`——不允许无条件全表扫。`task_id` 只是过滤限定符，单独给出不构成主锚点。
        `request_id` 由**可信服务端路径**生成（请求进入即分配）或校验：形状为 1～64 位字母、数字与 `. _ : -`，
        不符即 400 且**不回显**提交值；它可单独作锚点，用于定位「Run 账本尚未创建就被准入拒绝」的事件
        （此时没有 `run_id`）。关联不到的记录不计入结果。

        `session_id` 经 `runs.session_id` 关联；关联不到的记录**不**计入结果。
        固定按 `occurred_at` 升序（局部有序，**不设**跨节点全局序号）。

        结果为空时按采样率区分证据缺口：全量采样（`SampleRate = 1`）下"空"就是**没有记录** →
        `missing=true`；采样率 < 1 时"空"无法区分"本来没有"与"被采样丢光" → `missing=false` 且
        `sampled_out=true`。有记录时两者都为 false——三种状态**不得**混为一谈。
      parameters:
        - name: run_id
          in: query
          schema: { type: string }
        - name: request_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9._:-]+$'
            description: 服务端生成的追踪标识，可单独作主锚点；形状不符 → 400，且不回显提交值
        - name: task_id
          in: query
          schema: { type: string, description: 调度限定符；单独给出不构成主锚点 → 400 }
        - name: operation_id
          in: query
          schema: { type: string }
        - name: ingest_job_id
          in: query
          schema: { type: string }
        - name: session_id
          in: query
          schema: { type: string, description: 经 runs.session_id 关联 }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/DiagnosticKind' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: 诊断事件与证据缺口标记
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiagnosticsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==========================================================
  # US-16：会话压缩只读视图（compaction）
  # 派生视图：只展示本 US 能读到的事实，**不提供**手动触发，也**不**把摘要当消息或引用。
  # ==========================================================
  /compactions:
    get:
      tags: [compaction]
      summary: 读取压缩链（只读派生视图）
      description: |
        管理面只读。`session_id` 与 `run_id` **恰给一个**（都给或都不给 → 400）。
        只返回**当前 `chain_epoch`** 的链，按 `(chain_epoch, created_at)` 升序；`stale` / `failed` 条目
        一并返回并带 `reason_code`（失败必须显示降级原因）。

        `summary` 是派生视图，**不得**被当作消息原文或引用依据；引用摘要内容必须回 `POST /sources/view`
        按 `included_refs` 逐个校验。
      parameters:
        - name: session_id
          in: query
          schema: { type: string }
        - name: run_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 压缩链
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CompactionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

