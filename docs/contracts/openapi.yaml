  # ==========================================================
  # 核心端点
  # ==========================================================
  /health:
    get:
      tags: [core]
      summary: 健康检查
      security: []
      description: 唯一默认公开的 REST 端点；不返回配置、凭证或内部路径。
      responses:
        '200':
          description: 服务健康（200 即健康）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }

  /info:
    get:
      tags: [core]
      summary: 运行信息 + Provider 状态
      description: 响应**不含**任何凭证——Provider 只回名称、模型提示与配置是否就绪。
      responses:
        '200':
          description: 运行信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InfoView' }

  /system/overview:
    get:
      tags: [console]
      summary: 系统概览
      description: 管理台首页读数；不含凭证与绝对路径。数据库就绪用轻量 ping，不做完整性检查。
      responses:
        '200':
          description: 系统概览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/sample:
    get:
      tags: [console]
      summary: 节点采样
      description: |
        返回最近一次采样（服务端最多每 5 秒更新一次）。平台不支持的字段返回 `null` 并列入
        `unavailable`；**不得**伪造 0 或猜测读数。`cpu_percent` 是进程 CPU 利用率，不是宿主整机利用率。
      responses:
        '200':
          description: 最近一次采样
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemSample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /profiles:
    get:
      tags: [core]
      summary: 列所有 Agent 配置
      responses:
        '200':
          description: Agent 配置列表（含加载期校验状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProfileView' }

  /tools:
    get:
      tags: [core]
      summary: 列可用工具
      responses:
        '200':
          description: 工具列表（内置 / MCP / 代码内注册）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ToolView' }

  /memory:
    get:
      tags: [core]
      summary: 查长期记忆（全局层）
      description: >-
        全局层记忆，读自 PostgreSQL `memory_entries` 的 `scope=global` 行，按「核心记忆 / 归档记忆」两分区渲染。
        **本端点只是渲染投影**：它只含 `active` 正文、没有主键与状态；管理台要查看 / 纠正 / 删除条目走
        `GET /memory/entries`（结构化读模型，六态全集 + 主键）。
        写入路径有三条，互不替代：运行中无 Agent 身份的 `save_memory(scope=CORE)`；管理台显式提议
        `POST /memory/proposals`（落 `candidate`，必须再 `POST /memory/entries/{id}/confirm` 才进注入面）；
        `recall_memory` 只召回、不写入。**Run 结束不自动抽取记忆**。
        `.basalt/memory/MEMORY.md` 不是运行期载体，只是迁移时的一次性只读导入来源。
        Agent 层记忆走 `/agents/{name}/memory`。
      responses:
        '200':
          description: 长期记忆内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryView' }

  /sessions:
    post:
      tags: [core]
      summary: 创建会话（业务面）
      description: |
        需要 `sessions:write`，计入 `IngressRun` 入口桶。该组合已属于别的调用方时按"不存在"回答（404，
        不借出他人会话的元数据）。

        本端点**不启动 Run**：只创建 / 取回会话行，因此没有调用方并发名额与实例容量判定——
        `CALLER_CONCURRENCY_LIMITED` / `QUOTA_EXHAUSTED` / `TOO_MANY_RUNS` 都不会出现，
        429 只可能是入口速率或认证失败限速（见 `IngressRateLimited`）。
        参数校验失败（含 `agent` 缺失 / `null`）返回 400，**不创建、不修改**任何会话。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { type: string, description: Agent 名 }
                channel: { type: string, default: web }
                user_id: { type: string, default: anonymous }
      responses:
        '200':
          description: 会话（已存在同组合会话时幂等返回既有会话）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SessionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }
    get:
      tags: [console]
      summary: 列会话（业务面）
      description: |
        需要 `sessions:read`，计入 `IngressRead` 入口桶。无参数 = 当前身份可见的全部会话（含归档行，
        各自带 `status`）；`status` 只接受 `active` / `archived`，其他取值 → 400，不得退化成"不过滤"。

        caller key 调用时**强制**按 `sessions.caller_id` 过滤——契约没有 `caller_id` 参数，"看谁的"
        只由身份决定，不由请求决定；admin token 可跨调用方，迁移前旧会话 `caller_id` 为空，因此
        只允许 admin token 读取，**不得**把空值匹配到任意调用方。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      parameters:
        - name: agent
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, archived] }
      responses:
        '200':
          description: 会话列表（固定按 last_active_at 倒序；**不得**提供排序参数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }
        '500':
          description: 会话列表不可读（存储失败或端口未装配，业务码 `INTERNAL`）；不得用空列表充数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [core]
      summary: 查会话历史
      description: 返回最近 **100 条**消息（超出部分从最早开始不返回）。
      responses:
        '200':
          description: 会话详情（含消息）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SessionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [core]
      summary: 归档会话
      description: |
        归档不删数据（status 置 archived）。
        会话有在途运行时返回 409（不排队、不打断运行），**不产生任何归档写入**：
        status、archived_at 与消息均保持不变。
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SessionBusy' }

  /sessions/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [core]
      summary: 发消息（触发一次 Run）
      description: |
        需要 `sessions:write`，计入 `IngressRun` 入口桶。会话属于别的调用方与不存在**共用同一个 404**
        （不声明"存在但无权"，避免把会话存在性当探测面）。

        同步等待 Run 完成。**达迭代上限不算服务故障**：HTTP 仍为 200，`data.status = limit_reached`
        并附部分结果（见 contracts/run-and-errors.md §1.3）。
        请求体总上限 `http.max_request_bytes`（缺省 1 MiB，超限在解析前 400）；单条消息另有 ≤ 32 KB 的入口上限。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, description: 用户消息（≤ 32 KB） }
      responses:
        '200':
          description: Run 结果（status 取值见 §2）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SessionBusy' }
        '429': { $ref: '#/components/responses/RunLimited' }
        '504': { $ref: '#/components/responses/Timeout' }

  /agents/{name}/invoke:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [core]
      summary: 无状态调用 Agent
      description: |
        需要 `agents:invoke:<name>`（按路径参数逐字组装；无匹配 → 403），计入 `IngressRun` 入口桶。
        不落会话历史（`session_id` 为空），仍落 Run 与审计。超时 60 秒 → 504。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: Run 结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RunLimited' }
        '504': { $ref: '#/components/responses/Timeout' }

  /agents/{name}/memory:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [console]
      summary: 查某个 Agent 的长期记忆（Agent 层）
      description: >-
        返回 Agent 层内容；为空时返回空而非回退全局层（回退发生在提示词组装时，不发生在查询时）。
        带主键与状态的条目读模型见 `GET /agents/{name}/memory/entries`。
      responses:
        '200':
          description: Agent 层记忆
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryView' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # US-16 记忆管理（管理面，裁决 A）——结构化读模型 + 四个写动作
  # 七条路由只接受 admin token / local_trust；caller key 一律拒绝。
  # 写动作按宪法第 5 条先写 `pending` 管理审计再动目标，预写失败 → 500 且零改动。
  # 条目正文**不进**审计（`detail_json` 只带 sha256）与日志（只带条目标识与状态）。
  # ==========================================================
  /memory/entries:
    get:
      tags: [console]
      summary: 列全局层记忆条目（结构化读模型）
      description: |
        读自 `memory_entries` 的 `scope=global` 行，**六态全集**（`candidate` / `active` / `superseded` /
        `corrected` / `deleted` / `conflicted`），主键倒序，缺省窗口 200 条。与 `GET /memory` 的分工：
        本端点带主键与状态，页面据此确认 / 纠正 / 删除；渲染投影只含 `active` 正文。
        `state` 查询参数接受六态字面量之一；其他取值 400，**不**静默返回空列表。
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [candidate, active, superseded, corrected, deleted, conflicted] }
      responses:
        '200':
          description: 全局层条目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryEntryListView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /memory/proposals:
    post:
      tags: [console]
      summary: 显式提议一条全局层记忆（落 candidate）
      description: |
        先校验分区（`core` / `archive`，空串按 `archive`）与正文（去空白后非空）——**校验失败不留操作行**；
        再预写 `pending` 管理审计，预写失败 → 500 且**不写入**。新增行恒为 `candidate`：
        提议本身**不进**注入面，也不参与召回，必须再经 `POST /memory/entries/{id}/confirm` 晋升。
        同源（分层 + 分区 + 正文）已有 `candidate` / `active` 条目时**不新增行**，回执 `merged=true`、给出既有
        `entry_id`，`state` 取该行的真实状态（合并进 active 记忆时为 `active`，不伪造成候选）。
        **Run 结束不自动抽取记忆**——本端点是唯一的用户可达提议入口。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryProposalWrite' }
      responses:
        '200':
          description: 提议回执
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryEntryReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /agents/{name}/memory/entries:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [console]
      summary: 列某个 Agent 的记忆条目（结构化读模型）
      description: >-
        与 `GET /agents/{name}/memory` 同一分层，返回六态全集与主键，不回退全局层。
        Agent 未注册 → 404。`state` 查询参数语义同 `GET /memory/entries`。
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [candidate, active, superseded, corrected, deleted, conflicted] }
      responses:
        '200':
          description: Agent 层条目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryEntryListView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /agents/{name}/memory/proposals:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [console]
      summary: 显式提议一条 Agent 层记忆（落 candidate）
      description: 语义与 `POST /memory/proposals` 逐条一致，分层为 Agent 层；Agent 未注册 → 404。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryProposalWrite' }
      responses:
        '200':
          description: 提议回执
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryEntryReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /memory/entries/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [console]
      summary: 确认候选（唯一晋升路径）
      description: |
        `candidate` → `active`，本次操作是条目进入注入面与召回面的**唯一**用户可达路径。
        目标不存在 → 404（预读发生在留痕之前，不产生操作行）；目标已不是 `candidate` → 409 `CONFLICT`，
        **不**自动重放、**不**静默改写成其他状态。预写失败 → 500 且零改动。
        路径标识不是十进制正整数同样按 404，避免"标识格式对不对"成为存在性探针。
      responses:
        '200':
          description: 确认回执
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryEntryReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /memory/entries/{id}/correct:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [console]
      summary: 纠正一条记忆（新条替代旧条）
      description: |
        新条继承目标条的分层与分区（请求体**没有**作用域字段）。目标仍是 `active` 时：新条 `active`，
        旧条转 `corrected`，回执 `entry_id` 为新条、`replaced_id` 为旧条，两行在**同一个**事务里落定。
        目标已不在有效态时：新条落 `conflicted` 待人工裁决，回执 `state` 如实给出——页面**不得**把
        这种情况渲染成"已纠正"。正文去空白后为空 → 400。目标不存在 → 404；预写失败 → 500 且零改动。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryCorrectionWrite' }
      responses:
        '200':
          description: 纠正回执
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryEntryReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /memory/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    delete:
      tags: [console]
      summary: 软删一条记忆（立即不可召回）
      description: |
        **软删**：行、来源与审计保留，状态转 `deleted`，下一次召回起不再返回该条；派生内容（已冻结注入文本、
        既有会话）不追溯改写。重复删除幂等（回执仍是 `deleted`）。**不提供**物理删除——审计要留得下来。
        目标不存在 → 404；预写失败 → 500 且零改动。
      responses:
        '200':
          description: 删除回执
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryEntryReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================
  # 运行（Run）
  # ==========================================================
  /runs:
    get:
      tags: [runs]
      summary: 列运行
      parameters:
        - name: session_id
          in: query
          schema: { type: string }
        - name: agent
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [running, completed, limit_reached, cancelled, failed] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 运行列表（固定按 started_at 倒序；**不得**提供排序参数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RunView' }

  /runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [runs]
      summary: 查一次运行
      responses:
        '200':
          description: 运行详情（含资源清单；历史 Run 标 legacy_unrecorded）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runs/{run_id}/cancel:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [runs]
      summary: 取消一次运行
      description: |
        幂等：运行中 → 取消并回 `cancelled`；已是终态 → 200 且返回当前状态（message 说明无需取消）。
        取消语义（审计解耦、进程树清理）见 contracts/run-and-errors.md §4。
      responses:
        '200':
          description: 当前状态（cancelled 或原终态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # 管理台只读观测
  # ==========================================================
  /skills:
    get:
      tags: [resources]
      summary: 列技能库与发布状态
      responses:
        '200':
          description: 技能条目（含当前发布版本；不返回文件正文）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SkillView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resources]
      summary: 创建技能骨架
      description: 写最小 SKILL.md（name + 一句话 description），经发布闸门生成 version 1；同名存在 → 409 `CONFLICT`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillCreate' }
      responses:
        '200':
          description: 创建结果（当前发布版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /skills/import:
    post:
      tags: [resources]
      summary: 导入技能
      description: |
        只接受相对路径、普通文件；拒绝绝对路径、`..` 越界、软连接 / 目录联接、隐藏目录。
        单文件 ≤ 256 KiB、总量 ≤ 2 MiB、文件数 ≤ 200；导入不执行脚本，不做外部下载。
        同名技能存在 → 409，不静默覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillImport' }
      responses:
        '200':
          description: 导入后的当前发布版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /skills/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查技能摘要
      description: |
        返回当前发布版本的**摘要**（`SkillView`，**不含** `files[].content`）；不返回已撤销版本。
        业务读面刻意不开放文件正文——只凭摘要或旧清单做全量替换会静默覆盖他人改动，
        因此完整文件清单只在管理面 `GET /admin/skills/{name}/edit` 提供，两边不共用一个响应类型。
      responses:
        '200':
          description: 技能摘要（不含文件正文）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillView' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [resources]
      summary: 全量替换技能文件
      description: 必须先校验再落盘；`If-Match` 必须等于当前 ETag。成功后生成新发布版本，新 Run 冻结新版本。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillUpdate' }
      responses:
        '200':
          description: 新发布版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillDetail' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [resources]
      summary: 删除技能
      description: |
        被任一 Agent `skills:` 引用或活动 Run 引用时 → 400 点名引用者；不提供 force。历史版本与 Run 引用保留。
        删除只写墓碑，必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ResourceUID'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /skills/{name}/validate:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 校验技能草稿（不落盘）
      description: 只做导入边界与 SKILL.md 校验，不写管理操作审计、不执行脚本。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillUpdate' }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillValidateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/skills/{name}/edit:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 读技能完整文件清单（管理面编辑用）
      description: |
        返回**当前发布版本**的全部文件正文（含 `files[].content`）并带 `ETag`。`PUT /skills/{name}`
        是**全量替换**的条件写，编辑页必须先取到完整清单再提交——只凭摘要或旧清单提交会静默覆盖
        他人改动，因此正文只在管理面开放，业务读面 `GET /skills/{name}` 仍只回 `SkillView`。

        `?summary=true` 只回 `SkillView`（不含 `files`），供同一路径复用；两种变体都带 `ETag`。
        只读：不写管理操作行。
      parameters:
        - name: summary
          in: query
          required: false
          schema: { type: boolean, default: false, description: '`true` 只回 `SkillView`，不含文件正文' }
      responses:
        '200':
          description: 技能详情（含文件正文）或摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        anyOf:
                          - $ref: '#/components/schemas/SkillDetail'
                          - $ref: '#/components/schemas/SkillView'
          headers:
            ETag:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /catalog/mcp:
    get:
      tags: [resources]
      summary: 读 MCP 目录（只读配方集合）
      description: |
        内置只读目录，随二进制嵌入、启动时解析一次；请求期不重读文件、不访问网络。
        **只读**：不启动进程、不安装、不写配置、不发布、不写管理操作行、不改 `mcp_servers.yaml`。
        `items` 按 `id` 升序；`url` 空串表示 stdio，`command` 空串表示 http；`source_url` 必须是 https；
        `verified=false` 时 `verification_note` 非空且 `verified_at` / `verified_platforms` 为空。
        `warnings` 只回本契约枚举的 code，不返回自由文本。目录是静态集合，没有 404。
      responses:
        '200':
          description: 目录全部条目（静态集合，无分页、无排序参数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: 目录未装配（`Options.MCPCatalog` 缺失，业务码 `INTERNAL`）；不得用空目录充数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /mcp-servers:
    get:
      tags: [resources]
      summary: 列 MCP server 与连接 / 发布状态
      description: 响应**不含** env 值（只回变量名）、命令参数中的凭证或解析后的地址。
      responses:
        '200':
          description: MCP server 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/McpServerView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resources]
      summary: 登记 MCP server
      description: '`command` / `args` / `env` 是高权限配置；env 值只能是 `${ENV_VAR}`。写入经发布闸门，首版重启生效。'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpServerUpsert' }
      responses:
        '200':
          description: 登记结果（published 新版本；applied 可能仍是旧版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: |
            env 占位引用的环境变量缺失或为空（业务码 `NOT_CONFIGURED`）：先预写 `pending` 管理操作再拒绝，
            `data.operation_id` 必填且操作行已置 `failed`；文件、版本与发布指针零变化；错误只点名 server / 键 /
            变量名，不含值。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /mcp-servers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查 MCP server
      responses:
        '200':
          description: MCP server 详情（env 只回变量名）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerDetail' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [resources]
      summary: 修改 MCP server
      description: 写入新发布版本；首版仍重启生效。`If-Match` 必须等于当前 ETag。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpServerUpsert' }
      responses:
        '200':
          description: 修改结果（待重启时 pending_restart=true）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerView' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503':
          description: |
            env 占位引用的环境变量缺失或为空（业务码 `NOT_CONFIGURED`）：预写 `pending` 管理操作后再拒绝，
            `data.operation_id` 必填且操作行已置 `failed`；不新建版本、不改发布指针；错误只点名 server / 键 /
            变量名，不含值。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    delete:
      tags: [resources]
      summary: 删除 MCP server
      description: |
        被 Agent `mcp_servers:` 或活动 Run 引用时 → 400 点名；不提供 force。
        删除只写墓碑，必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ResourceUID'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /mcp-servers/{name}/diagnostics:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: MCP server 只读诊断
      description: |
        回答“按实际启动方式能否定位、环境变量是否就绪、是否待重启、有哪些已知边界”。
        **只读**：不启动进程、不连接、不写管理操作行、不改 applied / published。
        命令三态 `located` / `not_found` / `unconfirmed` 与 `reason` 组合固定（逐态列举见 schema enum）；
        `not_applicable` 只用于内部映射，不出现 JSON。`command` 对 http 传输为 `null`。
        `env` 按 `key` 升序，只回布尔，不回值；判据与运行时 env 解析一致（存在且非空为 true）。
        `pending_restart` 只由 `published_version_id != applied_version_id && published_version_id != 0` 决定，与
        `connected` 无关。诊断与测试不互相预判：`unconfirmed` 不阻塞测试尝试。
      responses:
        '200':
          description: 诊断结果（分轴：命令 / env / 重启 / warnings）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerDiagnosis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 未配置或已删除（业务码 `NOT_FOUND`，沿用既有信封错误码，不新增 `RESOURCE_NOT_FOUND`）；不返回诊断对象
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /mcp-servers/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 测试 MCP server
      description: |
        显式、有超时的连接与工具发现测试；不改变发布指针。写 `management_operations` 的 pending
        记录后再启动测试进程（预写失败不得启动）；结果与工具清单写脱敏 detail_json。
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: |
            env 占位引用的环境变量缺失或为空（业务码 `NOT_CONFIGURED`）：预写 `pending` 管理操作、置 `failed`
            后返回，`data.operation_id` 必填；**不返回测试结果对象**——页面用 `operation_id` 查 `OperationDetail`
            读 `detail.stage` / `detail.failure_class`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '504':
          description: |
            工具发现超时（业务码 `TIMEOUT`）：操作行记 `failed`，`data.operation_id` 必填；
            **不返回测试结果对象**——页面用 `operation_id` 查 `OperationDetail` 读 `detail.failure_class=timeout`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /mcp-servers/{name}/apply:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 受控应用已发布版本（只重建这一个 server）
      description: |
        把已发布版本切换为**运行生效**版本，不重启整站：其它 server 的连接与调度不受影响。
        保存、连接测试、运行生效是三件不同的事——保存即发布（写定义文件 + 生成版本 + 推进指针），
        `POST /test` 只做一次性握手，只有本端点改变运行状态；三者分别留证，任一成功都不代言另外两个。

        算法（顺序固定，任一步失败按对应分支收口）：

        1. 目标版本 = 显式 `version_id`；省略 → 资源当前 `published_version_id`。指针无行 = 资源不存在（404），没有"草稿"分支；
        2. **冻结**本次应用的两个版本号（定义版本 + 每个占位符的凭据版本）并写进操作行 `detail`；
        3. 就绪预检：依赖定位、每个占位符按其**声明来源**可取（fail-closed，先于任何进程）；
        4. 先授权（用冻结版本内容过 Policy / 命令授权）、后建连；
        5. 建新连接时旧连接仍在服务；
        6. 并发校验：期间若有 publish / revoke / 另一次 apply 改变了指针或任一冻结版本 → 丢弃本次切换：
           撤回候选工具注册、关闭候选连接，`applied` 不变，操作记 `superseded`；
        7. 注册新工具集（暂存区构建 + 加锁一次提交，epoch 递增）→ CAS 切换 `applied_version_id`
           （必须仍等于第 1 步读到的值；失败走第 6 步同一段回滚）→ 旧 epoch 进入排空态
           （窗口默认 30 秒，到点强制关闭）→ 关闭旧连接；
        8. 新连接失败 → 关闭新连接，`applied` 不变，操作记 `failed` + 失败分类。旧连接**仅当仍然合法**
           才保留：若本次冻结版本含已撤销凭据，旧连接一并关闭并把 `applied` 标 stale——不得因为 apply
           失败就把撤销"顺延"下去。

        `If-Match` 必须等于该资源的条件 ETag（缺失 / 弱 ETag / `*` → 412 零写入、零操作行）。
        预写之后的失败一律置 failed 并回 `data.operation_id`；`detail_json` 与成功响应同形
        （`McpServerApplyResult` 去掉 `server`），不放命令原文、URL 凭据或 env 值。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpServerApplyRequest' }
      responses:
        '200':
          description: 应用成功（`outcome=applied`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerApplyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 授权拒绝（业务码 `FORBIDDEN`，先于建连；失败分类 `policy_denied`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            被并发写取代（业务码 `MCP_APPLY_SUPERSEDED`）：候选工具注册已撤回、候选连接已关闭，
            `applied` 与旧连接不变；`data.operation_id` 必填，页面据此查 `OperationDetail.detail`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500':
          description: |
            建连或注册失败、且失败在预检之后（业务码 `MCP_APPLY_FAILED`）：`applied` 不变，
            `data.operation_id` 必填；失败分类以 `OperationDetail.detail.failure_class` 为准
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '503':
          description: |
            预检拒绝（未启动任何进程）：依赖缺失 → `NOT_CONFIGURED`（点名组件与期望版本）；占位符按声明来源
            取不到值 → `NOT_CONFIGURED`（点名 server / 键 / 环境变量名，不含值）或 `CREDENTIAL_UNAVAILABLE`；
            实例无可用主密钥 → `SECRETS_RECOVERY_REQUIRED`。`data.operation_id` 必填（预检在预写之后）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ==========================================================
  # 公共资源版本、发布与引用
  # ==========================================================
  /resources/{kind}/{id}/references:
    parameters:
      - $ref: '#/components/parameters/ResourceKind'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [resources]
      summary: 查资源引用
      description: |
        返回引用该资源的 Agent 与活动 Run；删除闸门据此拒绝并点名。Agent 引用包含两类：`resource_bindings`
        中指向该 `resource_uid` 的绑定（含归档 Agent；权威），以及定义名引用（解析失败按可能引用处理）。
        活动 Run 引用来自未释放的 `run_resource_refs` / `run_notify_refs`。
      responses:
        '200':
          description: 引用清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceReferencesView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{kind}/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/ResourceKind'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [resources]
      summary: 列资源历史版本
      description: |
        已发布迁移只追加；版本内容不可改写。撤回 = 以旧版本内容创建新版本，不改历史。
        版本按 `(resource_kind, resource_uid, version_no)` 归属：只按名称查询默认只回当前指针 UID 的版本；
        查旧 UID（同名重建前的历史）必须显式给 `resource_uid`。
      parameters:
        - name: resource_uid
          in: query
          required: false
          schema: { type: string }
          description: 显式指定资源身份；省略 = 当前指针 UID
      responses:
        '200':
          description: 版本列表（按 version_no 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ResourceVersionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{kind}/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ResourceKind'
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [resources]
      summary: 发布资源版本
      description: |
        不带 `version_id` 时发布当前最新版本（幂等）。带旧 `version_id` 时按该版本内容**创建新版本**
        再发布，返回新版本；不修改历史版本。Provider / 技能立即生效，MCP 首版重启后生效并回 `pending_restart=true`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200':
          description: 发布后的版本与生效状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourcePublishResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503':
          description: |
            仅 `kind=mcp_server`：env 占位引用的环境变量缺失或为空（业务码 `NOT_CONFIGURED`）：预写 `pending`
            管理操作后再拒绝，`data.operation_id` 必填且操作行已置 `failed`；不新建版本、不改发布指针。
            幂等发布（无变更）在闸门之前短路，不因瞬时环境缺失被拒，也不宣称环境已满足。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /resources/{kind}/{name}/credential/revoke:
    parameters:
      - $ref: '#/components/parameters/CredentialOwnerKind'
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 撤销资源托管凭据（全部版本）
      description: |
        撤销该资源 UID 的整个凭据身份：全部版本置 `revoked`、活动密文置 NULL、`revocation_epoch + 1`，
        资源条件 ETag 随之变化。**不需要读取主密钥、不解密**；不删除资源、不删除历史版本。
        之后重新录入生成新版本，旧版本永不复活；在途 Run 在下一次模型调用检查点或下一次通知发送失败。
        env 模式的资源没有托管凭据，调用返回 400。请求体必须带 `resource_uid` 与 `confirm: true`，
        `If-Match` 必须匹配资源条件 ETag；`resource_uid` 与凭据 owner 不符（借用其他资源的凭据 ID）→
        409 `CREDENTIAL_OWNER_MISMATCH`，不跨资源复用。

        `kind=mcp_server` 时**必须**带 `binding_key`，只撤销那一个占位符，并把该 server 的连接按失效态
        受控回收（stdio 关进程树、HTTP 关会话）——**不等下一次 apply**；进程可能已持有原环境变量，留着它
        等于"撤了还在用"。撤销是终态：同一占位符此后**不回落**进程环境，重新录入才生成新版本。已发出的
        外部操作无法追溯撤回，只在运行记录里标明该调用用的是已撤销的凭据版本。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialRevokeRequest' }
      responses:
        '200':
          description: 撤销结果（只回状态与版本，不含凭据材料）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CredentialRevokeResult' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /resources/{kind}/{name}/scope:
    parameters:
      - $ref: '#/components/parameters/CredentialResourceKind'
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 切换资源使用范围
      description: |
        `shared` ⇄ `exclusive`。转专属必须给 `owner_agent`，且该 Agent 已存在。共享转专属前检查其他 Agent 的
        `resource_bindings`、活动 Run 与消息路由引用；被引用 → 409 `RESOURCE_SCOPE_IN_USE` 并点名，**不提供 force**，
        不自动解绑。有资格使用 `all_eligible` 的 Agent 作为影响提示返回，不静默移除。请求体必须带 `resource_uid`，
        与当前指针不一致 → 409 `RESOURCE_UID_MISMATCH`；`If-Match` 必须匹配资源条件 ETag。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceScopeRequest' }
      responses:
        '200':
          description: 切换后的资源视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceScopeResult' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /resource-versions/{version_id}:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查单个资源版本
      description: 返回脱敏后的定义；凭证只能是 `${ENV_VAR}` 引用。
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceVersionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # 管理操作审计
  # ==========================================================
  /operations:
    get:
      tags: [operations]
      summary: 列管理操作
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: target_kind
          in: query
          schema: { type: string, enum: [agent, schedule, model_connection, mcp_server, skill, notify_channel, network_allowlist, network_denylist, execution_policy, network_exception, system, caller, instance, memory, knowledge_upload, knowledge_document, knowledge_collection] }
        - name: target_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, success, failed, unknown] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 管理操作列表（固定按 created_at 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OperationView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operations/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [operations]
      summary: 查管理操作详情
      description: 返回脱敏 detail_json；`unknown` 表示崩溃窗口内结果未查证，需按独立操作契约恢复或补偿，**不得**盲目重做。
      responses:
        '200':
          description: 操作详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sandbox:
    get:
      tags: [console]
      summary: 查沙箱白名单
      description: |
        展示白名单（路径 / 可执行名 / 受控解释器 / 域名）。文件路径、可执行名与受控解释器**只读**，
        修改需改配置并重启；出网域名（`http_allowed_domains`）是**当前实际生效**值，可在管理台
        「执行环境」页通过 `PUT /sandbox/network-domains` 保存、立即生效、无需重启。响应附
        `network_allowlist` 生效元数据（ETag / 修订号 / 来源 / 最近写入时间与写入者）。
      responses:
        '200':
          description: 白名单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SandboxView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sandbox/network-domains:
    put:
      tags: [console]
      summary: 保存网络域名白名单（条件写，立即生效）
      description: |
        唯一权威源是数据库中的单行策略：`basalt.yaml` 的 `http.allowed_domains` 只在首次启动、
        表内无行时作为种子，此后改配置不覆盖管理台写入的值。保存成功后新规则对**下一次**出站
        判定立即生效，无需重启；已在途的连接与请求不会被撤回，收紧后不再被允许的 MCP http 长连接
        会断开且**不**自动重连（放宽不重连）。全部域名先规整（去空白、小写、去重、升序），
        非法条目 → 400 并点名第一处；`domains: []` 是合法值（受此策略约束的出站请求全部拒绝）。

        **必须**带 `If-Match` 强 ETag（取自 `GET /sandbox` 的 `network_allowlist.etag`）。缺失、
        弱 ETag 或 `*` → 412 且零写入；陈旧 ETag 同样 412，响应 `data.current_etag` 给出当前值，
        页面应重取后再改。写入按修订号做 CAS，并发修改落败方 → 409 且零写入。校验或前置条件
        失败不留管理操作行；一旦写入 `pending`，后续失败一律置 failed 并在 `data.operation_id`
        返回操作标识。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkDomainsWrite' }
      responses:
        '200':
          description: 保存后的实际生效状态（重新读出，不是回显请求体）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SandboxView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ==========================================================
  # 执行环境（档位 / 禁止域名 / 访问例外）
  # ==========================================================
  /execution-policy:
    get:
      tags: [console]
      summary: 读执行档位与迁移待确认项
      description: |
        返回当前生效的执行档位（`standard` / `strict`）与生效元数据（强 ETag / 修订号 / 来源 /
        最近写入），并给出升级迁移的两组**待确认项**。权威源是单行表 `execution_policy`；
        `basalt.yaml` 的 `execution.profile` 只在表内无行时作首次种子。

        待确认项来自只读扫描：① 出网白名单中**解析到受保护地址段**的条目；② 命令白名单中
        **命中交互式 shell 名称集合**的条目。页面据此给「加例外」/「保持拒绝」两个显式动作
        （分别写 `network_exception.create` 与 `execution_policy.confirm` 审计行）。已登记例外、
        或已记录 `deny` 选择的条目不再列出——**未确认不放行**：受保护地址段与 shell 名称默认拒绝，
        不因"管理员没看"而改变。域名解析失败（NODATA / 超时）的条目不计入待确认项，也不猜测。

        **只读**：不启动进程、不建网络连接、不写管理操作行、不改策略。
      responses:
        '200':
          description: 当前档位、生效元数据与待确认项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExecutionPolicyView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [console]
      summary: 切换执行档位（条件写，立即生效）
      description: |
        `standard` ⇄ `strict`。保存成功后**下一次**授权判定即按新档位执行，无需重启；在途 Run 与
        已建立的连接不追溯撤回。两档共享同一套基础防护（DNS 解析校验、连接目标固定、忽略环境变量
        代理、shell 名称集合），差异只在授权范围：`standard` 放行未命中禁止域名的公网域名与安装
        清单内的程序目录可执行件，`strict` 只放行显式白名单。本端点**不**顺带修改白名单、禁止域名
        或访问例外——一次写入只表达一次档位变更。

        `expected_profile` 是确认方向的一部分：页面确认框写的是"从 X 切到 Y"，客户端必须把渲染时
        看到的档位放进 `expected_profile`；与库内当前档位不一致 → 409 `EXECUTION_PROFILE_MISMATCH`
        且零写入、零操作行（不得用陈旧对话框静默执行一个用户没确认过的方向）。

        `If-Match` 必须等于 `GET /execution-policy` 的强 ETag（缺失 / 弱 ETag / `*` → 412 零写入、
        零操作行）。写入按修订号做 CAS，并发落败 → 409 零写入；预写 `pending` 之后的失败一律置
        failed 并回 `data.operation_id`。管理动作记为 `execution_policy.update`，`target_id` 固定
        `global`，`detail_json` 只放前后档位与修订号（不放待确认项正文）。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionPolicyWrite' }
      responses:
        '200':
          description: 保存后的实际生效状态（重新读出，不是回显请求体）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExecutionPolicyView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `expected_profile` 与库内当前档位不一致（业务码 `EXECUTION_PROFILE_MISMATCH`），或修订号
            CAS 落败（业务码 `CONFLICT`）。两种情况都零写入；`data.operation_id` 只在预写之后失败时出现
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /execution-policy/confirmations:
    post:
      tags: [console]
      summary: 记录一条迁移待确认项的「保持拒绝」处置
      description: |
        `GET /execution-policy` 的每个待确认项给两个显式动作，**不自动勾选、不默认放行**：

        - 「加例外」→ `POST /network-exceptions`（写 `network_exception.create`）
        - 「保持拒绝」→ 本端点（写 `execution_policy.confirm`）

        本端点只记录处置，**不改授权结论**：受保护地址段与 shell 名称本来就默认拒绝，这条记录的作用是
        让该项不再出现在待确认列表里，证明管理员逐条看过。因此它**不**修改 `execution_policy` 行、
        不推进修订号，**不需要** `If-Match`；`pending_confirmations` 是只读派生信息，不参与
        `ExecutionPolicyView` 的强 ETag。

        重复记录同一条（已存在的 `success` 行）返回 200 且 `already_recorded: true`，不重复写审计行。
        `id` 不在当前待确认集合内（已加例外、或扫描条件不再成立）→ 400 点名该标识；**不**按
        `id` 猜条目、**不**为未知标识留记录。

        预写 `pending` 管理操作行是硬前置：预写失败 → 500 且不记录任何处置。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyConfirmationWrite' }
      responses:
        '200':
          description: 处置结果；`already_recorded=true` 表示此前已记录且本次未新增审计行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PolicyConfirmationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /sandbox/denied-domains:
    put:
      tags: [console]
      summary: 保存禁止域名表（条件写，立即生效）
      description: |
        禁止域名与出网白名单共用 `network_domain_policy` 的两行（`policy_scope = http.denied_domains`），
        语法与白名单完全相同（去空白、小写、去重、升序；`*.example.com` **不**匹配 `example.com`
        本身）。**两档都先生效**：命中即拒，不再看白名单；`domains: []` 是合法值（没有禁止条目）。

        其余语义与 `PUT /sandbox/network-domains` 逐条一致：`If-Match` 必填，缺失 / 弱 ETag / `*`
        → 412 零写入；非法条目 → 400 并点名第一处；陈旧 ETag → 412 且 `data.current_etag` 给出当前值；
        修订号 CAS 落败 → 409 零写入；校验与前置条件失败**不留**管理操作行；预写 `pending` 之后的
        失败一律置 failed 并回 `data.operation_id`。管理动作记为 `network_denylist.update`，
        `target_id` 为固定字面量 `http.denied_domains`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkDomainsWrite' }
      responses:
        '200':
          description: 保存后的实际生效状态（重新读出）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SandboxView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /network-exceptions:
    get:
      tags: [console]
      summary: 列内网访问例外
      description: |
        例外只管**网络**：文件由目录边界决定、命令由白名单 / 安装清单决定，不在这里开口子。
        `standard` 下用于放行受保护地址段；`strict` 下等价于一条白名单条目，另可放行受保护地址段。
        云元数据地址（`169.254.169.254` / `fd00:ec2::254`）**任何档位都不放行**，也不能登记为例外。

        响应 `etag` 是整份例外集合的强 ETag（按 `kind` + `value` 排序后摘要），是
        `DELETE /network-exceptions/{id}` 的 `If-Match` 唯一取值来源。列表稳定排序（`kind` 升序、
        `value` 升序）。
      responses:
        '200':
          description: 例外清单与集合 ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NetworkExceptionListView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [console]
      summary: 新增访问例外（理由必填）
      description: |
        `note` 必填且不能全是空白——放行必须带理由，理由进审计。`kind=host` 收主机名（与出网白名单
        同一套规整与通配语法）；`kind=ip_port` 收 `IP:端口` 字面量。同一 `(kind, value)` 重复登记 →
        409 `CONFLICT`（不覆盖既有理由）。云元数据地址 → 400 并点名该地址永不放行。

        写入先预写 `pending` 管理操作（动作 `network_exception.create`，`target_kind`
        `network_exception`，`target_id` 为例外标识）；预写失败即拒绝执行且不留行。预写之后的失败
        置 failed 并回 `data.operation_id`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkExceptionCreate' }
      responses:
        '200':
          description: 新建的例外（含 `operation_id`）与新的集合 ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [etag, exception]
                        properties:
                          etag: { type: string, description: 写入后整份集合的强 ETag }
                          exception: { $ref: '#/components/schemas/NetworkExceptionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /network-exceptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^exc_[0-9A-HJKMNP-TV-Z]{26}$' }
        description: 例外标识（`exc_` + 26 位 Crockford Base32）
    delete:
      tags: [console]
      summary: 删除访问例外（条件写）
      description: |
        删除后**立即**失效：下一次授权判定不再放行该地址，在途连接与请求不追溯撤回。`If-Match` 必须
        等于 `GET /network-exceptions` 的集合 ETag——保证删的是"看过的那一份集合"；缺失或过期 → 412
        零写入、零操作行。例外不存在 → 404。管理动作记 `network_exception.delete`，`target_id` 为该
        例外标识；预写之后的失败置 failed 并回 `data.operation_id`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 删除结果与新的集合 ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NetworkExceptionDeleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ==========================================================
  # 实例加密（主密钥状态与显式初始化）
  # ==========================================================
  /instance/secrets:
    get:
      tags: [console]
      summary: 实例加密状态与托管凭据小结
      description: |
        管理台「系统总览」的两行数据：① 实例加密服务状态；② 当前托管凭据按来源与状态计数。
        状态由**三项联立**判定（初始化记录 / 密钥文件 / 现存托管密文），单看"文件在不在"不作结论：
        `ready` 才回 `key_id`；`recovery_required` 时**不**回密钥材料、**不**生成替代密钥，只给固定
        原因码与恢复指引；任何托管凭据操作随后返回 `SECRETS_RECOVERY_REQUIRED`。

        响应**不含**密钥材料或指纹原文；`key_file` 只回路径（供备份指引）。**只读**：不创建目录、
        不写文件、不写管理操作行。
      responses:
        '200':
          description: 实例加密状态（两行）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InstanceSecretsView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /instance/secrets/init:
    post:
      tags: [console]
      summary: 显式初始化实例主密钥（存量实例）
      description: |
        给存量实例的一次性人类动作（等同 `basalt secrets init`）。新建实例首次启动已自动完成，此端点
        只处理 `uninitialized` 的存量库；请求体必须带 `confirm: true`。

        规则与自动初始化逐条相同：先建受限目录并**读回校验通过后才创建任何文件**；发布**不覆盖**既有
        文件（`O_EXCL` / `os.Link`）；只清理能由 `os.SameFile` 证明来源的临时链接；全程只生成一把密钥。
        预写 `pending` 管理操作（动作 `system.secrets_init`，`target_kind` `system`）之后再动手，
        预写失败即拒绝执行。下列状态判定都在预写**之前**完成，因此 409 不留操作行：

        - `ready` → 409 `CONFLICT`（已初始化，**不覆盖**）
        - `recovery_required` → 409 `SECRETS_RECOVERY_REQUIRED`（**不生成替代密钥**；按恢复矩阵处置，
          既有文件一个字节都不动）
        - `uninitialized` → 初始化成功后 200，返回与 `GET /instance/secrets` 相同的投影
        - 并发：实例锁 + `instance_secrets` 主键 + `O_EXCL` 三重保险，后到者读到已存在记录即放弃生成
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceSecretsInitRequest' }
      responses:
        '200':
          description: 初始化后的状态（`state=ready`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InstanceSecretsView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            已初始化（业务码 `CONFLICT`，不覆盖），或实例处于恢复态（业务码 `SECRETS_RECOVERY_REQUIRED`，
            不生成替代密钥）。两者都在预写之前判定：零写入、零操作行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ==========================================================
  # 模型连接（Provider 发布）
  # ==========================================================
  /model-connections:
    get:
      tags: [resources]
      summary: 列模型连接与发布 / 生效版本
      description: |
        响应**不含**任何 api_key 值：env 模式只回 `${ENV_VAR}` 引用名（`api_key_env`）；managed 模式只回
        `credential_ref` / `credential_state` / `last4`。每项带不可变 `resource_uid`、`scope` 与 `owner_agent`。
      responses:
        '200':
          description: 模型连接列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModelConnectionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resources]
      summary: 新建模型连接
      description: |
        凭据两种模式：`credential_mode: env` 时 `api_key` 必须是精确 `${ENV_VAR}` 引用；`credential_mode: managed`
        时 `api_key` 是 **write-only 完整新值**（服务端 AES-256-GCM 加密落库，响应只回 `credential_ref` / `last4`）。
        创建时未声明 `credential_mode` 只按 env 规则；普通值且未声明 → 400 `CREDENTIAL_MODE_REQUIRED`，不推断为 managed。
        `scope` 取 `shared`（缺省）或 `exclusive`；`exclusive` 必须给 `owner_agent`，且该 Agent 已存在。
        成功后构建不可变 ProviderCatalog、原子替换发布指针；新 Run 在准入时固定该映射；失败保旧。同名活动连接存在 → 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConnectionUpsert' }
      responses:
        '200':
          description: 新建结果（published 与 applied 同一版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /model-connections/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查模型连接
      responses:
        '200':
          description: 模型连接详情（env 只回引用名；managed 只回凭据引用 / 状态 / 尾号）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionView' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [resources]
      summary: 修改模型连接
      description: |
        `If-Match` 必须等于当前资源 ETag（资源 ETag 含定义、范围、凭据版本与状态、`revision`）。
        `api_key` 省略 = 保留当前凭据；env 模式提供精确 `${ENV_VAR}`；managed 模式替换必须给完整新值，空串 → 400。
        更新未声明 `credential_mode` 保持当前模式；显式切换必须给出目标模式所需的值（env → managed 需新值，
        managed → env 需 `${VAR}`）。请求体出现只读 `credential_ref` → 400 `CREDENTIAL_REF_READ_ONLY`。
        成功后立即发布，新 Run 使用新映射；已在途 Run 继续使用准入时固定的旧映射与旧凭据版本（撤销除外）。
        范围转换不在此端点，走 `POST /resources/{kind}/{name}/scope`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConnectionUpsert' }
      responses:
        '200':
          description: 修改结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionView' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [resources]
      summary: 删除模型连接
      description: |
        被任一 Agent 的 `resource_bindings`（含归档 Agent）、定义名引用或活动 Run 引用时 → 400 点名引用者；不提供 force。
        删除只写墓碑（`resource_identities.state='deleted'`），历史版本、凭据与引用记录保留；同名重建生成新 `resource_uid`，
        旧绑定不自动接管，版本号从 1 重新计。必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ResourceUID'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /model-connections/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 测试模型连接
      description: |
        用发布版本发一次最小协议调用（有超时）。**不创建 Run、不写 `llm_calls`**；写
        `management_operations` 的 pending 记录后再发调用（预写失败不得发调用），结果脱敏落 detail_json。
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '504': { $ref: '#/components/responses/Timeout' }

  # ==========================================================
  # Agent 动态管理
  # ==========================================================
  /agents:
    post:
      tags: [agents]
      summary: 模板脚手架创建 Agent
      description: 名字 + 描述 → 写出最小可加载的 Agent 目录。**先验后写**，任一步失败回滚（不留残余目录）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Agent 名（= 目录名） }
                description: { type: string }
                model: { type: string, description: 留空写入可见占位符「请在此填写模型名」 }
      responses:
        '200':
          description: 创建结果（落盘后的真值）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /agents/{name}/config:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      summary: 读结构化 Agent 配置（表单视图）
      description: |
        返回结构化字段值、**一个**与 `GET /agents/{name}/content` 完全一致的强 `content_etag`，以及每个引用的
        解析状态（绑定 UID、名称、是否已删除、是否仍有资格、`notify_mode` 的有效值）。原文编辑继续用
        `GET/PUT /agents/{name}/content`；两者不是二选一。**不引入** `config_etag`——表单保存与原文保存共用
        `content_etag`。
      responses:
        '200':
          description: 结构化配置与解析状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentConfigView' }
          headers:
            ETag:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{name}/content:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      summary: 读整份 AGENT.md（配置编辑器）
      description: 响应头 `ETag` 与 data.etag 同为强 ETag：`"sha256:<64 位小写十六进制>"`，按原始 UTF-8 字节计算。
      responses:
        '200':
          description: 文件全文与 ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentContent' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [agents]
      summary: 写 AGENT.md（整份或结构化补丁）
      description: |
        经**同一段**注册写入门（先验后写）：校验不通过 → 400 且**磁盘逐字节不变**。
        `If-Match` 必须等于当前 `content_etag`（表单 `changes` 与整份 `content` **共用同一个**）；
        缺失、格式非法、弱 ETag、`*` 或与当前值不匹配 → 412。
        结构化补丁无法保持注释时 → 400 `EDIT_UNSUPPORTED`，不落盘。成功后生成新的 ConfigSnapshot 与 ETag。
        保存期还须校验 `resource_bindings` 与 `provider.name` / `notify_channels` 一一对应、UID 是当前发布指针、
        已发布且有资格；缺失 / 非法 / 无资格 → 400 `AGENT_RESOURCE_BINDING_MISSING` / `AGENT_RESOURCE_BINDING_INVALID` /
        `RESOURCE_NOT_ELIGIBLE` / `CREDENTIAL_REVOKED`，零写入。服务端**不补绑**、不按名解析、不猜意图。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentContentUpdate' }
      responses:
        '200':
          description: 保存结果（保存即生效，无需重启）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /agents/{name}/generate-files:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 一句话生成 Agent 目录草稿
      description: |
        模型起草一份或多份文件（必含 `AGENT.md`）。**不落盘、不注册、不要求该 Agent 已存在**——
        唯一写入是 LLM 调用审计（关联标识 `agent-author-<name>`），**不产生**管理操作行。
        草稿边界：路径规则同多文件提交（相对路径、规范化后仍在目录内、拒绝 `..` / 绝对路径 / 盘符 / NUL）；
        内容必须为 UTF-8 文本；文件数 ≤ 64；单文件 ≤ 256 KiB；总量 ≤ 1 MiB（且不超过 `http.max_request_bytes`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, description: 一句描述（可带 provider / model 提示） }
                answers:
                  type: array
                  maxItems: 3
                  description: |
                    可选：上一轮 `questions` 的逐项回答（R6 问答补全）。最多 3 条；`id` / `question`
                    非空且各 ≤ 256 字符，`answer` 去空白后非空且 ≤ 2000 字符，`id` 不重复。
                    答案只在本次请求内进入提示词，**不落盘、不进日志、不写审计正文**。
                  items:
                    type: object
                    required: [id, question, answer]
                    properties:
                      id: { type: string }
                      question: { type: string }
                      answer: { type: string }
      responses:
        '200':
          description: 草稿文件集合（未落盘，含可编辑正文）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentDraftView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  /agents/{name}/schedule-draft:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 一句话生成定时任务候选（不保存）
      description: |
        一次作者模型调用生成一条定时任务候选。**不写管理操作行、不落盘、不注册、不改调度器**——
        唯一写入是 LLM 调用审计（关联标识 `agent-schedule-<name>`）。候选的 `id` / `cron` / `zone` /
        `message` 复用装载期同一套规则校验（6 段、公共子集、`CRON_TZ=` 拼接后可解析、zone 可加载
        且非 `Local`、message 非空）；`next_runs` 只在服务端计算。候选**不自动保存**：确认后走
        `PUT /agents/{name}/content` 的 `changes.schedules` 条件写，id 与现有任务冲突由页面阻止。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, description: 一句话指令（去空白后非空，≤ 1000 字符） }
      responses:
        '200':
          description: 未保存的定时候选与服务端计算的未来三次触发时间
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ScheduleDraftView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  /agents/{name}/files:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      summary: 读 Agent 受管文件集合（多文件编辑的基础版本）
      description: |
        返回 Agent 目录内的受管文件清单与强 ETag。受管文件 = Agent 目录下的普通文件（不含 `.staging` / `.backup`
        残留、不跟随软连接）。ETag = 对按 path 升序排列的 `(path, sha256(内容))` 规整序列化后的 sha256，
        形如 `"sha256:<64 位小写十六进制>"`；与 `GET /agents/{name}/content` 的单文件 ETag **不可互换**。
      responses:
        '200':
          description: 文件清单与基础版本 ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
          headers:
            ETag:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [agents]
      summary: 提交多文件草稿
      description: |
        先校验（含 AGENT.md / 相对路径规范化后仍在目录内 / 整份配置过加载期校验 / 定时 id 不撞车）→ 才动磁盘。
        `If-Match` 必须等于 `GET /agents/{name}/files` 返回的受管文件集合 ETag；缺失、格式非法、弱 ETag、`*`
        或不匹配 → 412，**不落盘、不写管理操作行**。比较与 staging 构建在同一 Agent 写锁内完成（锁内重新读取基础版本）。
        写入在 **staging 目录**构建完整副本（原目录不动），校验通过后经**两次 rename** 完成目录交换（原目录先移为 `.backup`，staging 移为正式目录，再删 `.backup`）——
        崩溃窗口有界：启动时按残留判定**回滚**（正式目录缺失、`.backup` 在）或**前滚**（正式目录完整、`.backup` 尚在，清理残留），见 contracts/run-and-errors.md §4.3.2 第 5 步。
        返回的**是落盘后的真值**（重新读取，不是请求回声）。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { $ref: '#/components/schemas/FileDraft' }
      responses:
        '200':
          description: 落盘后的真值
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /agents/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [agents]
      summary: 归档删除 Agent
      description: |
        顺序：注销定时 → 标记 archived → 移出注册索引 → **取消该 Agent 在跑的 Run 并等待退出（默认 30 秒）**
        → 目录移入 `.basalt/archive/`（同名以时间戳唯一化）。等待超时 → 409 `AGENT_BUSY` 并点名活动 Run，
        恢复注册与状态，不留半残态。归档失败同样恢复。**会话 / 记忆 / 审计数据一律不动**。
        该 Agent 的定时登记**不物理删**（置下线标记），历史执行记录保留、数据库外键永不撞。
      responses:
        '200':
          description: 归档结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentArchiveView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agents/{name}/disable:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 停用 Agent
      description: |
        与 Run 准入共用 Agent 级一致性边界：校验 expected_state / expected_generation，原子写状态文件
        （generation+1）后更新索引。停用**不取消**在途 Run，只拒绝新准入；disabled 仍可见。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentLifecycleTransition' }
      responses:
        '200':
          description: 新生命周期状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentLifecycleView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agents/{name}/enable:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 启用 Agent
      description: |
        同一准入边界：expected_state 必须为 disabled，原子写状态文件（generation+1）后更新索引。
        启用后仍要求加载期校验与全部资源引用通过，否则拒绝新准入并保留可见错误。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentLifecycleTransition' }
      responses:
        '200':
          description: 新生命周期状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentLifecycleView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agents/{name}/readiness:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      summary: 读 Agent 就绪视图（启用前置校验的只读投影）
      description: |
        回答"这只 Agent 离能跑还差什么"，与 `POST /agents/{name}/enable` 的前置校验**共用同一份判定**。
        `pending` 非空即**不可启用**：缺模型连接、缺该 Agent 所需的服务凭据、资源引用没有已发布版本；
        启用端点据此 409 `AGENT_UNAVAILABLE` 并逐项点名 + 给跳转。
        `notices` 只提示、**不**阻止启用：通知渠道缺失（可选）、`settings.max_iterations` 被实例上限压住、
        启用了计划的 Agent 数可能超过并发上限（`429 TOO_MANY_RUNS`）。点名**不**改任何一侧的配置。
        本端点只读：不启动进程、不连接、不写操作行、不改配置；资源视图读不到 → 500，
        **不**降级成"就绪"。
      responses:
        '200':
          description: 就绪视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentReadiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500':
          description: 资源视图不可读，就绪状态不可确认（业务码 `INTERNAL`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /agents/{name}/copy:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 复制 Agent
      description: |
        复制目录内容到新 Agent 名；副本获得**新 `agent_uid`**，默认 `disabled`，并清空 `schedules`（避免全局 cron id 撞车）。
        共享资源绑定随目录携带（UID 不变）；源 Agent 引用任何**源专属**模型连接 / 通知渠道时，必须提供
        `resource_mapping` 逐项显式映射，否则 409 `AGENT_COPY_BLOCKED` 并列出资源名与类型，不产生副本。
        不复制源凭据、不复制源 `agent_uid`、不自动绑定源专属资源；`notify_mode` 按源模式处理，不用空数组冒充 `none`。
        新名已存在 → 409；复制失败不留残余目录。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCopyRequest' }
      responses:
        '200':
          description: 新 Agent 文件清单与生命周期
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /archived-agents:
    get:
      tags: [agents]
      summary: 列已归档 Agent
      responses:
        '200':
          description: 归档列表（按 archived_at 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ArchivedAgentView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /archived-agents/{archive_id}/restore:
    parameters:
      - name: archive_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 恢复已归档 Agent
      description: 恢复到原目录（或指定新名）；恢复后默认 `disabled`，清空 `schedules`；目标名已存在 → 409。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRestoreRequest' }
      responses:
        '200':
          description: 恢复结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ==========================================================
  # 定时任务
  # ==========================================================
  /schedules:
    get:
      tags: [schedules]
      summary: 列定时任务
      responses:
        '200':
          description: 任务列表（定义源在各 AGENT.md；此表只存状态）。重启对账：**enabled 以库为准、定义以文件为准**（文件改动不回翻停用）；Agent 归档删除的任务置**下线标记**（不物理删，历史执行记录保留）；停机期间错过的触发点**不补跑**（记 WARN，补跑走 `/schedules/{id}/run`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ScheduleView' }

  /schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [schedules]
      summary: 启用 / 停用任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedules/{id}/executions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [schedules]
      summary: 列执行历史
      responses:
        '200':
          description: 执行记录（固定按 started_at 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ExecutionView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedules/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [schedules]
      summary: 立即执行一次（手动补跑）
      description: 走与到点触发**完全相同**的链路；审计以 `trigger=manual` 区分。所属会话已归档时返回 **400**（业务规则拒绝，文案沿用会话写拒绝「会话已归档，不可追加消息」）。
      responses:
        '200':
          description: 本次触发的 Run 结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该任务上一轮尚未结束（幂等跳过语义见技术方案§6.3）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429': { $ref: '#/components/responses/TooManyRuns' }
        '504': { $ref: '#/components/responses/Timeout' }

  # ==========================================================
  # 通知渠道
  # ==========================================================
  /notify-channels:
    get:
      tags: [notify]
      summary: 列通知渠道
      description: |
        响应中地址**只回 scheme + host**（`url_host`），原始地址（含 token）没有任何载体。每项带不可变
        `resource_uid`、`scope` / `owner_agent`、`credential_mode`、`credential_ref` / `credential_state` /
        `last4`、`address_status` 与 `revision`。`url_host` 为空**不等于**未配置（env 引用或 managed 密文都可能无 host）。
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/NotifyChannelView' }
    post:
      tags: [notify]
      summary: 登记通知渠道
      description: |
        地址两种模式：`credential_mode: env` 时 `url` 必须是精确 `${ENV_VAR}` 引用（发送时解析）；
        `credential_mode: managed` 时 `url` 是 **write-only 完整地址**（AES-256-GCM 加密落库，响应只回 host 与尾号）。
        创建未声明模式只按 env 规则；普通 URL 且未声明 → 400 `CREDENTIAL_MODE_REQUIRED`。
        `scope` 取 `shared`（缺省）或 `exclusive`；`exclusive` 必须给 `owner_agent`。
        写前预跑沙箱域名校验，失败文案只含 host。同名活动渠道 → 400 `BAD_REQUEST`（与 FR-059 一致，不新增 `CONFLICT`）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyChannelUpsert' }
      responses:
        '200':
          description: 登记结果（只回 host）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotifyChannelView' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /notify-channels/types:
    get:
      tags: [notify]
      summary: 列页面可选的渠道类型
      description: 返回页面下拉框的**可选项**投影（当前只有 `feishu`——`webhook` 是地址形态而不是渠道类型，不对新建渠道暴露）；写侧校验仍接受适配器注册表里的全部类型，既有 `webhook` 渠道照常编辑与发送。类型支持集只有**一份真值**（装配层显式映射表）。
      responses:
        '200':
          description: 类型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: string, example: feishu }

  /notify-channels/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [notify]
      summary: 更新渠道
      description: |
        **url 省略 = 保留原值**；页面不回填已存地址。env 模式给精确 `${ENV_VAR}`；managed 模式替换必须给完整
        新地址，空串 → 400。更新未声明 `credential_mode` 保持当前模式；显式切换必须给出目标模式所需的值。
        请求体出现只读 `credential_ref` → 400 `CREDENTIAL_REF_READ_ONLY`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyChannelUpsert' }
      responses:
        '200':
          description: 更新结果（只回 host）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotifyChannelView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [notify]
      summary: 删除渠道
      description: |
        先按 `resource_bindings` 的 UID（含归档 Agent）与各 AGENT.md 正文**整词**匹配渠道名；被引用 → 400 并点名
        那些 Agent。`?force=true`（字面 true）强删。删除只写墓碑，历史、凭据与发送记录保留；同名重建生成新
        `resource_uid`，旧绑定不自动接管。必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/ResourceUID'
        - name: force
          in: query
          schema: { type: string, enum: ['true'] }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400':
          description: 渠道被 AGENT.md 引用（响应点名引用者）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notify-channels/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [notify]
      summary: 测试渠道连通性
      description: |
        先写 `notify_channel.test` 管理操作行（预写失败不发请求），再经**与定时代投 / `notify` 工具
        同一个**发送面发出一条固定文案 `Basalt 连通性测试`——接收方一眼可区分测试与真实通知。
        成功判定：HTTP 2xx；飞书还要求业务回执 `code == 0`。回执无法解析 / 超时 → `status=unknown`
        （可能已送达，**不得**自动重发）；未知是测试结论，仍是 200 + `ok=false`，不是接口错误。
        结果同时写入「最后一次连接测试」投影，列表页的 `last_test` 随之更新。地址完全未配置 →
        503 `NOT_CONFIGURED`，且投影记为 failed（不得显示成已验证）；渠道不存在 → 404。
      responses:
        '200':
          description: 测试已执行（`ok=false` 是失败或结果未知，不是接口错误）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotifyChannelTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  # ==========================================================
  # 工作区（只读）
  # ==========================================================
  /workspace/tree:
    get:
      tags: [workspace]
      summary: 工作区目录树
      description: 根固定为 `.basalt/agents/`；不跟随软连接（列为软连接条目）；真实路径投影校验，越界 400。
      parameters:
        - name: path
          in: query
          schema: { type: string, description: 相对根目录的路径，缺省为根 }
      responses:
        '200':
          description: 目录条目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WorkspaceEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/file:
    get:
      tags: [workspace]
      summary: 预览单个文件（只读）
      description: 上限 256 KB（超限 400 可读）；越界或经软连接越出根 → 400；**只读，不提供写**。
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, description: 相对根目录的文件路径 }
      responses:
        '200':
          description: 文件内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkspaceFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # US-16：知识库（knowledge）
  # 说明：本组端点对 caller key 与 admin token 同时开放（`knowledge:read` / `knowledge:write`），
  #       每次请求都按该 Principal 重查集合 ACL；被拒资料只计数，不回显标题、ID 与片段。
  # ==========================================================
  /collections:
    get:
      tags: [knowledge]
      summary: 列集合（管理台）
      description: |
        管理面只读列表，固定按 `name` 升序（**不得**提供排序参数）。软删集合默认不返回。
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: include_deleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 集合列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CollectionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [knowledge]
      summary: 建集合
      description: |
        需要 `knowledge:write`。同一 `project` 下活动集合同名 → 409 `CONFLICT`（软删行不算活动）。
        集合名非法 → 400 `BAD_REQUEST`，零写入。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionCreateRequest' }
      responses:
        '200':
          description: 已创建的集合
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CollectionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }

  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: collection_id }
    delete:
      tags: [knowledge]
      summary: 软删集合
      description: |
        需要 `knowledge:write`。软删 `deleted_at`，集合内文档随即退出检索与来源视图；
        **不**物理删除行，**不**级联改历史消息与其引用。重复删除幂等（返回既有 `deleted_at`）。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }

  /collections/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: collection_id }
    get:
      tags: [knowledge]
      summary: 列集合内文档
      description: |
        需要 `knowledge:read`。固定按 `source_path` 升序；`deleted_at` 非空的文档默认不返回。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      parameters:
        - name: include_deleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 文档列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }
    post:
      tags: [knowledge]
      summary: 摄取文档（按工作区路径）
      description: |
        需要 `knowledge:write`，计入 `IngressIngest` 入口桶。请求体只给**工作区允许根内**的相对路径：
        越界、扩展名不是 `.md` / `.txt`、超大小上限或 UTF-8 解码失败 → 400 `BAD_REQUEST`，零写入、零外部调用。

        同 collection 内已存在 `content_hash` 相同的 active 版本 → **不重复建版本**，直接返回该版本并置
        `deduplicated=true`。否则新建版本（`status=pending`）与摄取作业，同步执行解析 / 切块 / 分批 embedding /
        校验 / 激活；**唯一生效点**是 `status=active`——失败时 `status=failed` 并给 `error_kind`，
        旧 active 版本继续服务。

        每次 embedding 批次先写 `embedding_calls(pending)` 再发请求（fail-closed）；预写失败即中止，不发出调用。

        摄取端口缺失或 embedding 相关配置不完整 → 503 `NOT_CONFIGURED`，在读取正文与任何写入**之前**返回。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentIngestRequest' }
      responses:
        '200':
          description: 摄取结果（含 `active` / `failed` 两种终态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IngestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/IngressLimited' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: document_id }
    delete:
      tags: [knowledge]
      summary: 软删文档
      description: |
        需要 `knowledge:write`。软删后该文档全部版本退出检索；**不**改写历史消息，**不**删除
        `message_evidence_refs`——历史引用在读面按当前删除状态标注为失效。重复删除幂等。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }

  /documents/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: document_id }
    get:
      tags: [knowledge]
      summary: 列文档版本
      description: |
        需要 `knowledge:read`。固定按 `created_at` 倒序。版本状态取值见 `DocumentVersionSummary.status`；
        `failed` 版本**不得**被检索看到，重试**必须**新建版本行。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentVersionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }

  /documents/{id}/reindex:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: document_id }
    post:
      tags: [knowledge]
      summary: 重建索引（新建版本行）
      description: |
        需要 `knowledge:write`，计入 `IngressIngest` 入口桶。**新建**版本行重跑解析 / 切块 / embedding，
        **不覆盖**旧版本行；旧 active 版本在新版本通过校验前继续服务。
        摄取端口缺失或 embedding 相关配置不完整 → 503 `NOT_CONFIGURED`，在读取正文与任何写入**之前**返回。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      responses:
        '200':
          description: 摄取结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IngestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/IngressLimited' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  /search:
    post:
      tags: [knowledge]
      summary: 混合检索（只回片段与指针）
      description: |
        需要 `knowledge:read`，计入 `IngressRead` 入口桶。可见范围 = Agent 声明集合 ∩ 调用方项目 ∩ 当前 ACL；
        删除 / 过期 / 越权的资料在**两条检索路径的 SQL 内**先行剔除，被拒元素只进 `denied_count`，
        **不得**出现在命中、日志标题或诊断 `attrs` 中。

        `hits[]` 是**指针 + 片段**，**不带** `content_hash`——命中结果**不得**直接当作引用依据；
        引用必须走 `POST /sources/view` 精确读取后再判可定位与支持结论。两路皆失败 → 503 `NOT_CONFIGURED`
        并给 `reason_code`；单路失败降级为另一路并把原因写进 `degraded_reason`（不静默）。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: 检索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/IngressLimited' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  /sources/view:
    post:
      tags: [knowledge]
      summary: 来源视图（按 EvidenceRef 精确读取）
      description: |
        需要 `knowledge:read`，计入 `IngressRead` 入口桶。按 `ref`（资料版本 + 位置 + 范围）**精确读取**，
        **不经过相似度**；每次按当前 Principal 重查 ACL / 删除 / 版本——两个调用方读同一 `ref` 可以有不同结果。

        `validity.valid=false` 时（`revoked` / `deleted` / `version_changed` / `not_found`）正文、事实与摘要
        一律为空，**不得**用新版本正文冒充旧引用。截断必须显式标注 `truncated=true` 并给 `next_cursor`。

        身份是请求上下文里的 Principal，**不在**请求体内（身份不藏在 body 里）。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceViewRequest' }
      responses:
        '200':
          description: 来源视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SourceViewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }

  # ==========================================================
  # US-16：知识库管理面写入（admin/knowledge）
  # 四条都需要管理员身份（根级 bearerAuth / localTrust），caller key 一律拒绝；
  # 都不走业务面入口限流桶（管理面另有认证限速）。
  # ==========================================================
  /admin/knowledge/uploads:
    post:
      tags: [knowledge]
      summary: 把上传文件落到工作区 `uploads/`
      description: |
        只接受**单层文件名**（不接受任何路径分隔符）、`.md` / `.txt` 扩展名、UTF-8 文本且不含 NUL，
        长度不超过 `knowledge.max_document_bytes`；越界一律 400。

        落盘与摄取是**两次操作**：本端点只保存文件并返回相对路径，随后由
        `POST /collections/{id}/documents` 以该路径发起摄取——摄取失败不回滚已保存的文件。
        先预写 `pending` 管理操作行（`knowledge_document.upload`），预写失败 → 500 且不落盘；
        同名文件**不覆盖**（`O_EXCL` 语义）→ 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name: { type: string, description: 单层文件名，`.md` / `.txt` }
                content: { type: string, description: UTF-8 文本 }
      responses:
        '200':
          description: 已保存文件的相对路径
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [path]
                        properties:
                          path: { type: string, description: '固定前缀 `uploads/`' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/knowledge/collections/{id}/description:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: collection_id }
    put:
      tags: [knowledge]
      summary: 更新集合简介（乐观并发）
      description: |
        简介是**用户维护的元数据**，与文档内容无关。并发用请求体里的 `expected_revision` 表达，
        **不用** `If-Match`：集合不是版本化资源，其修订号独立于资源 ETag 语义。

        `expected_revision` 与当前 `description_revision` 不等 → 412，零写入；成功后修订号 +1 并回新值。
        两个字段都必填（缺任意一个即 400），空简介合法。

        长度按 **Unicode 字符**（rune）计，上限 2000；超限或非法 UTF-8 → 400，零写入。
        `maxLength` 在 JSON Schema 里按码点计，与 rune 口径一致。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, expected_revision]
              properties:
                description: { type: string, maxLength: 2000 }
                expected_revision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 新修订号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [description_revision]
                        properties:
                          description_revision: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/knowledge/documents/{id}/ingest-attempts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: document_id }
    get:
      tags: [knowledge]
      summary: 读文档的摄取处理记录
      description: |
        按文档列出每次摄取的尝试（`job_id` / `version_id` / 尝试序号 / 阶段 / 状态 / 错误分类 / 起止时间），
        主键倒序。窗口有上限，超出时 `truncated=true`——**不得**把截断当成"没有更多记录"。
        只读：不写管理操作行。
      responses:
        '200':
          description: 处理记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, truncated]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: [job_id, version_id, attempt, stage, status, started_at, finished_at]
                              properties:
                                job_id: { type: string }
                                version_id: { type: string }
                                attempt: { type: integer, minimum: 1 }
                                stage: { type: string }
                                status: { type: string }
                                error_kind: { type: string }
                                started_at: { type: string }
                                finished_at: { type: string, description: 未结束时为空串 }
                          truncated: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/knowledge/historical-source:
    post:
      tags: [knowledge]
      summary: 读取历史版本正文（仅管理员）
      description: |
        与 `POST /sources/view` 分工：那条走**当前** Principal 的 ACL，历史版本一律判失效、正文为空；
        本端点专门读取**已被取代但仍留档**的版本正文，供管理员核对"当时版本"。

        三重一致性校验缺一不可：`result.version_id` 等于请求的 `version_id`、`content_hash` 等于请求的
        `content_hash`、且该版本确为 `superseded` 且失效原因恰为 `version_changed`；任一不符 → 409，
        **不得**用新版本正文冒充旧引用。预算固定 2048 token，超出时 `truncated=true` 并给 `next_cursor`。
        只读：不写管理操作行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref:
                  description: |
                    与 `EvidenceRef` 同形，但 **`content_hash` 在此必填**：本端点要做"版本 + 哈希 +
                    已失效原因"的三重一致性校验，缺哈希就无从比对，只能 400（**不**回退成"按版本号信"）。
                  allOf:
                    - $ref: '#/components/schemas/EvidenceRef'
                    - type: object
                      required: [content_hash]
                cursor: { type: string, description: 上一页返回的 `next_cursor`；省略即第一页 }
      responses:
        '200':
          description: 历史版本正文
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [version_id, content_hash, text, truncated, historical]
                        properties:
                          version_id: { type: string }
                          content_hash: { type: string }
                          text: { type: string }
                          truncated: { type: boolean }
                          next_cursor: { type: string }
                          historical: { type: boolean, description: 恒为 `true` }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================
  # US-16：历史回查（history）
  # 检索只回指针；只有精确读取才回原文。跨调用方一律 404（不是 403，避免暴露他人会话存在）。
  # ==========================================================
  /history/search:
    get:
      tags: [history]
      summary: 历史关键词检索（只回指针）
      description: |
        需要 `sessions:read`，计入 `IngressRead` 入口桶。首批走关键词 / trigram；结果是指针 + 片段，
        **不是**引用（片段**不得**当作引用依据，引用走 `POST /sources/view`）。

        caller key 调用时强制按 `sessions.caller_id` 过滤；admin token 可跨调用方，`caller_id` 参数
        只对 admin token 生效，caller key 传了他人 `caller_id` → 403 `FORBIDDEN`。
        迁移前旧会话 `caller_id` 为空：只允许 admin token 读取，**不得**把空值匹配到任意调用方。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, description: 关键词（非空；空串 → 400） }
        - name: agent
          in: query
          schema: { type: string }
        - name: session_id
          in: query
          schema: { type: string }
        - name: caller_id
          in: query
          schema: { type: string, description: 仅 admin token 有效 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 命中指针列表（固定按时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HistorySearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }
        '500':
          description: 检索不可用（存储失败或端口未装配，业务码 `INTERNAL`）；不得降级成 200 + 空命中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /sessions/{session_id}/messages/{message_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string }
      - name: message_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [history]
      summary: 精确读取单条消息（回原文）
      description: |
        需要 `sessions:read`，计入 `IngressRead` 入口桶。按消息主键精确读取，**不经过检索**；
        重查当前 ACL 与删除 / 保留状态。跨调用方 → 404 `NOT_FOUND`（不是 403）；
        消息不存在 → 404；被保留策略删除 → 410 `GONE`。

        消息携带的 `evidence_refs` 按资料**当前** ACL / 删除 / 版本逐个校验并标注 `valid` / `reason`；
        **不**从正文反推引用，**不**改写已发送消息。无状态 Run 的临时标识（`msg/<run_id>/<pos>`）
        在 `messages` 表无对应行 → 404。
      security:
        - callerKey: []
        - bearerAuth: []
        - localTrust: []
      responses:
        '200':
          description: 消息原文与元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessageDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/IngressRateLimited' }
        '500':
          description: 原文或引用状态不可确认（存储失败、判定违约或端口未装配，业务码 `INTERNAL`）；不得把未知状态写成 `valid`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ==========================================================
  # US-16：调用方身份、Key 与配额（callers）—— **管理面**
  # 这一组只接受 admin token / local_trust；caller key 一律 401/403（`callers:admin` 不发给 caller key）。
  # Key 明文只在签发 / 轮换响应出现一次；其余任何响应、日志、审计、诊断都不得出现。
  # ==========================================================
  /callers:
    get:
      tags: [callers]
      summary: 列调用方
      description: 固定按 `caller_id` 升序；`local-admin` 恒在列表内。
      responses:
        '200':
          description: 调用方列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CallerSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [callers]
      summary: 建调用方
      description: |
        先写 `pending` 管理审计再执行；预写失败 → 500 `INTERNAL` 且**不**创建。
        `caller_id` 缺省由服务端生成（`cal_` + 26 位 Crockford Base32）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallerCreateRequest' }
      responses:
        '200':
          description: 已创建的调用方
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CallerSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /callers/{id}/keys:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, description: caller_id }
    post:
      tags: [callers]
      summary: 签发 Key（明文只回一次）
      description: |
        先校验 scope（未知 scope、空 scope、管理面 scope `diagnostics:read` / `callers:admin` 一律
        400 `INVALID_SCOPE`，**不留** pending 操作），再预写 `pending` 管理审计，预写失败**不得**签发。

        `key` 明文**只在本次响应出现一次**；服务端只存 `key_hash` 与 `key_prefix`，
        客户端丢失只能吊销重发。响应**不得**回显在审计、日志或诊断中。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallerKeyIssueRequest' }
      responses:
        '200':
          description: 已签发（含一次性明文）
          content:
            application/json:
