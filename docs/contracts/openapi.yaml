          description: "NOT_CONFIGURED：可观测功能关闭"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
  /observability/export:
    get:
      tags:
        - "observability"
      summary: "读取观测export"
      description: "管理面只读；有效caller key一律403；缺装配500，功能关闭503 NOT_CONFIGURED。未知/重复/空参数400，不回显输入。只读持久账本；endpoint/header仅显示是否配置。确认计数未知为null，不得补0；span/log_record/data_point分开。unknown_attempts表示此前结果未知、可能重复。覆盖双边界完整才表示成功扫描；早于覆盖起点未保证导出，延迟超过对账窗口也未保证。"
      security:
        -
          bearerAuth: []
        -
          localTrust: []
      parameters: []
      responses:
        "200":
          description: "只读观测结果；空、缺证据、不可用与未知分别表达"
          content:
            application/json:
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/ObsExport"
                    required:
                      - "data"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          description: "读取失败，不返回data或底层错误"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        "503":
          description: "NOT_CONFIGURED：可观测功能关闭"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
  /observability/cleanup:
    get:
      tags:
        - "observability"
      summary: "读取观测cleanup"
      description: "管理面只读；有效caller key一律403；缺装配500，功能关闭503 NOT_CONFIGURED。未知/重复/空参数400，不回显输入。读取四组生效策略和最多30天窗口账本；GET不触发清理。默认limit=100。跳过且计数0可能表示本轮未枚举候选。窗口清理不能证明具体缺失行曾被删除。"
      security:
        -
          bearerAuth: []
        -
          localTrust: []
      parameters:
        -
          name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        -
          name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: "只读观测结果；空、缺证据、不可用与未知分别表达"
          content:
            application/json:
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/ObsCleanup"
                    required:
                      - "data"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          description: "读取失败，不返回data或底层错误"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        "503":
          description: "NOT_CONFIGURED：可观测功能关闭"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <admin token>`。token 只从配置的 `${ENV_VAR}` 解析，不入库、不回显。
        仅 `http.admin_auth.mode=token` 时可用；缺失或无效 → 401 `UNAUTHORIZED`。
    localTrust:
      type: apiKey
      in: header
      name: X-Basalt-Local-Trust
      description: |
        仅 `http.admin_auth.mode=local_trust` 且直连来源为回环地址时可用，值必须为 `1`。
        `Forwarded` / `X-Forwarded-For` / `X-Real-IP` 不能证明回环；反向代理或隧道不得绕过认证。
        同时校验 Host 与 Origin（或 Sec-Fetch-Site），防 DNS rebinding / CSRF。
    callerKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <调用方 API Key>`（US-16）。调用方业务凭据，与管理面凭据**分属两个命名空间**：

        - caller key 只能构造 `Principal{Kind: PrincipalCaller}`；它**无法**表达管理员 Kind
          （`PrincipalLocalAdmin` 只由 admin token 或进程内 CLI 显式构造，`caller_keys` 表里根本存不下该 Kind）
        - 服务端只存 `key_hash`（SHA-256）与 `key_prefix`；明文**只在签发 / 轮换响应出现一次**，
          日志、审计、诊断、导出与错误文案**不得**出现有效凭据
        - 缺失 / 无效 / 已撤销 / 已过期一律 401 `UNAUTHORIZED`，**不区分**具体原因（避免成为探测面）
        - 每个已认证业务请求先过入口限流（`IngressRun` / `IngressIngest` / `IngressRead`）；admin token
          请求**不进入**任何调用方桶
        - 明文格式（前缀、长度）由实现决定，契约只约束"不可恢复、只回显一次"
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' }
      description: 强 ETag；缺失、格式非法、弱 ETag、`*` 或与当前值不匹配 → 412。
    ResourceKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [model_connection, mcp_server, skill] }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, description: 资源名（模型连接 / MCP / 技能均按名标识） }
    ResourceUID:
      name: resource_uid
      in: query
      required: true
      schema: { type: string, description: '目标资源的稳定身份（`rs_` + 26 位 Crockford Base32）' }
      description: |
        涉及资源身份的动作（删除、范围转换、凭据撤销）必须在 `If-Match` 之外显式给出 `resource_uid`，
        且必须等于该名称当前指针；缺失或与当前指针不一致 → 409 `RESOURCE_UID_MISMATCH`，**不**按名称猜测目标
        （同名重建后旧 UID 的版本与凭据留在墓碑下，按名操作永远只作用于当前身份）。
    CredentialResourceKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [model_connection, notify_channel] }
      description: 范围与凭据动作只覆盖带使用范围的两类资源；通知渠道的 CRUD 仍走 `/notify-channels`。
    CredentialOwnerKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [model_connection, notify_channel, mcp_server] }
      description: |
        凭据 owner 类型。比 `CredentialResourceKind` 多 `mcp_server`：MCP server 可以有逐占位符的托管凭据，
        但没有 `shared` / `exclusive` 使用范围，因此只有撤销走这条 kind。`kind=mcp_server` 时请求体必须带
        `binding_key`（撤销只作用于那一个占位符），`resource_uid` 仍是 server 的资源 UID。

  responses:
    OK:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: 参数非法 / 超限 / 路径越界
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    SessionBusy:
      description: 该会话已有运行在执行（不排队，稍后重试）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    TooManyRuns:
      description: 实例级并发运行超限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Timeout:
      description: 运行超过调用方时限（Run 侧记为 cancelled）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotConfigured:
      description: |
        能力未配置或装配缺端口（业务码 `NOT_CONFIGURED`）：文案点名配置键，且在读取正文 /
        发出任何外部调用**之前**返回——不得退化成默认值或空结果。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    ServiceUnavailable:
      description: 托管凭据不可用（主密钥缺失 / 权限不符 / 格式错误 / key_id 不匹配 / 解密失败；业务码 `CREDENTIAL_UNAVAILABLE`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Unauthorized:
      description: |
        未认证（业务码 `UNAUTHORIZED`）。401 **不区分**凭据缺失与无效（避免成为探测面）：

        - **管理面**：`token` 模式只认 admin token；`local_trust` 模式只认本机信任三元组
          （回环对端 + 无任何转发头 + `X-Basalt-Local-Trust: 1`）。有效调用方 Key 打管理面是 403，不是 401
        - **业务面**：调用方 Key 或 admin token；`local_trust` 模式下不带凭据时仅当本机信任三元组成立
          才映射为内置管理员，**坏凭据不因对端回环而升级**

        凭据失败按来源计数：同一来源反复失败会先被 429 `AUTH_RATE_LIMITED` 挡住（见 `IngressRateLimited`）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Forbidden:
      description: |
        操作不允许（业务码 `FORBIDDEN`），或请求在凭据判定**之前**就被来源守卫拒绝：

        - **业务面作用域不足**：固定文案「调用方无权执行该操作」，**不**点名缺哪个 scope
        - **有效调用方 Key 调管理端点**：两条凭据面都不接受它，响应不回显凭据内容
        - **Host / Origin 不在白名单**：先于凭据判定，未认证请求同样得到 403
        - **`local_trust` 模式的本机信任三元组不成立**：对端非回环 / 带任何转发头 / 缺信任头

        403 **不**解释命中哪条规则。Host / Origin 拒绝不消耗认证失败预算，本机信任拒绝计入。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Conflict:
      description: 状态冲突（同名存在 / 生命周期 generation 或 expected_state 不匹配 / Agent 忙碌，业务码 `CONFLICT`、`AGENT_BUSY` 等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    InternalError:
      description: |
        服务端失败（业务码 `INTERNAL`）：存储不可读、端口未装配或管理审计预写失败。底层原因只进日志，
        **不**回显堆栈、绝对路径或凭据；`pending` 之后的失败另带 `operation_id` 供查证。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    PreconditionFailed:
      description: 条件写前置条件不满足（ETag 不匹配，业务码 `PRECONDITION_FAILED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    AuthRateLimited:
      description: 认证失败次数超限（业务码 `AUTH_RATE_LIMITED`）；未认证请求也可能得到它
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    IngressRateLimited:
      description: |
        业务端点只可能给出这两种 429 之一（按判定顺序）：

        - `AUTH_RATE_LIMITED`——同一来源 60 秒内认证失败次数超限，在凭据判定**之前**给出，
          此时请求还没有身份；`Retry-After` 给到限速窗口结束
        - `CALLER_RATE_LIMITED`——`IngressRun` / `IngressIngest` / `IngressRead` 入口桶（QPS / 突发）超限；
          `Retry-After` 给剩余秒数

        两种码**不得**合并（一个是凭据在反复失败，一个是调用方太快）。被拒请求**零占用**：
        不取运行槽位、不产生配额预留、不写审计业务行；内置管理员不进入任何调用方桶。
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议重试等待秒数（`AUTH_RATE_LIMITED` 为到窗口结束）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    IngressLimited:
      description: |
        计入 `IngressRun` / `IngressIngest` / `IngressRead` 入口限流或配额的端点，四种 429 之一：

        - `AUTH_RATE_LIMITED`——同一来源认证失败次数超限，在凭据判定**之前**给出；`Retry-After` 给到窗口结束
        - `CALLER_RATE_LIMITED`——入口桶（QPS / 突发）超限，`Retry-After` 给剩余秒数
        - `CALLER_CONCURRENCY_LIMITED`——调用方并发名额已满（Run 级）
        - `QUOTA_EXHAUSTED`——周期 / 容量配额不足，或该周期 `overage > 0` 尚未核对清零；
          `Retry-After` 给到下一周期起点的秒数

        四者**不得**合并成同一个码（排障要能区分"凭据在失败"、"太快"与"额度用完"）；被拒请求**零占用**。
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议重试等待秒数（`QUOTA_EXHAUSTED` 为到下一周期起点）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    RunLimited:
      description: |
        Run 触发端点（`POST /sessions/{id}/messages`、`POST /agents/{name}/invoke`）可给出的五种 429，
        按准入顺序互斥出现，**不得**合并成一个码：

        - `AUTH_RATE_LIMITED`——同一来源认证失败次数超限，在凭据判定**之前**给出，此时请求还没有身份；
          `Retry-After` 给到窗口结束
        - `CALLER_RATE_LIMITED`——`IngressRun` 入口桶（QPS / 突发）超限；`Retry-After` 给剩余秒数
        - `CALLER_CONCURRENCY_LIMITED`——调用方并发 Run 名额已满（内置管理员不占调用方名额）
        - `QUOTA_EXHAUSTED`——周期 / 容量配额不足，或该周期 `overage > 0` 尚未核对清零
        - `TOO_MANY_RUNS`——实例级并发 Run 上限，与调用方名额是两个独立闸门

        `CALLER_CONCURRENCY_LIMITED` 在会话串行 / 实例容量判定（409 `SESSION_BUSY` 与 `TOO_MANY_RUNS`
        是同一段）**之前**给出；`QUOTA_EXHAUSTED` 在这两段之后。被拒请求**零占用**：
        不取运行槽位、不产生配额预留、不写审计业务行。
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议重试等待秒数（`AUTH_RATE_LIMITED` / `CALLER_RATE_LIMITED` / `QUOTA_EXHAUSTED` 携带）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Gone:
      description: 目标已被保留策略删除（业务码 `GONE`）；4xx 中只有它与 404 出现在读取路径
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

