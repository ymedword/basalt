openapi: 3.1.0
info:
  title: Basalt REST API
  version: 0.2.0
  description: |
    Basalt（Go 实现的 Agent OS）的静态 REST 契约。与 [技术方案](../TechnicalDesign.md)§6.2 冲突时以技术方案为准。

    **文档状态**：待验证设计草案（冻结条件：五链路原型验证通过 + 真实模型调用往返，见 DevelopmentLoop.md§5.2）。

    约定的固定事实：

    - **统一前缀** `/api/v1`（`servers[0].url` 已含前缀，`paths` 内的路径**不含**前缀）；**统一信封** `{code, message, data, timestamp}`，成功 `code=OK`
    - **默认监听** `127.0.0.1:8080`——远程访问必须显式改配置（安全默认）
    - **管理面最小认证**：`http.admin_auth.mode` 必填（`token` / `local_trust`）；非回环部署必须 `token`。`/health` 与静态页面壳可公开，其余管理数据读面与所有可触发执行 / 修改的端点均需认证。完整语义见 `contracts/run-and-errors.md` §9
    - **管理台静态壳**：`GET /console/`（含深链接回退）由 `go:embed` 提供，不属于 `/api/v1` REST 契约；页面中的 admin token 只保存在内存
    - **条件写**：`PUT` / `DELETE` / `publish` 对 Agent 内容与公共资源要求 `If-Match: "sha256:<64 位小写十六进制>"`；多文件提交（`POST /agents/{name}/files`）要求受管文件集合 ETag；缺失、格式非法、弱 ETag、`*` 或不匹配 → 412 `PRECONDITION_FAILED`，且不落盘、不写管理操作行
    - **JSON 字段命名** snake_case
    - **错误码** 见 `contracts/run-and-errors.md` §8；错误响应**不得**回显凭证、绝对路径与堆栈
    - **列表端点不暴露排序参数**——顺序由服务端固定（安全约束，见技术方案§4.3）
    - **请求体总上限** `http.max_request_bytes`（缺省 1 MiB）：一切端点的请求体在**解析之前**经上限 reader 约束，超限返回 400——它是兜底约束，各端点另有更严的入口上限（如单条消息 32 KB）
    - **数据库目标版本**：`schema_version=2`（US-11 / US-12 追加资源版本、Run 资源引用、管理操作审计与生命周期索引）
    - 挂载点标注：本文件冻结了技术方案§6.2.3（10 个核心端点）与 §6.2.4（管理台追加端点）的全部路径；US-11 / US-12 新增路径同样以本文件为准
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 默认监听（本机）与统一前缀；远程部署需在 basalt.yaml 显式改 http.addr 并配置 admin token
security:
  - bearerAuth: []
  - localTrust: []
tags:
  - name: core
    description: 核心端点（技术方案§6.2.3，10 个）
  - name: runs
    description: 运行查询与取消（Run 为执行与审计的单位）
  - name: console
    description: 管理台只读观测与系统采样
  - name: agents
    description: Agent 动态管理（创建 / 编辑 / 生命周期 / 复制 / 归档恢复）
  - name: resources
    description: 模型连接 / MCP / 技能的版本、发布与引用
  - name: operations
    description: 管理操作审计查询
  - name: schedules
    description: 定时任务管理
  - name: notify
    description: 通知渠道 CRUD
  - name: workspace
    description: 工作区只读浏览

paths:
  # ==========================================================
  # 核心端点
  # ==========================================================
  /health:
    get:
      tags: [core]
      summary: 健康检查
      security: []
      description: 唯一默认公开的 REST 端点；不返回配置、凭证或内部路径。
      responses:
        '200':
          description: 服务健康（200 即健康）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }

  /info:
    get:
      tags: [core]
      summary: 运行信息 + Provider 状态
      description: 响应**不含**任何凭证——Provider 只回名称、模型提示与配置是否就绪。
      responses:
        '200':
          description: 运行信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InfoView' }

  /system/overview:
    get:
      tags: [console]
      summary: 系统概览
      description: 管理台首页读数；不含凭证与绝对路径。数据库就绪用轻量 ping，不做完整性检查。
      responses:
        '200':
          description: 系统概览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/sample:
    get:
      tags: [console]
      summary: 节点采样
      description: |
        返回最近一次采样（服务端最多每 5 秒更新一次）。平台不支持的字段返回 `null` 并列入
        `unavailable`；**不得**伪造 0 或猜测读数。`cpu_percent` 是进程 CPU 利用率，不是宿主整机利用率。
      responses:
        '200':
          description: 最近一次采样
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemSample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /profiles:
    get:
      tags: [core]
      summary: 列所有 Agent 配置
      responses:
        '200':
          description: Agent 配置列表（含加载期校验状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProfileView' }

  /tools:
    get:
      tags: [core]
      summary: 列可用工具
      responses:
        '200':
          description: 工具列表（内置 / MCP / 代码内注册）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ToolView' }

  /memory:
    get:
      tags: [core]
      summary: 查长期记忆（全局层）
      description: 全局回退层（`.basalt/memory/MEMORY.md`）。Agent 层记忆走 `/agents/{name}/memory`。
      responses:
        '200':
          description: 长期记忆内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryView' }

  /sessions:
    post:
      tags: [core]
      summary: 创建会话
      description: |
        参数校验失败（含 `agent` 缺失 / `null`）返回 400，**不创建、不修改**任何会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { type: string, description: Agent 名 }
                channel: { type: string, default: web }
                user_id: { type: string, default: anonymous }
      responses:
        '200':
          description: 会话（已存在同组合会话时幂等返回既有会话）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SessionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [console]
      summary: 列会话（管理台）
      parameters:
        - name: agent
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, archived] }
      responses:
        '200':
          description: 会话列表（固定按 last_active_at 倒序；**不得**提供排序参数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SessionSummary' }

  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [core]
      summary: 查会话历史
      description: 返回最近 **100 条**消息（超出部分从最早开始不返回）。
      responses:
        '200':
          description: 会话详情（含消息）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SessionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [core]
      summary: 归档会话
      description: |
        归档不删数据（status 置 archived）。
        会话有在途运行时返回 409（不排队、不打断运行），**不产生任何归档写入**：
        status、archived_at 与消息均保持不变。
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SessionBusy' }

  /sessions/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [core]
      summary: 发消息（触发一次 Run）
      description: |
        同步等待 Run 完成。**达迭代上限不算服务故障**：HTTP 仍为 200，`data.status = limit_reached`
        并附部分结果（见 contracts/run-and-errors.md §1.3）。
        请求体总上限 `http.max_request_bytes`（缺省 1 MiB，超限在解析前 400）；单条消息另有 ≤ 32 KB 的入口上限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, description: 用户消息（≤ 32 KB） }
      responses:
        '200':
          description: Run 结果（status 取值见 §2）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SessionBusy' }
        '429': { $ref: '#/components/responses/TooManyRuns' }
        '504': { $ref: '#/components/responses/Timeout' }

  /agents/{name}/invoke:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [core]
      summary: 无状态调用 Agent
      description: 不落会话历史（`session_id` 为空），仍落 Run 与审计。超时 60 秒 → 504。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: Run 结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRuns' }
        '504': { $ref: '#/components/responses/Timeout' }

  /agents/{name}/memory:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [console]
      summary: 查某个 Agent 的长期记忆（Agent 层）
      description: 返回 Agent 层内容；为空时返回空而非回退全局层（回退发生在提示词组装时，不发生在查询时）。
      responses:
        '200':
          description: Agent 层记忆
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryView' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # 运行（Run）
  # ==========================================================
  /runs:
    get:
      tags: [runs]
      summary: 列运行
      parameters:
        - name: session_id
          in: query
          schema: { type: string }
        - name: agent
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [running, completed, limit_reached, cancelled, failed] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 运行列表（固定按 started_at 倒序；**不得**提供排序参数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RunView' }

  /runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [runs]
      summary: 查一次运行
      responses:
        '200':
          description: 运行详情（含资源清单；历史 Run 标 legacy_unrecorded）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runs/{run_id}/cancel:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [runs]
      summary: 取消一次运行
      description: |
        幂等：运行中 → 取消并回 `cancelled`；已是终态 → 200 且返回当前状态（message 说明无需取消）。
        取消语义（审计解耦、进程树清理）见 contracts/run-and-errors.md §4。
      responses:
        '200':
          description: 当前状态（cancelled 或原终态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # 管理台只读观测
  # ==========================================================
  /skills:
    get:
      tags: [resources]
      summary: 列技能库与发布状态
      responses:
        '200':
          description: 技能条目（含当前发布版本；不返回文件正文）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SkillView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resources]
      summary: 创建技能骨架
      description: 写最小 SKILL.md（name + 一句话 description），经发布闸门生成 version 1；同名存在 → 409 `CONFLICT`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillCreate' }
      responses:
        '200':
          description: 创建结果（当前发布版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /skills/import:
    post:
      tags: [resources]
      summary: 导入技能
      description: |
        只接受相对路径、普通文件；拒绝绝对路径、`..` 越界、软连接 / 目录联接、隐藏目录。
        单文件 ≤ 256 KiB、总量 ≤ 2 MiB、文件数 ≤ 200；导入不执行脚本，不做外部下载。
        同名技能存在 → 409，不静默覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillImport' }
      responses:
        '200':
          description: 导入后的当前发布版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /skills/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查技能详情
      description: 返回当前发布版本与完整文件清单；不返回已撤销版本。
      responses:
        '200':
          description: 技能详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillDetail' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [resources]
      summary: 全量替换技能文件
      description: 必须先校验再落盘；`If-Match` 必须等于当前 ETag。成功后生成新发布版本，新 Run 冻结新版本。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillUpdate' }
      responses:
        '200':
          description: 新发布版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillDetail' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [resources]
      summary: 删除技能
      description: |
        被任一 Agent `skills:` 引用或活动 Run 引用时 → 400 点名引用者；不提供 force。历史版本与 Run 引用保留。
        删除只写墓碑，必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ResourceUID'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /skills/{name}/validate:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 校验技能草稿（不落盘）
      description: 只做导入边界与 SKILL.md 校验，不写管理操作审计、不执行脚本。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillUpdate' }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkillValidateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mcp-servers:
    get:
      tags: [resources]
      summary: 列 MCP server 与连接 / 发布状态
      description: 响应**不含** env 值（只回变量名）、命令参数中的凭证或解析后的地址。
      responses:
        '200':
          description: MCP server 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/McpServerView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resources]
      summary: 登记 MCP server
      description: '`command` / `args` / `env` 是高权限配置；env 值只能是 `${ENV_VAR}`。写入经发布闸门，首版重启生效。'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpServerUpsert' }
      responses:
        '200':
          description: 登记结果（published 新版本；applied 可能仍是旧版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /mcp-servers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查 MCP server
      responses:
        '200':
          description: MCP server 详情（env 只回变量名）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerDetail' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [resources]
      summary: 修改 MCP server
      description: 写入新发布版本；首版仍重启生效。`If-Match` 必须等于当前 ETag。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpServerUpsert' }
      responses:
        '200':
          description: 修改结果（待重启时 pending_restart=true）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerView' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [resources]
      summary: 删除 MCP server
      description: |
        被 Agent `mcp_servers:` 或活动 Run 引用时 → 400 点名；不提供 force。
        删除只写墓碑，必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ResourceUID'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /mcp-servers/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 测试 MCP server
      description: |
        显式、有超时的连接与工具发现测试；不改变发布指针。写 `management_operations` 的 pending
        记录后再启动测试进程（预写失败不得启动）；结果与工具清单写脱敏 detail_json。
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/McpServerTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '504': { $ref: '#/components/responses/Timeout' }

  # ==========================================================
  # 公共资源版本、发布与引用
  # ==========================================================
  /resources/{kind}/{id}/references:
    parameters:
      - $ref: '#/components/parameters/ResourceKind'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [resources]
      summary: 查资源引用
      description: |
        返回引用该资源的 Agent 与活动 Run；删除闸门据此拒绝并点名。Agent 引用包含两类：`resource_bindings`
        中指向该 `resource_uid` 的绑定（含归档 Agent；权威），以及定义名引用（解析失败按可能引用处理）。
        活动 Run 引用来自未释放的 `run_resource_refs` / `run_notify_refs`。
      responses:
        '200':
          description: 引用清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceReferencesView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{kind}/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/ResourceKind'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [resources]
      summary: 列资源历史版本
      description: |
        已发布迁移只追加；版本内容不可改写。撤回 = 以旧版本内容创建新版本，不改历史。
        版本按 `(resource_kind, resource_uid, version_no)` 归属：只按名称查询默认只回当前指针 UID 的版本；
        查旧 UID（同名重建前的历史）必须显式给 `resource_uid`。
      parameters:
        - name: resource_uid
          in: query
          required: false
          schema: { type: string }
          description: 显式指定资源身份；省略 = 当前指针 UID
      responses:
        '200':
          description: 版本列表（按 version_no 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ResourceVersionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{kind}/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ResourceKind'
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [resources]
      summary: 发布资源版本
      description: |
        不带 `version_id` 时发布当前最新版本（幂等）。带旧 `version_id` 时按该版本内容**创建新版本**
        再发布，返回新版本；不修改历史版本。Provider / 技能立即生效，MCP 首版重启后生效并回 `pending_restart=true`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200':
          description: 发布后的版本与生效状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourcePublishResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /resources/{kind}/{name}/credential/revoke:
    parameters:
      - $ref: '#/components/parameters/CredentialResourceKind'
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 撤销资源托管凭据（全部版本）
      description: |
        撤销该资源 UID 的整个凭据身份：全部版本置 `revoked`、活动密文置 NULL、`revocation_epoch + 1`，
        资源条件 ETag 随之变化。**不需要读取主密钥、不解密**；不删除资源、不删除历史版本。
        之后重新录入生成新版本，旧版本永不复活；在途 Run 在下一次模型调用检查点或下一次通知发送失败。
        env 模式的资源没有托管凭据，调用返回 400。请求体必须带 `resource_uid` 与 `confirm: true`，
        `If-Match` 必须匹配资源条件 ETag；`resource_uid` 与凭据 owner 不符（借用其他资源的凭据 ID）→
        409 `CREDENTIAL_OWNER_MISMATCH`，不跨资源复用。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialRevokeRequest' }
      responses:
        '200':
          description: 撤销结果（只回状态与版本，不含凭据材料）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CredentialRevokeResult' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /resources/{kind}/{name}/scope:
    parameters:
      - $ref: '#/components/parameters/CredentialResourceKind'
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 切换资源使用范围
      description: |
        `shared` ⇄ `exclusive`。转专属必须给 `owner_agent`，且该 Agent 已存在。共享转专属前检查其他 Agent 的
        `resource_bindings`、活动 Run 与消息路由引用；被引用 → 409 `RESOURCE_SCOPE_IN_USE` 并点名，**不提供 force**，
        不自动解绑。有资格使用 `all_eligible` 的 Agent 作为影响提示返回，不静默移除。请求体必须带 `resource_uid`，
        与当前指针不一致 → 409 `RESOURCE_UID_MISMATCH`；`If-Match` 必须匹配资源条件 ETag。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceScopeRequest' }
      responses:
        '200':
          description: 切换后的资源视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceScopeResult' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /resource-versions/{version_id}:
    parameters:
      - name: version_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查单个资源版本
      description: 返回脱敏后的定义；凭证只能是 `${ENV_VAR}` 引用。
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ResourceVersionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # 管理操作审计
  # ==========================================================
  /operations:
    get:
      tags: [operations]
      summary: 列管理操作
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: target_kind
          in: query
          schema: { type: string, enum: [agent, schedule, model_connection, mcp_server, skill, notify_channel, network_allowlist, system] }
        - name: target_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, success, failed, unknown] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 管理操作列表（固定按 created_at 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OperationView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operations/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [operations]
      summary: 查管理操作详情
      description: 返回脱敏 detail_json；`unknown` 表示崩溃窗口内结果未查证，需按独立操作契约恢复或补偿，**不得**盲目重做。
      responses:
        '200':
          description: 操作详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sandbox:
    get:
      tags: [console]
      summary: 查沙箱白名单
      description: |
        展示白名单（路径 / 可执行名 / 受控解释器 / 域名）。文件路径、可执行名与受控解释器**只读**，
        修改需改配置并重启；出网域名（`http_allowed_domains`）是**当前实际生效**值，可在管理台
        「执行环境」页通过 `PUT /sandbox/network-domains` 保存、立即生效、无需重启。响应附
        `network_allowlist` 生效元数据（ETag / 修订号 / 来源 / 最近写入时间与写入者）。
      responses:
        '200':
          description: 白名单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SandboxView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sandbox/network-domains:
    put:
      tags: [console]
      summary: 保存网络域名白名单（条件写，立即生效）
      description: |
        唯一权威源是数据库中的单行策略：`basalt.yaml` 的 `http.allowed_domains` 只在首次启动、
        表内无行时作为种子，此后改配置不覆盖管理台写入的值。保存成功后新规则对**下一次**出站
        判定立即生效，无需重启；已在途的连接与请求不会被撤回，收紧后不再被允许的 MCP http 长连接
        会断开且**不**自动重连（放宽不重连）。全部域名先规整（去空白、小写、去重、升序），
        非法条目 → 400 并点名第一处；`domains: []` 是合法值（受此策略约束的出站请求全部拒绝）。

        **必须**带 `If-Match` 强 ETag（取自 `GET /sandbox` 的 `network_allowlist.etag`）。缺失、
        弱 ETag 或 `*` → 412 且零写入；陈旧 ETag 同样 412，响应 `data.current_etag` 给出当前值，
        页面应重取后再改。写入按修订号做 CAS，并发修改落败方 → 409 且零写入。校验或前置条件
        失败不留管理操作行；一旦写入 `pending`，后续失败一律置 failed 并在 `data.operation_id`
        返回操作标识。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkDomainsWrite' }
      responses:
        '200':
          description: 保存后的实际生效状态（重新读出，不是回显请求体）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SandboxView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500':
          description: 预写之后失败（业务码 `INTERNAL`，`data.operation_id` 供查证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ==========================================================
  # 模型连接（Provider 发布）
  # ==========================================================
  /model-connections:
    get:
      tags: [resources]
      summary: 列模型连接与发布 / 生效版本
      description: |
        响应**不含**任何 api_key 值：env 模式只回 `${ENV_VAR}` 引用名（`api_key_env`）；managed 模式只回
        `credential_ref` / `credential_state` / `last4`。每项带不可变 `resource_uid`、`scope` 与 `owner_agent`。
      responses:
        '200':
          description: 模型连接列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModelConnectionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resources]
      summary: 新建模型连接
      description: |
        凭据两种模式：`credential_mode: env` 时 `api_key` 必须是精确 `${ENV_VAR}` 引用；`credential_mode: managed`
        时 `api_key` 是 **write-only 完整新值**（服务端 AES-256-GCM 加密落库，响应只回 `credential_ref` / `last4`）。
        创建时未声明 `credential_mode` 只按 env 规则；普通值且未声明 → 400 `CREDENTIAL_MODE_REQUIRED`，不推断为 managed。
        `scope` 取 `shared`（缺省）或 `exclusive`；`exclusive` 必须给 `owner_agent`，且该 Agent 已存在。
        成功后构建不可变 ProviderCatalog、原子替换发布指针；新 Run 在准入时固定该映射；失败保旧。同名活动连接存在 → 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConnectionUpsert' }
      responses:
        '200':
          description: 新建结果（published 与 applied 同一版本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /model-connections/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [resources]
      summary: 查模型连接
      responses:
        '200':
          description: 模型连接详情（env 只回引用名；managed 只回凭据引用 / 状态 / 尾号）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionView' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [resources]
      summary: 修改模型连接
      description: |
        `If-Match` 必须等于当前资源 ETag（资源 ETag 含定义、范围、凭据版本与状态、`revision`）。
        `api_key` 省略 = 保留当前凭据；env 模式提供精确 `${ENV_VAR}`；managed 模式替换必须给完整新值，空串 → 400。
        更新未声明 `credential_mode` 保持当前模式；显式切换必须给出目标模式所需的值（env → managed 需新值，
        managed → env 需 `${VAR}`）。请求体出现只读 `credential_ref` → 400 `CREDENTIAL_REF_READ_ONLY`。
        成功后立即发布，新 Run 使用新映射；已在途 Run 继续使用准入时固定的旧映射与旧凭据版本（撤销除外）。
        范围转换不在此端点，走 `POST /resources/{kind}/{name}/scope`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConnectionUpsert' }
      responses:
        '200':
          description: 修改结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionView' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [resources]
      summary: 删除模型连接
      description: |
        被任一 Agent 的 `resource_bindings`（含归档 Agent）、定义名引用或活动 Run 引用时 → 400 点名引用者；不提供 force。
        删除只写墓碑（`resource_identities.state='deleted'`），历史版本、凭据与引用记录保留；同名重建生成新 `resource_uid`，
        旧绑定不自动接管，版本号从 1 重新计。必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ResourceUID'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /model-connections/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 测试模型连接
      description: |
        用发布版本发一次最小协议调用（有超时）。**不创建 Run、不写 `llm_calls`**；写
        `management_operations` 的 pending 记录后再发调用（预写失败不得发调用），结果脱敏落 detail_json。
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '504': { $ref: '#/components/responses/Timeout' }

  # ==========================================================
  # Agent 动态管理
  # ==========================================================
  /agents:
    post:
      tags: [agents]
      summary: 模板脚手架创建 Agent
      description: 名字 + 描述 → 写出最小可加载的 Agent 目录。**先验后写**，任一步失败回滚（不留残余目录）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Agent 名（= 目录名） }
                description: { type: string }
                model: { type: string, description: 留空写入可见占位符「请在此填写模型名」 }
      responses:
        '200':
          description: 创建结果（落盘后的真值）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /agents/{name}/config:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      summary: 读结构化 Agent 配置（表单视图）
      description: |
        返回结构化字段值、**一个**与 `GET /agents/{name}/content` 完全一致的强 `content_etag`，以及每个引用的
        解析状态（绑定 UID、名称、是否已删除、是否仍有资格、`notify_mode` 的有效值）。原文编辑继续用
        `GET/PUT /agents/{name}/content`；两者不是二选一。**不引入** `config_etag`——表单保存与原文保存共用
        `content_etag`。
      responses:
        '200':
          description: 结构化配置与解析状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentConfigView' }
          headers:
            ETag:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{name}/content:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      summary: 读整份 AGENT.md（配置编辑器）
      description: 响应头 `ETag` 与 data.etag 同为强 ETag：`"sha256:<64 位小写十六进制>"`，按原始 UTF-8 字节计算。
      responses:
        '200':
          description: 文件全文与 ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentContent' }
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [agents]
      summary: 写 AGENT.md（整份或结构化补丁）
      description: |
        经**同一段**注册写入门（先验后写）：校验不通过 → 400 且**磁盘逐字节不变**。
        `If-Match` 必须等于当前 `content_etag`（表单 `changes` 与整份 `content` **共用同一个**）；
        缺失、格式非法、弱 ETag、`*` 或与当前值不匹配 → 412。
        结构化补丁无法保持注释时 → 400 `EDIT_UNSUPPORTED`，不落盘。成功后生成新的 ConfigSnapshot 与 ETag。
        保存期还须校验 `resource_bindings` 与 `provider.name` / `notify_channels` 一一对应、UID 是当前发布指针、
        已发布且有资格；缺失 / 非法 / 无资格 → 400 `AGENT_RESOURCE_BINDING_MISSING` / `AGENT_RESOURCE_BINDING_INVALID` /
        `RESOURCE_NOT_ELIGIBLE` / `CREDENTIAL_REVOKED`，零写入。服务端**不补绑**、不按名解析、不猜意图。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentContentUpdate' }
      responses:
        '200':
          description: 保存结果（保存即生效，无需重启）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /agents/{name}/generate-files:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 一句话生成 Agent 目录草稿
      description: |
        模型起草一份或多份文件（必含 `AGENT.md`）。**不落盘、不注册、不要求该 Agent 已存在**——
        唯一写入是 LLM 调用审计（关联标识 `agent-author-<name>`），**不产生**管理操作行。
        草稿边界：路径规则同多文件提交（相对路径、规范化后仍在目录内、拒绝 `..` / 绝对路径 / 盘符 / NUL）；
        内容必须为 UTF-8 文本；文件数 ≤ 64；单文件 ≤ 256 KiB；总量 ≤ 1 MiB（且不超过 `http.max_request_bytes`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, description: 一句描述（可带 provider / model 提示） }
                answers:
                  type: array
                  maxItems: 3
                  description: |
                    可选：上一轮 `questions` 的逐项回答（R6 问答补全）。最多 3 条；`id` / `question`
                    非空且各 ≤ 256 字符，`answer` 去空白后非空且 ≤ 2000 字符，`id` 不重复。
                    答案只在本次请求内进入提示词，**不落盘、不进日志、不写审计正文**。
                  items:
                    type: object
                    required: [id, question, answer]
                    properties:
                      id: { type: string }
                      question: { type: string }
                      answer: { type: string }
      responses:
        '200':
          description: 草稿文件集合（未落盘，含可编辑正文）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentDraftView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  /agents/{name}/schedule-draft:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 一句话生成定时任务候选（不保存）
      description: |
        一次作者模型调用生成一条定时任务候选。**不写管理操作行、不落盘、不注册、不改调度器**——
        唯一写入是 LLM 调用审计（关联标识 `agent-schedule-<name>`）。候选的 `id` / `cron` / `zone` /
        `message` 复用装载期同一套规则校验（6 段、公共子集、`CRON_TZ=` 拼接后可解析、zone 可加载
        且非 `Local`、message 非空）；`next_runs` 只在服务端计算。候选**不自动保存**：确认后走
        `PUT /agents/{name}/content` 的 `changes.schedules` 条件写，id 与现有任务冲突由页面阻止。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, description: 一句话指令（去空白后非空，≤ 1000 字符） }
      responses:
        '200':
          description: 未保存的定时候选与服务端计算的未来三次触发时间
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ScheduleDraftView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  /agents/{name}/files:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      summary: 读 Agent 受管文件集合（多文件编辑的基础版本）
      description: |
        返回 Agent 目录内的受管文件清单与强 ETag。受管文件 = Agent 目录下的普通文件（不含 `.staging` / `.backup`
        残留、不跟随软连接）。ETag = 对按 path 升序排列的 `(path, sha256(内容))` 规整序列化后的 sha256，
        形如 `"sha256:<64 位小写十六进制>"`；与 `GET /agents/{name}/content` 的单文件 ETag **不可互换**。
      responses:
        '200':
          description: 文件清单与基础版本 ETag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
          headers:
            ETag:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [agents]
      summary: 提交多文件草稿
      description: |
        先校验（含 AGENT.md / 相对路径规范化后仍在目录内 / 整份配置过加载期校验 / 定时 id 不撞车）→ 才动磁盘。
        `If-Match` 必须等于 `GET /agents/{name}/files` 返回的受管文件集合 ETag；缺失、格式非法、弱 ETag、`*`
        或不匹配 → 412，**不落盘、不写管理操作行**。比较与 staging 构建在同一 Agent 写锁内完成（锁内重新读取基础版本）。
        写入在 **staging 目录**构建完整副本（原目录不动），校验通过后经**两次 rename** 完成目录交换（原目录先移为 `.backup`，staging 移为正式目录，再删 `.backup`）——
        崩溃窗口有界：启动时按残留判定**回滚**（正式目录缺失、`.backup` 在）或**前滚**（正式目录完整、`.backup` 尚在，清理残留），见 contracts/run-and-errors.md §4.3.2 第 5 步。
        返回的**是落盘后的真值**（重新读取，不是请求回声）。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { $ref: '#/components/schemas/FileDraft' }
      responses:
        '200':
          description: 落盘后的真值
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /agents/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [agents]
      summary: 归档删除 Agent
      description: |
        顺序：注销定时 → 标记 archived → 移出注册索引 → **取消该 Agent 在跑的 Run 并等待退出（默认 30 秒）**
        → 目录移入 `.basalt/archive/`（同名以时间戳唯一化）。等待超时 → 409 `AGENT_BUSY` 并点名活动 Run，
        恢复注册与状态，不留半残态。归档失败同样恢复。**会话 / 记忆 / 审计数据一律不动**。
        该 Agent 的定时登记**不物理删**（置下线标记），历史执行记录保留、数据库外键永不撞。
      responses:
        '200':
          description: 归档结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentArchiveView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agents/{name}/disable:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 停用 Agent
      description: |
        与 Run 准入共用 Agent 级一致性边界：校验 expected_state / expected_generation，原子写状态文件
        （generation+1）后更新索引。停用**不取消**在途 Run，只拒绝新准入；disabled 仍可见。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentLifecycleTransition' }
      responses:
        '200':
          description: 新生命周期状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentLifecycleView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agents/{name}/enable:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 启用 Agent
      description: |
        同一准入边界：expected_state 必须为 disabled，原子写状态文件（generation+1）后更新索引。
        启用后仍要求加载期校验与全部资源引用通过，否则拒绝新准入并保留可见错误。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentLifecycleTransition' }
      responses:
        '200':
          description: 新生命周期状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentLifecycleView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agents/{name}/copy:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 复制 Agent
      description: |
        复制目录内容到新 Agent 名；副本获得**新 `agent_uid`**，默认 `disabled`，并清空 `schedules`（避免全局 cron id 撞车）。
        共享资源绑定随目录携带（UID 不变）；源 Agent 引用任何**源专属**模型连接 / 通知渠道时，必须提供
        `resource_mapping` 逐项显式映射，否则 409 `AGENT_COPY_BLOCKED` 并列出资源名与类型，不产生副本。
        不复制源凭据、不复制源 `agent_uid`、不自动绑定源专属资源；`notify_mode` 按源模式处理，不用空数组冒充 `none`。
        新名已存在 → 409；复制失败不留残余目录。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCopyRequest' }
      responses:
        '200':
          description: 新 Agent 文件清单与生命周期
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /archived-agents:
    get:
      tags: [agents]
      summary: 列已归档 Agent
      responses:
        '200':
          description: 归档列表（按 archived_at 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ArchivedAgentView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /archived-agents/{archive_id}/restore:
    parameters:
      - name: archive_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      summary: 恢复已归档 Agent
      description: 恢复到原目录（或指定新名）；恢复后默认 `disabled`，清空 `schedules`；目标名已存在 → 409。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRestoreRequest' }
      responses:
        '200':
          description: 恢复结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentFilesView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ==========================================================
  # 定时任务
  # ==========================================================
  /schedules:
    get:
      tags: [schedules]
      summary: 列定时任务
      responses:
        '200':
          description: 任务列表（定义源在各 AGENT.md；此表只存状态）。重启对账：**enabled 以库为准、定义以文件为准**（文件改动不回翻停用）；Agent 归档删除的任务置**下线标记**（不物理删，历史执行记录保留）；停机期间错过的触发点**不补跑**（记 WARN，补跑走 `/schedules/{id}/run`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ScheduleView' }

  /schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [schedules]
      summary: 启用 / 停用任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedules/{id}/executions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [schedules]
      summary: 列执行历史
      responses:
        '200':
          description: 执行记录（固定按 started_at 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ExecutionView' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedules/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [schedules]
      summary: 立即执行一次（手动补跑）
      description: 走与到点触发**完全相同**的链路；审计以 `trigger=manual` 区分。所属会话已归档时返回 **400**（业务规则拒绝，文案沿用会话写拒绝「会话已归档，不可追加消息」）。
      responses:
        '200':
          description: 本次触发的 Run 结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RunView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该任务上一轮尚未结束（幂等跳过语义见技术方案§6.3）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429': { $ref: '#/components/responses/TooManyRuns' }
        '504': { $ref: '#/components/responses/Timeout' }

  # ==========================================================
  # 通知渠道
  # ==========================================================
  /notify-channels:
    get:
      tags: [notify]
      summary: 列通知渠道
      description: |
        响应中地址**只回 scheme + host**（`url_host`），原始地址（含 token）没有任何载体。每项带不可变
        `resource_uid`、`scope` / `owner_agent`、`credential_mode`、`credential_ref` / `credential_state` /
        `last4`、`address_status` 与 `revision`。`url_host` 为空**不等于**未配置（env 引用或 managed 密文都可能无 host）。
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/NotifyChannelView' }
    post:
      tags: [notify]
      summary: 登记通知渠道
      description: |
        地址两种模式：`credential_mode: env` 时 `url` 必须是精确 `${ENV_VAR}` 引用（发送时解析）；
        `credential_mode: managed` 时 `url` 是 **write-only 完整地址**（AES-256-GCM 加密落库，响应只回 host 与尾号）。
        创建未声明模式只按 env 规则；普通 URL 且未声明 → 400 `CREDENTIAL_MODE_REQUIRED`。
        `scope` 取 `shared`（缺省）或 `exclusive`；`exclusive` 必须给 `owner_agent`。
        写前预跑沙箱域名校验，失败文案只含 host。同名活动渠道 → 400 `BAD_REQUEST`（与 FR-059 一致，不新增 `CONFLICT`）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyChannelUpsert' }
      responses:
        '200':
          description: 登记结果（只回 host）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotifyChannelView' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /notify-channels/types:
    get:
      tags: [notify]
      summary: 列已装配的渠道类型
      description: 类型支持集只有**一份真值**（装配层显式映射表）；此端点同时供页面下拉框与写侧校验。
      responses:
        '200':
          description: 类型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: string, example: feishu }

  /notify-channels/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [notify]
      summary: 更新渠道
      description: |
        **url 省略 = 保留原值**；页面不回填已存地址。env 模式给精确 `${ENV_VAR}`；managed 模式替换必须给完整
        新地址，空串 → 400。更新未声明 `credential_mode` 保持当前模式；显式切换必须给出目标模式所需的值。
        请求体出现只读 `credential_ref` → 400 `CREDENTIAL_REF_READ_ONLY`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyChannelUpsert' }
      responses:
        '200':
          description: 更新结果（只回 host）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotifyChannelView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [notify]
      summary: 删除渠道
      description: |
        先按 `resource_bindings` 的 UID（含归档 Agent）与各 AGENT.md 正文**整词**匹配渠道名；被引用 → 400 并点名
        那些 Agent。`?force=true`（字面 true）强删。删除只写墓碑，历史、凭据与发送记录保留；同名重建生成新
        `resource_uid`，旧绑定不自动接管。必须携带与当前指针一致的 `resource_uid`。
      parameters:
        - $ref: '#/components/parameters/ResourceUID'
        - name: force
          in: query
          schema: { type: string, enum: ['true'] }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400':
          description: 渠道被 AGENT.md 引用（响应点名引用者）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notify-channels/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [notify]
      summary: 测试渠道连通性
      description: |
        先写 `notify_channel.test` 管理操作行（预写失败不发请求），再经**与定时代投 / `notify` 工具
        同一个**发送面发出一条固定文案 `Basalt 连通性测试`——接收方一眼可区分测试与真实通知。
        成功判定：HTTP 2xx；飞书还要求业务回执 `code == 0`。回执无法解析 / 超时 → `status=unknown`
        （可能已送达，**不得**自动重发）；未知是测试结论，仍是 200 + `ok=false`，不是接口错误。
        结果同时写入「最后一次连接测试」投影，列表页的 `last_test` 随之更新。地址完全未配置 →
        503 `NOT_CONFIGURED`，且投影记为 failed（不得显示成已验证）；渠道不存在 → 404。
      responses:
        '200':
          description: 测试已执行（`ok=false` 是失败或结果未知，不是接口错误）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotifyChannelTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/NotConfigured' }

  # ==========================================================
  # 工作区（只读）
  # ==========================================================
  /workspace/tree:
    get:
      tags: [workspace]
      summary: 工作区目录树
      description: 根固定为 `.basalt/agents/`；不跟随软连接（列为软连接条目）；真实路径投影校验，越界 400。
      parameters:
        - name: path
          in: query
          schema: { type: string, description: 相对根目录的路径，缺省为根 }
      responses:
        '200':
          description: 目录条目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WorkspaceEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/file:
    get:
      tags: [workspace]
      summary: 预览单个文件（只读）
      description: 上限 256 KB（超限 400 可读）；越界或经软连接越出根 → 400；**只读，不提供写**。
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, description: 相对根目录的文件路径 }
      responses:
        '200':
          description: 文件内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkspaceFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <admin token>`。token 只从配置的 `${ENV_VAR}` 解析，不入库、不回显。
        仅 `http.admin_auth.mode=token` 时可用；缺失或无效 → 401 `UNAUTHORIZED`。
    localTrust:
      type: apiKey
      in: header
      name: X-Basalt-Local-Trust
      description: |
        仅 `http.admin_auth.mode=local_trust` 且直连来源为回环地址时可用，值必须为 `1`。
        `Forwarded` / `X-Forwarded-For` / `X-Real-IP` 不能证明回环；反向代理或隧道不得绕过认证。
        同时校验 Host 与 Origin（或 Sec-Fetch-Site），防 DNS rebinding / CSRF。
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' }
      description: 强 ETag；缺失、格式非法、弱 ETag、`*` 或与当前值不匹配 → 412。
    ResourceKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [model_connection, mcp_server, skill] }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, description: 资源名（模型连接 / MCP / 技能均按名标识） }
    ResourceUID:
      name: resource_uid
      in: query
      required: true
      schema: { type: string, description: '目标资源的稳定身份（`rs_` + 26 位 Crockford Base32）' }
      description: |
        涉及资源身份的动作（删除、范围转换、凭据撤销）必须在 `If-Match` 之外显式给出 `resource_uid`，
        且必须等于该名称当前指针；缺失或与当前指针不一致 → 409 `RESOURCE_UID_MISMATCH`，**不**按名称猜测目标
        （同名重建后旧 UID 的版本与凭据留在墓碑下，按名操作永远只作用于当前身份）。
    CredentialResourceKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [model_connection, notify_channel] }
      description: 范围与凭据动作只覆盖带使用范围的两类资源；通知渠道的 CRUD 仍走 `/notify-channels`。

  responses:
    OK:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    BadRequest:
      description: 参数非法 / 超限 / 路径越界
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    SessionBusy:
      description: 该会话已有运行在执行（不排队，稍后重试）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    TooManyRuns:
      description: 实例级并发运行超限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Timeout:
      description: 运行超过调用方时限（Run 侧记为 cancelled）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotConfigured:
      description: 能力未配置（文案点名配置键，一次 LLM 调用都不会发出）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    ServiceUnavailable:
      description: 托管凭据不可用（主密钥缺失 / 权限不符 / 格式错误 / key_id 不匹配 / 解密失败；业务码 `CREDENTIAL_UNAVAILABLE`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Unauthorized:
      description: 未认证（管理凭据缺失或无效，含 local_trust 模式未带本机信任头；业务码 `UNAUTHORIZED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Forbidden:
      description: 已认证但操作不允许（业务码 `FORBIDDEN`；回环本机信任不满足来源 / Host / Origin 校验）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Conflict:
      description: 状态冲突（同名存在 / 生命周期 generation 或 expected_state 不匹配 / Agent 忙碌，业务码 `CONFLICT`、`AGENT_BUSY` 等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    PreconditionFailed:
      description: 条件写前置条件不满足（ETag 不匹配，业务码 `PRECONDITION_FAILED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    AuthRateLimited:
      description: 认证失败次数超限（业务码 `AUTH_RATE_LIMITED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    Envelope:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: string, description: 业务码；成功为 OK，其余见 contracts/run-and-errors.md §8, example: OK }
        message: { type: string, example: success }
        data: { description: 载荷；失败时通常为空 }
        timestamp: { type: string, format: date-time }

    InfoView:
      type: object
      properties:
        version: { type: string }
        uptime_seconds: { type: integer }
        agents: { type: integer, description: 已注册 Agent 数 }
        tools: { type: integer }
        mcp_servers: { type: integer, description: 已连接数 }
        providers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              models: { type: array, items: { type: string } }
              configured: { type: boolean }

    ProfileView:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        display_name:
          type: string
          description: |
            管理台展示名（已解析）：`AGENT.md` 的 `display_name` 去空白后非空时取它，否则回退 `name`，
            因此该字段**永不为空**。它只影响展示，不改变技术名、目录名、`agent_uid` 或运行标识。
        provider: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        notify_mode: { type: string, enum: [none, all_eligible, allowlist], description: 通知意图有效值（显式或兼容推断） }
        notify_channels:
          type: array
          items: { type: string }
          description: '仅 allowlist 模式下的渠道名；none / all_eligible 时为空数组——空数组不表示「禁用通知」'
        schedules: { type: integer }
        lifecycle: { $ref: '#/components/schemas/AgentLifecycleView' }
        registered: { type: boolean, description: 加载期校验是否通过（与生命周期独立） }
        runnable: { type: boolean, description: 已注册且状态为 active 且资源引用全部可解析 }
        problems: { type: array, items: { type: string }, description: 未通过时的点名原因 }

    ToolView:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        source: { type: string, enum: [builtin, mcp, code] }

    MemoryView:
      type: object
      properties:
        scope: { type: string, enum: [global, agent] }
        agent: { type: string, description: scope=agent 时给出 }
        backend: { type: string, enum: [markdown, sqlite] }
        core: { type: string }
        archive: { type: string }

    SessionSummary:
      type: object
      properties:
        session_id: { type: string }
        profile_name: { type: string }
        channel: { type: string }
        user_id: { type: string }
        status: { type: string, enum: [active, archived] }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }

    MessageView:
      type: object
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        tool_calls:
          type: array
          description: assistant 消息发起（id / name / arguments）
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              arguments: { type: string }
        tool_call_id: { type: string, description: tool 消息回填哪次调用 }
        created_at: { type: string, format: date-time }

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          properties:
            messages:
              type: array
              description: 最近 100 条
              items: { $ref: '#/components/schemas/MessageView' }

    RunView:
      type: object
      properties:
        run_id: { type: string }
        session_id: { type: string, description: 无状态调用时为空 }
        agent: { type: string }
        channel: { type: string }
        trigger: { type: string, enum: [user, cron, manual, api] }
        status: { type: string, enum: [running, completed, limit_reached, cancelled, failed] }
        reason: { type: string, description: 非正常终止的可读原因 }
        final_text: { type: string }
        iterations: { type: integer }
        tool_calls: { type: integer }
        config_hash: { type: string, description: 合成输入哈希（含义不变） }
        manifest_hash: { type: string, description: 新增资源清单哈希；历史 Run 为空，查看时标 legacy_unrecorded }
        started_at: { type: string, format: date-time }
        finished_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "未结束（running 等非终态）时为空串；结束时为 RFC3339 date-time" }

    SkillView:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        path: { type: string, description: 工作副本相对路径 }
        version_id: { type: integer }
        version_no: { type: integer }
        content_hash: { type: string }
        etag: { type: string, description: '强 ETag：sha256:<64 位小写十六进制>' }
        file_count: { type: integer }
        referenced_by: { type: array, items: { type: string } }

    McpServerView:
      type: object
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: 仅展示可执行名；参数不展示 }
        env_keys: { type: array, items: { type: string }, description: 只回变量名，不返回值 }
        connected: { type: boolean }
        tools: { type: array, items: { type: string } }
        published_version_id: { type: integer }
        published_version_no: { type: integer }
        applied_version_id: { type: integer }
        applied_version_no: { type: integer }
        pending_restart: { type: boolean, description: 已发布但运行中的进程仍是旧版本 }

    SandboxView:
      type: object
      properties:
        file_allowed_paths: { type: array, items: { type: string } }
        shell_allowed_commands: { type: array, items: { type: string } }
        shell_interpreters:
          type: array
          items: { type: string }
          description: 受控脚本通道的解释器白名单（argv 必须 [脚本路径, 参数…]，脚本限于 Agent scripts/ 与技能库，见 contracts/agent-md.md §5.2）
        http_allowed_domains:
          type: array
          items: { type: string }
          description: '当前实际生效的出网域名白名单（不是启动配置副本）：`[]` 表示受此策略约束的出站请求全部拒绝'
        network_allowlist: { $ref: '#/components/schemas/NetworkAllowlistView' }

    NetworkAllowlistView:
      type: object
      properties:
        etag:
          type: string
          description: '当前生效策略的强 ETag，条件写 `If-Match` 的唯一取值来源；尚未装载时为空串'
        revision: { type: integer, description: 从 1 起，每次成功写入 +1；尚未装载为 0 }
        source:
          type: string
          enum: [config_seed, database]
          description: 'config_seed = 首次启动由配置种子写入；database = 来自管理台写入'
        updated_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "最近一次写入时间；零值渲染为空串（US-9 惯例）" }
        updated_by: { type: string, description: '脱敏写入者（token:<指纹> / local_trust）；种子行为空串' }

    NetworkDomainsWrite:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 253 }
          description: |
            完整替换列表（不是增量）。条目为主机名或 `*.` 前缀的通配（只覆盖子域，不覆盖裸后缀）；
            不接受 scheme / 端口 / 路径 / userinfo / IP。显式空数组 = 清空并拒绝全部受控出站请求。

    FileDraft:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: 相对 Agent 目录的路径（规范化后必须仍在目录内） }
        content: { type: string }

    AgentFilesView:
      type: object
      properties:
        agent: { type: string }
        lifecycle:
          $ref: '#/components/schemas/AgentLifecycleView'
          description: '本视图只保证 `state` / `valid` / `lifecycle_error` 的内容投影；其余字段在本响应里可能为零值（空串 / 0），**不代表**状态文件缺失。字段形状仍以 `AgentLifecycleView` 为准（2026-10-22 INFO-2 A）。'
        etag: { type: string, description: '受管文件集合的强 ETag；草稿响应为空串' }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              size: { type: integer }
        changes:
          type: object
          description: '系统在本次保存中自动应用的受控工具增删（宪法约束 11 / R7）：只可能是 `notify`，且必须随保存结果返回；无变更时两个数组均为空数组（不为 `null`）。'
          properties:
            tools_added: { type: array, items: { type: string } }
            tools_removed: { type: array, items: { type: string } }

    AgentDraftView:
      type: object
      description: |
        模型草稿结果（未落盘）。`files[].content` 是 UTF-8 正文，可直接编辑后再走
        `POST /agents/{name}/files` 提交；本视图不含大小与 ETag，因为磁盘上没有对应的基础版本。
        `files` 与 `questions` **互斥**：模型信息不足时返回问题（`files` 为空数组），
        信息足够时返回文件（`questions` 为空数组）——两者都不会是 `null`。
      properties:
        agent: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              content: { type: string }
        questions:
          type: array
          maxItems: 3
          description: |
            模型要求补充信息时给出的澄清问题（最多 3 个，`id` 不重复）。页面逐项必填后把答案经
            `answers` 回传；答案只存在于页面内存，服务端不持久化。
          items:
            type: object
            properties:
              id: { type: string }
              question: { type: string }

    ScheduleDraftView:
      type: object
      description: |
        定时候选（**未保存**）。`next_runs` 由服务端复用装载期同一套 cron / 时区解析器计算
        （RFC3339 UTC，最多 3 个，不足三次就返回实际数量）；浏览器**不**自行推导触发时间。
        确认保存走既有的 `PUT /agents/{name}/content` 的 `changes.schedules` 条件写。
      properties:
        agent: { type: string }
        id: { type: string, description: '匹配 ^[a-z0-9][a-z0-9-]{0,63}$' }
        cron: { type: string, description: 6 段（秒 分 时 日 月 周），不带 CRON_TZ= 前缀 }
        zone: { type: string, description: IANA 时区名；缺省 UTC，拒绝 Local }
        message: { type: string }
        next_runs:
          type: array
          maxItems: 3
          items: { type: string, format: date-time }

    ScheduleView:
      type: object
      properties:
        id: { type: string }
        agent: { type: string }
        cron: { type: string, description: 6 段（秒 分 时 日 月 周） }
        zone: { type: string, description: 缺省 UTC }
        message: { type: string }
        deliver_to: { type: string, description: '系统代投目标通知渠道的**资源 UID**（`rs_` 前缀）；空串 = 不代投。不接受渠道名——名称只是标签（R7）。' }
        enabled: { type: boolean }
        last_run_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "零值渲染为空串（US-9 惯例）；否则为 RFC3339 date-time" }
        last_status: { type: string }

    ExecutionView:
      type: object
      properties:
        task_id: { type: string }
        run_id: { type: string }
        status: { type: string, enum: [started, completed, failed, skipped] }
        trigger: { type: string, enum: [cron, manual] }
        duration_ms: { type: integer }
        error_message: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "未结束（started）时为空串；结束后为 RFC3339 date-time" }
        delivery_status:
          type: string
          description: '系统代投结果，与执行结果**分开**展示。空串 = 本次执行没有代投记录（任务未绑定投递目标）；有值时取 pending / sent / failed / unknown / skipped。`unknown` 表示发送结果无法证明（如超时），**不会**自动重发。'
        delivery_channel: { type: string, description: 目标渠道的资源 UID；无投递记录时为空串 }
        delivery_detail: { type: string, description: '脱敏短语（如 HTTP 状态与飞书返回码），不含地址、密钥或响应正文' }

    NotifyChannelUpsert:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: 取值来自 /notify-channels/types }
        url:
          type: string
          description: 'env 模式：精确 `${ENV_VAR}`；managed 模式：write-only 完整新地址。更新时省略 = 保留原值；空串 = 400'
        description: { type: string }
        credential_mode:
          type: string
          enum: [env, managed]
          description: '可选。创建省略只按 env 规则；更新省略保持当前模式；显式切换必须给出目标模式所需值'
        scope:
          type: string
          enum: [shared, exclusive]
          description: '缺省 shared；exclusive 必须给 owner_agent'
        owner_agent: { type: string, description: 'scope=exclusive 时必填，必须是在世 Agent 名' }

    NotifyChannelView:
      type: object
      description: 地址只以 host 形式出现；原始地址与密钥没有任何载体（凭证红线）
      properties:
        name: { type: string }
        resource_uid: { type: string, description: 不可变资源身份；同名重建会生成新 UID }
        type: { type: string }
        description: { type: string }
        url_host: { type: string, description: 'scheme + host；${VAR} 引用与不可解析地址回空（空不等于未配置）' }
        url_configured: { type: boolean, description: '存储里是否有非空地址；${VAR} 引用与 managed 密文均为 true 且 url_host 可能为空' }
        address_status:
          type: string
          enum: [managed_configured, env, empty, managed_unavailable]
          description: '地址可用性；managed_unavailable = 主密钥不可用或已撤销'
        credential_mode: { type: string, enum: [env, managed] }
        credential_ref: { type: string, description: '只读凭据引用；仅 managed 模式非空' }
        credential_state: { type: string, enum: ['', active, revoked, retired], description: '空串 = env 模式或尚未写入' }
        credential_version: { type: integer, description: '当前活动凭据版本；env 模式为 0' }
        last4: { type: string, description: '托管密钥尾号；长度不足 8 位为空' }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string, description: 'exclusive 时的所有者 Agent 名；shared 为空' }
        revision: { type: integer, description: '行级修订号；资源条件 ETag 的组成之一' }
        etag: { type: string, description: '资源条件 ETag（定义 + 范围 + 凭据版本 / 状态 + revision）' }
        referenced_by:
          type: array
          items: { type: string }
          description: '文档引用扫描结果（排序去重；归档项带 archive: 前缀）；精确绑定以 resource_bindings 为准'
        availability:
          type: string
          enum: [ready, unconfigured, unavailable]
          description: '本地配置就绪（env 变量存在且非空 / managed 凭据身份 active）；**不等于**实测可用——实测结论与时间戳只来自 last_test'
        last_test:
          description: '最后一次渠道连通性测试的脱敏结果；null = 从未测过（不得用 availability 冒充）'
          oneOf:
            - $ref: '#/components/schemas/ConnectionTestView'
            - type: 'null'

    ConnectionTestView:
      type: object
      description: 一次真实连接测试的脱敏结果；unknown 表示可能已送达（超时 / 回执无法解析），不得折叠成失败或成功
      required: [status, tested_at, detail]
      properties:
        status: { type: string, enum: [success, failed, unknown] }
        tested_at: { type: string, format: date-time, description: 'RFC3339 UTC，测试完成时刻' }
        detail: { type: string, description: '只含固定短语（目标 host / 回执码 / 变量名），不含地址原值与凭据' }

    NotifyChannelTestResult:
      type: object
      description: 渠道连通性测试结果；测试会真实发出一条固定文案 `Basalt 连通性测试`
      required: [ok, status, latency_ms, detail]
      properties:
        ok: { type: boolean, description: 'true 当且仅当服务端已确认受理（飞书还要求业务回执 code == 0）' }
        status: { type: string, enum: [success, failed, unknown] }
        latency_ms: { type: integer }
        detail: { type: string, description: '脱敏明细；unknown 时提示可能已送达、请查证后手动重试' }

    WorkspaceEntry:
      type: object
      properties:
        path: { type: string, description: 相对根目录 }
        type: { type: string, enum: [file, dir, symlink] }
        size: { type: integer, description: 文件字节数；目录与软连接为 0 }

    WorkspaceFile:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
        size: { type: integer }
        truncated: { type: boolean, description: 永远为 false（超限直接 400，不截断） }

    SystemOverview:
      type: object
      properties:
        version: { type: string }
        uptime_seconds: { type: integer }
        started_at: { type: string, format: date-time }
        agents:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            disabled: { type: integer }
            archived: { type: integer }
            invalid: { type: integer, description: 加载期校验或状态文件异常 }
        runs:
          type: object
          properties:
            running: { type: integer }
            last_24h: { type: integer }
            failed_last_24h: { type: integer }
        resources:
          type: object
          properties:
            model_connections: { type: integer }
            mcp_servers: { type: integer }
            skills: { type: integer }
        database:
          type: object
          properties:
            status: { type: string, enum: [ok, unavailable] }
            schema_version: { type: integer }
        auth:
          type: object
          properties:
            mode: { type: string, enum: [token, local_trust] }
            loopback_only: { type: boolean, description: 当前监听是否仅回环 }

    SystemSample:
      type: object
      description: 平台不支持的字段为 null，并列入 unavailable；不得伪造 0。
      properties:
        sampled_at: { type: string, format: date-time }
        cpu_percent:
          description: 进程 CPU 利用率（不是宿主整机）
          oneOf: [{ type: number }, { type: "null" }]
        memory_rss_bytes:
          oneOf: [{ type: integer }, { type: "null" }]
        goroutines:
          oneOf: [{ type: integer }, { type: "null" }]
        unavailable:
          type: array
          items: { type: string }

    RunResourceManifestView:
      type: object
      properties:
        format_version: { type: integer, description: 'v1 为旧清单；v2 增加 agent_uid、凭据版本与 notify' }
        agent_uid: { type: string, description: 'v2 起必填；v1 清单为空' }
        agent_lifecycle_state: { type: string, enum: [active, disabled, archived] }
        legacy_unrecorded: { type: boolean, description: US-11 之前的 Run 无清单，不回填 }
        provider:
          oneOf:
            - $ref: '#/components/schemas/ProviderManifestView'
            - type: "null"
          description: 'v2 的单 Provider 固定；v1 清单为 null 并看 providers'
        providers:
          type: array
          items: { $ref: '#/components/schemas/ResourceVersionRef' }
          description: 'v1 兼容字段；v2 起为空'
        mcp_servers:
          type: array
          items: { $ref: '#/components/schemas/ResourceVersionRef' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillVersionRef' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileHash' }
        notify:
          oneOf:
            - $ref: '#/components/schemas/NotifyManifestView'
            - type: "null"
          description: 'v2 起必填；v1 清单为 null（旧语义：空白名单 = 不限制）'

    ProviderManifestView:
      type: object
      properties:
        name: { type: string }
        model: { type: string }
        resource_uid: { type: string }
        version_id: { type: integer }
        version_no: { type: integer }
        credential_ref: { type: string, description: '托管凭据引用；env 模式为空' }
        credential_version: { type: integer, description: '准入时固定的凭据版本；env 模式为 0' }
        target_binding: { type: string, description: '规范化目标地址的 sha256；不含明文 URL' }

    NotifyManifestView:
      type: object
      properties:
        mode: { type: string, enum: [none, all_eligible, allowlist] }
        channels:
          type: array
          description: '解析后的具体渠道；无 "*" 通配；mode=none 时为空'
          items:
            type: object
            properties:
              name: { type: string }
              resource_uid: { type: string }

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/RunView'
        - type: object
          properties:
            resource_manifest:
              oneOf:
                - $ref: '#/components/schemas/RunResourceManifestView'
                - type: "null"

    ResourceVersionRef:
      type: object
      properties:
        kind: { type: string, enum: [model_connection, mcp_server] }
        name: { type: string }
        resource_uid: { type: string }
        version_id: { type: integer }
        version_no: { type: integer }
        content_hash: { type: string }

    SkillVersionRef:
      type: object
      properties:
        name: { type: string }
        version_id: { type: integer }
        version_no: { type: integer }
        content_hash: { type: string }
        skill_md_hash: { type: string }
        l1_hash: { type: string }
        l2_hash: { type: string }
        l3_hash: { type: string }

    FileHash:
      type: object
      properties:
        path: { type: string }
        sha256: { type: string }
        size: { type: integer }

    AgentContent:
      type: object
      required: [content, etag]
      properties:
        content: { type: string }
        etag: { type: string, description: '强 ETag：sha256:<64 位小写十六进制>' }

    AgentContentChanges:
      type: object
      description: |
        只允许已知 frontmatter 字段；未给出的字段、正文与注释保持逐字节不变；未知字段 → 400（严格已知键，
        不静默忽略拼写错误）。
      properties:
        description: { type: string }
        identity:
          type: object
          properties:
            agent_name: { type: string }
            prompt: { type: string }
        body:
          type: string
          description: '正文。缺省 = 不改；字符串 = 整段替换；空串 = 清空（页面二次确认）。不得用未给推断清空'
        provider:
          type: object
          properties:
            name: { type: string, description: 必须已在 resource_bindings 中绑定且 UID 是当前指针 }
            model: { type: string }
            temperature:
              type: [number, 'null']
              minimum: 0
              maximum: 2
              description: '三态：缺省 = 不修改；数字（含显式 0）= 写入；显式 null = 移除该字段回到供应商缺省。不得把缺省读成清除'
        tools: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        mcp_servers: { type: array, items: { type: string } }
        bootstrap: { type: array, items: { type: string } }
        notify_mode:
          type: string
          enum: [none, all_eligible, allowlist]
          description: '通知意图三态；none / all_eligible 时 notify_channels 必须为空；allowlist 至少一个'
        notify_channels:
          type: array
          items: { type: string }
          description: 'allowlist 模式下的渠道名；每个名字必须有同名绑定。空数组不表示「禁用通知」'
        bindings:
          type: array
          description: '表单显式选择资源时写入 resource_bindings；服务端在同一写边界合并，不按名重解析 UID'
          items:
            type: object
            required: [resource_kind, ref_name, resource_uid]
            properties:
              resource_kind: { type: string, enum: [model_connection, notify_channel] }
              ref_name: { type: string }
              resource_uid: { type: string }
        settings:
          type: object
          properties:
            max_iterations: { type: integer }
            max_history_turns: { type: integer }
        schedules:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              cron: { type: string, description: 6 段（秒 分 时 日 月 周） }
              zone: { type: string }
              message: { type: string }
              deliver_to:
                type: string
                description: '系统代投目标通知渠道的**资源 UID**（`rs_` 前缀）；空串 = 不代投。保存与运行两处都校验：保存期要求是合法 UID 形态，运行期要求渠道存在且对本 Agent 有资格；目标在 Run 准入时冻结（R7）。'
            required: [id, cron, message]

    AgentContentUpdate:
      oneOf:
        - type: object
          required: [content]
          properties:
            content: { type: string, description: 整份替换；必须自带完整 resource_bindings（服务端不补绑） }
        - type: object
          required: [changes]
          properties:
            changes: { $ref: '#/components/schemas/AgentContentChanges' }

    AgentConfigView:
      type: object
      description: 表单视图；与原文共用同一个 content_etag，不引入 config_etag
      properties:
        agent: { type: string }
        agent_uid: { type: string, description: 生命周期状态文件 schema v2 的稳定身份 }
        content_etag: { type: string, description: '与 GET /agents/{name}/content 完全一致；表单与原文保存共用' }
        fields: { type: object, additionalProperties: true, description: '结构化字段值与原文一致；正文只在 content 接口读取' }
        notify_mode: { type: string, enum: [none, all_eligible, allowlist], description: 有效值（显式或兼容推断） }
        notify_mode_source: { type: string, enum: [explicit, legacy_inferred] }
        references:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigReference' }
        binding_complete: { type: boolean, description: '所有引用都恰有一条有效绑定；false 时保存与准入会被拒绝并点名' }

    AgentConfigReference:
      type: object
      properties:
        resource_kind: { type: string, enum: [model_connection, notify_channel] }
        ref_name: { type: string }
        resource_uid: { type: string, description: '绑定声明的 UID；未绑定为空串' }
        resource_name: { type: string, description: '该 UID 的当前名称（同名重建后仍指向旧名 / 旧资源）' }
        binding_status: { type: string, enum: [bound, missing, stale_uid, orphan, duplicate] }
        published: { type: boolean }
        eligible: { type: boolean, description: 'shared 或属于当前 Agent；false 时保存与准入拒绝' }
        deleted: { type: boolean, description: '绑定 UID 已删除（墓碑存在）；不自动改绑同名新资源' }
        credential_state: { type: string, enum: ['', active, revoked, retired] }

    AgentLifecycleView:
      type: object
      properties:
        agent: { type: string }
        agent_uid: { type: string, description: '状态文件 schema v2 的稳定身份；缺失或损坏时为空串' }
        uid_source: { type: string, enum: ['', state_file, archive, legacy_unrecorded], description: '身份来源；空串 = 无有效状态文件' }
        state:
          oneOf:
            - { type: string, enum: [active, disabled, archived] }
            - { type: "null" }
          description: 状态文件缺失或损坏时为 null，配合 valid=false 与 lifecycle_error
        generation: { type: integer }
        updated_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "状态文件缺失或损坏（valid=false）时为空串；否则为 RFC3339 date-time" }
        operation_id: { type: string, description: 最近一次生命周期变更操作；状态文件缺失或损坏时为空串 }
        valid: { type: boolean, description: 状态文件是否存在且校验和正确 }
        lifecycle_error: { type: string, description: 状态文件缺失或损坏时的点名原因 }

    AgentLifecycleTransition:
      type: object
      required: [expected_state, expected_generation]
      properties:
        expected_state: { type: string, enum: [active, disabled] }
        expected_generation: { type: integer, description: 与状态文件 generation 不一致 → 409 }

    AgentCopyRequest:
      type: object
      required: [new_name]
      properties:
        new_name: { type: string }
        resource_mapping:
          type: array
          description: '源专属资源的显式映射；目标资源必须已存在、对副本有资格，且不得沿用源 UID'
          items:
            type: object
            required: [resource_kind, source_resource_uid, target_resource_uid]
            properties:
              resource_kind: { type: string, enum: [model_connection, notify_channel] }
              source_resource_uid: { type: string }
              target_resource_uid: { type: string }

    AgentRestoreRequest:
      type: object
      properties:
        new_name: { type: string, description: 留空 = 恢复原目录名 }

    AgentArchiveView:
      type: object
      properties:
        archive_id: { type: string }
        agent: { type: string }
        archived_at: { type: string, format: date-time }
        content_hash: { type: string }
        restored_at: { type: string, description: 未恢复为空串 }
        restored_agent_name: { type: string }

    ArchivedAgentView:
      allOf:
        - $ref: '#/components/schemas/AgentArchiveView'

    ModelConnectionView:
      type: object
      properties:
        name: { type: string }
        resource_uid: { type: string, description: 不可变资源身份；同名重建会生成新 UID }
        base_url: { type: string }
        api_key_env: { type: string, description: 'env 模式只回 `${ENV_VAR}` 引用名；managed 模式为空串' }
        default_model: { type: string }
        credential_mode: { type: string, enum: [env, managed] }
        credential_ref: { type: string, description: '只读凭据引用；仅 managed 模式非空' }
        credential_state: { type: string, enum: ['', active, revoked, retired], description: '空串 = env 模式或尚未写入' }
        credential_version: { type: integer, description: '当前活动凭据版本；env 模式为 0' }
        last4: { type: string, description: '托管密钥尾号；长度不足 8 位为空' }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string, description: 'exclusive 时的所有者 Agent 名；shared 为空' }
        revision: { type: integer, description: '行级修订号；资源条件 ETag 的组成之一' }
        published_version_id: { type: integer }
        published_version_no: { type: integer }
        applied_version_id: { type: integer }
        applied_version_no: { type: integer }
        etag: { type: string, description: '资源条件 ETag（定义 + 范围 + 凭据版本 / 状态 + revision）' }
        referenced_by: { type: array, items: { type: string } }
        availability:
          type: string
          enum: [ready, unconfigured, unavailable]
          description: '本地配置就绪（env 变量存在且非空 / managed 凭据身份 active）；**不等于**实测可用——实测结论与时间戳只来自 last_test'
        last_test:
          description: '最后一次模型连接测试的脱敏结果；null = 从未测过（不得用 availability 冒充）'
          oneOf:
            - $ref: '#/components/schemas/ConnectionTestView'
            - type: 'null'

    ModelConnectionUpsert:
      type: object
      required: [name, base_url, default_model]
      properties:
        name: { type: string }
        base_url: { type: string, description: 'http/https；不含 userinfo；改地址必须给新凭据版本' }
        api_key:
          type: string
          description: 'env 模式：精确 `${ENV_VAR}`；managed 模式：write-only 完整新值。省略 = 保留；空串 = 400'
        credential_mode:
          type: string
          enum: [env, managed]
          description: '可选。创建省略只按 env 规则；更新省略保持当前模式；显式切换必须给出目标模式所需值'
        scope:
          type: string
          enum: [shared, exclusive]
          description: '仅创建时可选；缺省 shared；exclusive 必须给 owner_agent。后续切换走 /scope 端点'
        owner_agent: { type: string, description: 'scope=exclusive 时必填，必须是在世 Agent 名' }
        default_model: { type: string }

    ModelConnectionTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer }
        model: { type: string }
        error_code: { type: string }
        error_message: { type: string, description: 脱敏，不含凭证或完整请求 }

    McpServerDetail:
      allOf:
        - $ref: '#/components/schemas/McpServerView'
        - type: object
          properties:
            args: { type: array, items: { type: string } }
            url: { type: string, description: 仅 http 传输；凭证不得出现在 URL }
            env_keys: { type: array, items: { type: string } }

    McpServerUpsert:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: stdio 必填 }
        args: { type: array, items: { type: string } }
        url: { type: string, description: http 必填 }
        env:
          type: object
          additionalProperties: { type: string }
          description: 值只能是 `${ENV_VAR}`；明文凭证 → 400

    McpServerTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer }
        tools: { type: array, items: { type: string } }
        error_code: { type: string }
        error_message: { type: string, description: 脱敏 }

    SkillFileView:
      type: object
      properties:
        path: { type: string }
        size: { type: integer }
        sha256: { type: string }
        content: { type: string, description: 文本文件全文；二进制导入不进入技能库 }

    SkillDetail:
      allOf:
        - $ref: '#/components/schemas/SkillView'
        - type: object
          properties:
            files:
              type: array
              items: { $ref: '#/components/schemas/SkillFileView' }

    SkillCreate:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    SkillImport:
      type: object
      required: [name, files]
      properties:
        name: { type: string }
        files:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FileDraft' }

    SkillUpdate:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FileDraft' }

    SkillValidateResult:
      type: object
      properties:
        valid: { type: boolean }
        problems: { type: array, items: { type: string } }

    ResourceVersionView:
      type: object
      properties:
        version_id: { type: integer }
        resource_kind: { type: string, enum: [model_connection, mcp_server, skill] }
        resource_id: { type: string }
        resource_uid: { type: string, description: '该版本所属资源身份；同名重建后的新旧版本靠它区分' }
        version_no: { type: integer }
        content_hash: { type: string }
        created_at: { type: string, format: date-time }
        operation_id: { type: string }
        published: { type: boolean }
        applied: { type: boolean }
        reverted_from_version_id:
          oneOf: [{ type: integer }, { type: "null" }]
          description: 非撤回版本为 null

    ResourceVersionDetail:
      allOf:
        - $ref: '#/components/schemas/ResourceVersionView'
        - type: object
          properties:
            definition_yaml: { type: string, description: '脱敏后的定义；env 凭证只能是 `${ENV_VAR}`，managed 凭证只显示 credential_ref' }
            manifest: { type: object, additionalProperties: true }

    PublishRequest:
      type: object
      properties:
        version_id: { type: integer, description: 留空 = 发布当前最新；给旧版本则先创建同内容新版本再发布 }

    ResourcePublishResult:
      type: object
      properties:
        version: { $ref: '#/components/schemas/ResourceVersionView' }
        pending_restart: { type: boolean, description: 仅 MCP 首版可能为 true }

    CredentialRevokeRequest:
      type: object
      required: [resource_uid, confirm]
      properties:
        resource_uid: { type: string, description: 必须等于当前指针 UID；不一致 → 409 RESOURCE_UID_MISMATCH }
        confirm: { type: boolean, enum: [true], description: 必须显式为 true }

    CredentialRevokeResult:
      type: object
      properties:
        resource_uid: { type: string }
        credential_ref: { type: string }
        credential_state: { type: string, enum: [revoked] }
        revoked_versions: { type: integer }
        revocation_epoch: { type: integer }

    ResourceScopeRequest:
      type: object
      required: [resource_uid, scope]
      properties:
        resource_uid: { type: string }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string, description: 'scope=exclusive 时必填' }

    ResourceScopeResult:
      type: object
      properties:
        resource_uid: { type: string }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string }
        revision: { type: integer }
        etag: { type: string }
        affected_eligible_agents:
          type: array
          items: { type: string }
          description: 'all_eligible 模式下会受影响但不会被自动修改的 Agent 名（影响提示）'

    ResourceReferencesView:
      type: object
      properties:
        kind: { type: string, enum: [model_connection, mcp_server, skill] }
        id: { type: string }
        resource_uid: { type: string }
        published_version_id: { type: integer }
        agents: { type: array, items: { type: string }, description: '定义名引用（解析失败按可能引用处理）' }
        bound_agents:
          type: array
          description: '按 resource_bindings 的 UID 精确引用（含归档 Agent）'
          items:
            type: object
            properties:
              agent: { type: string }
              agent_uid: { type: string }
              archived: { type: boolean }
        active_runs: { type: array, items: { type: string, description: run_id } }

    OperationView:
      type: object
      properties:
        operation_id: { type: string }
        action: { type: string }
        target_kind: { type: string, enum: [agent, schedule, model_connection, mcp_server, skill, notify_channel, network_allowlist, system] }
        target_id: { type: string }
        actor_subject: { type: string }
        auth_method: { type: string, enum: [bearer, local_trust, cli, migration] }
        source: { type: string, description: 脱敏来源地址 }
        status: { type: string, enum: [pending, success, failed, unknown] }
        result_code: { type: string }
        error_message: { type: string, description: 脱敏 }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, description: 未结束为空串 }

    OperationDetail:
      allOf:
        - $ref: '#/components/schemas/OperationView'
        - type: object
          properties:
            request_hash: { type: string }
            requested_version_id: { type: integer }
            expected_etag: { type: string }
            detail: { type: object, additionalProperties: true, description: 脱敏 detail_json }
            recovered_at: { type: string, description: 未恢复为空串 }
            verification: { type: string, enum: [not_required, applied, not_applied, indeterminate] }
