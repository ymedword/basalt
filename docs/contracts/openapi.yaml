          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              arguments: { type: string }
        tool_call_id: { type: string, description: tool 消息回填哪次调用 }
        created_at: { type: string, format: date-time }

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          properties:
            messages:
              type: array
              description: 最近 100 条
              items: { $ref: '#/components/schemas/MessageView' }

    RunView:
      type: object
      properties:
        run_id: { type: string }
        request_id: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$', description: 入口实际记录的请求标识；历史未记录时省略，不补造 }
        session_id: { type: string, description: 无状态调用时为空 }
        agent: { type: string }
        channel: { type: string }
        trigger: { type: string, enum: [user, cron, manual, api] }
        status: { type: string, enum: [running, completed, limit_reached, cancelled, failed] }
        reason: { type: string, description: 非正常终止的可读原因 }
        final_text: { type: string }
        iterations: { type: integer }
        tool_calls: { type: integer }
        config_hash: { type: string, description: 合成输入哈希（含义不变） }
        manifest_hash: { type: string, description: 新增资源清单哈希；历史 Run 为空，查看时标 legacy_unrecorded }
        started_at: { type: string, format: date-time }
        finished_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "未结束（running 等非终态）时为空串；结束时为 RFC3339 date-time" }

    SkillView:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        path: { type: string, description: 工作副本相对路径 }
        version_id: { type: integer }
        version_no: { type: integer }
        content_hash: { type: string }
        etag: { type: string, description: '强 ETag：sha256:<64 位小写十六进制>' }
        file_count: { type: integer }
        referenced_by: { type: array, items: { type: string } }

    McpServerView:
      type: object
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: 仅展示可执行名；参数不展示 }
        env_keys: { type: array, items: { type: string }, description: 只回变量名，不返回值 }
        header_keys:
          type: array
          items: { type: string }
          description: 仅 http；已配置的请求头名（只回名字，不返回值）
        credential_keys:
          type: array
          items: { $ref: '#/components/schemas/McpCredentialKeyView' }
          description: |
            逐占位符的凭据来源与状态（按 `key` 升序，env 键与 header 名同列）。不含值；未连接时同样给出，
            因为来源声明与连接无关。`managed` 永不回落 `env`
        connected: { type: boolean }
        tools: { type: array, items: { type: string } }
        published_version_id: { type: integer }
        published_version_no: { type: integer }
        applied_version_id: { type: integer }
        applied_version_no: { type: integer }
        pending_restart: { type: boolean, description: 已发布但运行中的进程仍是旧版本 }
        tool_disposition:
          oneOf:
            - $ref: '#/components/schemas/McpToolDisposition'
            - type: "null"
          description: |
            实际注册结果（offer / accept / skip 与赢家）；未连接或未知时为 `null`。
            `tools` 仍是该 server 提供的工具名（offered）；连接后 `accepted + len(skipped) = offered`
            （允许 `invalid_tool` 跳过）。注册池的重名语义不变（内置赢家、WARN 不改）。

    McpCredentialKeyView:
      type: object
      required: [key, mode, state, last4]
      properties:
        key: { type: string, description: '占位符名：`env` 的键名或 `headers` 的头名' }
        mode:
          type: string
          enum: [managed, env]
          description: 该占位符声明的来源；无来源声明的占位符保存时即被拒绝，因此不会出现在列表里
        state:
          type: string
          enum: [managed, managed_revoked, env, missing]
          description: |
            `managed` = 有活动托管值；`managed_revoked` = 托管值已撤销且未重录，**不回落 env**；
            `env` = 声明走进程环境（不表示该变量此刻存在，存在性看诊断的 `env` 轴）；
            `missing` = 声明 `managed` 但没有任何可用版本。解析失败时连接 / apply 按失败分类收口，不静默降级
        last4:
          type: string
          description: '仅 `managed` / `managed_revoked` 且已有版本时回末 4 位，其余为空串；**永不**回完整值'

    McpCredentialInput:
      type: object
      required: [key, mode]
      properties:
        key:
          type: string
          description: '占位符名：`env` 的键名或 `headers` 的头名（同名即同一占位符，跨两者重名 → 400）'
        mode: { type: string, enum: [managed, env], description: 必填——来源不靠"托管行是否存在"推断 }
        value:
          type: string
          description: |
            只在写请求里出现，**永不回读**，不进日志 / 审计 / 模型上下文。`mode=managed` 且给出 → 生成新凭据
            版本（旧版本 superseded，撤销纪元不复位）；`mode=managed` 且省略 → 保留该键已有托管值（普通编辑
            不清凭据）；没有旧值又省略 → 400；`mode=env` 时出现 → 400（改来源须先显式清空）

    McpToolDisposition:
      type: object
      properties:
        offered: { type: integer }
        accepted: { type: integer }
        skipped:
          type: array
          items: { $ref: '#/components/schemas/McpToolSkip' }

    McpToolSkip:
      type: object
      properties:
        name: { type: string }
        winner_source:
          type: string
          description: '`builtin` 或具体 MCP server 名；无法确定（理论上不应发生）为 `unknown`，不得猜'
        reason: { type: string, enum: [duplicate_name, invalid_tool] }

    McpCatalog:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, description: 目录 schema 版本（当前为 1） }
        items:
          type: array
          items: { $ref: '#/components/schemas/McpCatalogEntry' }
          description: 按 `id` 升序

    McpCatalogEntry:
      type: object
      required: [id, display_name, summary, category, transport, command, args, url, env, requires, source_url, verified, verification_note, verified_at, verified_platforms, warnings]
      properties:
        id: { type: string, description: 唯一 kebab-case 标识 }
        display_name: { type: string }
        summary: { type: string }
        category: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: stdio 必填；http 为空串 }
        args:
          type: array
          items: { type: string }
          description: '可为空数组；`<...>` 只是编辑标记，不是运行时变量'
        url: { type: string, description: 'http 必填且为绝对 URL；stdio 为空串' }
        env:
          type: array
          items: { $ref: '#/components/schemas/McpCatalogEnv' }
          description: 可为空数组
        requires:
          type: array
          minItems: 1
          items: { type: string }
        source_url: { type: string, description: 必须为 https 来源 }
        verified: { type: boolean }
        verification_note: { type: string, description: '`verified=false` 时必须非空，写清待实测项' }
        verified_at: { type: string, description: 'RFC 3339；`verified=false` 时为空串，`verified=true` 时非空' }
        verified_platforms:
          type: array
          items: { type: string, enum: [windows, linux, darwin] }
          description: '`verified=false` 时为空数组；不写 `all`'
        warnings:
          type: array
          items:
            type: string
            enum:
              - read_only_tool_face_required
              - server_write_capability
              - write_tool_name_collision
              - browser_required
              - sqlite_sample_only
              - package_entry_unverified
              - stdio_child_egress_unconstrained
          description: 只回固定 code，不返回自由文本（与诊断 warnings 各自独立枚举）

    McpCatalogEnv:
      type: object
      required: [key, placeholder, required, description]
      properties:
        key: { type: string }
        placeholder:
          type: string
          pattern: '^\$\{[A-Za-z_][A-Za-z0-9_]*\}$'
          description: 必须是 `${KEY}` 且与 `key` 一致
        required: { type: boolean }
        description: { type: string }

    McpServerDiagnosis:
      type: object
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        published_version_id: { type: integer }
        applied_version_id: { type: integer }
        pending_restart:
          type: boolean
          description: 只由 published != applied 且 published != 0 决定，与 connected 无关
        command:
          oneOf:
            - $ref: '#/components/schemas/McpCommandDiagnosis'
            - type: "null"
          description: stdio 为对象；http 为 `null`
        env:
          type: array
          items: { $ref: '#/components/schemas/McpEnvDiagnosis' }
          description: |
            按 `key` 升序；只回布尔，不回值。本轴只覆盖 stdio 的 `env` 键——http 的 `headers` 占位符
            不在本轴，其就绪性由 `McpServerView.credential_keys` 与 apply 预检判定
        dependency:
          oneOf:
            - $ref: '#/components/schemas/McpDependencyDiagnosis'
            - type: "null"
          description: |
            运行时依赖轴（Node / Python / DBHub 等）。无运行时组件登记的自定义条目为 `null`（不是"缺失"）；
            只检测不安装、不启动任何进程
        references: { $ref: '#/components/schemas/McpReferencesDiagnosis' }
        warnings:
          type: array
          items:
            type: string
            enum:
              - stdio_child_egress_unconstrained
              - remote_mcp_downstream_unconstrained
              - args_placeholders_not_resolved
              - package_entry_unverified
              - http_auth_header_unsupported
              - env_gate_process_local
          description: 只回固定 code，不返回自由文本（与目录 warnings 各自独立枚举）
        checked_at: { type: string, format: date-time }

    McpCommandDiagnosis:
      type: object
      properties:
        state: { type: string, enum: [located, not_found, unconfirmed] }
        path: { type: string, description: '仅 `located` 时非空；不返回命令原文以外的敏感内容' }
        reason: { type: string, enum: [lookpath, absolute, not_found, relative_path, script, permission, unknown] }

    McpEnvDiagnosis:
      type: object
      properties:
        key: { type: string }
        set: { type: boolean, description: 变量存在且非空为 true；未设置或空字符串为 false }

    McpDependencyDiagnosis:
      type: object
      required: [component, state, expected_version, found_version]
      properties:
        component: { type: string, description: '运行时组件名（如 node / python / dbhub）；不返回绝对路径或命令原文' }
        state: { type: string, enum: [ready, missing, version_mismatch] }
        expected_version: { type: string, description: 未登记期望版本时为空串 }
        found_version: { type: string, description: '`missing` 时为空串；`version_mismatch` 时给出实测版本' }

    McpReferencesDiagnosis:
      type: object
      required: [count, agents]
      properties:
        count: { type: integer }
        agents:
          type: array
          items: { type: string }
          description: '引用该 server 的 Agent 名（升序，含归档 Agent）；与 `/resources/{kind}/{id}/references` 同源'

    SandboxView:
      type: object
      properties:
        isolation: { $ref: '#/components/schemas/IsolationView' }
        file_allowed_paths: { type: array, items: { type: string } }
        shell_allowed_commands: { type: array, items: { type: string } }
        shell_interpreters:
          type: array
          items: { type: string }
          description: 受控脚本通道的解释器白名单（argv 必须 [脚本路径, 参数…]，脚本限于 Agent scripts/ 与技能库，见 contracts/agent-md.md §5.2）
        http_allowed_domains:
          type: array
          items: { type: string }
          description: '当前实际生效的出网域名白名单（不是启动配置副本）：`[]` 表示受此策略约束的出站请求全部拒绝'
        network_allowlist: { $ref: '#/components/schemas/NetworkAllowlistView' }
        execution_profile:
          type: string
          enum: [standard, strict]
          description: 当前生效的执行档位；权威源是 `execution_policy`（见 `GET /execution-policy`），此处只是投影
        execution_policy: { $ref: '#/components/schemas/NetworkAllowlistView' }
        denied_domains:
          type: array
          items: { type: string }
          description: |
            当前实际生效的禁止域名（与白名单同一套语法）。**两档都先于放行判定**：命中即拒；
            `[]` 表示没有禁止条目。显式空数组与"未配置"在本字段上不可区分，来源以 `network_denylist` 为准
        network_denylist: { $ref: '#/components/schemas/NetworkAllowlistView' }

    IsolationView:
      type: object
      description: 静态执行隔离配置及启动探针的只读投影；修改配置后需重启
      properties:
        enabled: { type: boolean }
        backend: { type: string, enum: ["", docker] }
        profiles: { type: array, items: { $ref: '#/components/schemas/IsolationProfileView' } }
        tools: { type: object, additionalProperties: { type: string, enum: [local, oci, gvisor] } }
        max_concurrent: { type: integer }
        max_total_cpus: { type: number }
        max_total_memory_mb: { type: integer }
        max_total_temp_bytes: { type: integer, format: int64 }
        max_total_artifact_bytes: { type: integer, format: int64 }
        checked_at: { oneOf: [{ type: string, format: date-time }, { const: "" }] }
        unavailable_reason: { type: string }

    IsolationProfileView:
      type: object
      properties:
        name: { type: string, enum: [oci, gvisor] }
        runtime: { type: string, enum: [runc, runsc] }
        image_digest: { type: string }
        bound: { type: boolean }
        available: { type: boolean }
        reason: { type: string }
        cpus: { type: number }
        memory_mb: { type: integer }
        pids: { type: integer }
        tmpfs_mb: { type: integer }
        timeout_seconds: { type: integer }

    IsolationExecutionView:
      type: object
      properties:
        tool_invocation_id: { type: integer, format: int64 }
        tool_call_id: { type: string }
        tool_name: { type: string }
        profile: { type: string, enum: [oci, gvisor] }
        runtime: { type: string, enum: [runc, runsc] }
        state: { type: string, enum: [creating, running, finished, canceled, timeout, failed, unknown] }
        exit_code: { type: integer }
        cleanup_state: { type: string, enum: [pending, cleaned, failed] }
        error_reason:
          type: string
          enum: ["", config_missing, not_ready, policy_denied, admission_rejected, admission_unavailable, image_untrusted, input_rejected, create_failed, create_unknown, start_failed, wait_failed, state_unknown, artifact_rejected, artifact_publish_failed, limit_exceeded, canceled, timeout, orphan_cleaned, cleanup_failed]
        artifact_count: { type: integer }
        artifact_bytes: { type: integer, format: int64 }
        started_at: { oneOf: [{ type: string, format: date-time }, { const: "" }] }
        finished_at: { oneOf: [{ type: string, format: date-time }, { const: "" }] }

    NetworkAllowlistView:
      type: object
      properties:
        etag:
          type: string
          description: '当前生效策略的强 ETag，条件写 `If-Match` 的唯一取值来源；尚未装载时为空串'
        revision: { type: integer, description: 从 1 起，每次成功写入 +1；尚未装载为 0 }
        source:
          type: string
          enum: [config_seed, database, migration, instance_init]
          description: |
            `config_seed` = 首次启动由配置种子写入（仅出网白名单 / 禁止域名）；`database` = 管理台写入；
            `migration` = 版本迁移写入（如 `execution_policy` 升级一律 strict）；`instance_init` = 实例初始化
            流程写入（如新建库的 `standard`）。出网白名单与禁止域名只会出现前两种取值
        updated_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "最近一次写入时间；零值渲染为空串（US-9 惯例）" }
        updated_by: { type: string, description: '脱敏写入者（token:<指纹> / local_trust）；种子 / 迁移 / 初始化行为空串' }

    NetworkDomainsWrite:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          maxItems: 200
          items: { type: string, maxLength: 253 }
          description: |
            完整替换列表（不是增量）。条目为主机名或 `*.` 前缀的通配（只覆盖子域，不覆盖裸后缀）；
            不接受 scheme / 端口 / 路径 / userinfo / IP。显式空数组 = 清空并拒绝全部受控出站请求。

    ExecutionPolicyView:
      allOf:
        - $ref: '#/components/schemas/NetworkAllowlistView'
        - type: object
          required: [profile, exceptions_count, protected_addresses, shell_names, pending_confirmations]
          properties:
            profile: { type: string, enum: [standard, strict], description: 当前生效的执行档位 }
            exceptions_count: { type: integer, description: 当前生效的内网访问例外条数 }
            protected_addresses:
              type: array
              items: { type: string }
              description: |
                受保护地址段（两档相同，来自代码常量而非配置）。只作展示：告诉管理员哪些地址默认拒绝、
                以及页面为何出现待确认项。云元数据地址单列，任何档位与例外都不放行
            shell_names:
              type: array
              items: { type: string }
              description: 交互式 shell 名称集合（去扩展名比对）。命中即拒，是**能力上限声明**，不是行为识别
            pending_confirmations:
              type: array
              items: { $ref: '#/components/schemas/PendingPolicyConfirmation' }
              description: |
                升级迁移的待确认项（只读扫描结果，不落库）：出网白名单中解析到受保护地址段的条目、命令白名单中
                命中新增 shell 名称的条目。已加例外、或已记录「保持拒绝」的条目不再列出

    ExecutionPolicyWrite:
      type: object
      required: [profile, expected_profile]
      properties:
        profile: { type: string, enum: [standard, strict], description: 目标档位 }
        expected_profile:
          type: string
          enum: [standard, strict]
          description: |
            客户端渲染确认框时看到的当前档位。与库内不一致 → 409 `EXECUTION_PROFILE_MISMATCH`（零写入）。
            用途是保证"用户确认的变化方向"仍然成立；`If-Match` 不能代替它（两者都必须满足）

    PendingPolicyConfirmation:
      type: object
      required: [id, axis, value, reason, resolved_protected]
      properties:
        id: { type: string, description: '稳定标识（`<axis>:<value>`）；页面据此记住处置结果' }
        axis: { type: string, enum: [network_allowlist, shell_command] }
        value: { type: string, description: '条目原文（域名或命令名）；不含凭据与参数' }
        reason: { type: string, enum: [protected_address, shell_name] }
        resolved_protected:
          type: array
          items: { type: string }
          description: |
            仅 `network_allowlist` 轴：本次解析命中的受保护地址；其余为空数组。解析失败（NODATA / 超时）的
            条目不计入待确认项，也不猜测

    PolicyConfirmationWrite:
      type: object
      required: [id, decision]
      properties:
        id:
          type: string
          description: '`GET /execution-policy` 返回的待确认项 id（`<axis>:<value>`）'
        decision:
          type: string
          enum: [keep_denied]
          description: |
            「保持拒绝」。当前是唯一取值：放行动作走 `POST /network-exceptions`，另写
            `network_exception.create`——一次写入只表达一个目的，不用本端点顺带建例外。其它取值 → 400

    PolicyConfirmationResult:
      type: object
      required: [id, decision, operation_id, already_recorded]
      properties:
        id: { type: string, description: 处置的待确认项 id }
        decision: { type: string, enum: [keep_denied] }
        operation_id: { type: string, description: '本次处置的管理操作标识；`already_recorded=true` 时为已有行的标识' }
        already_recorded:
          type: boolean
          description: 此前已记录过同一条处置（返回 200，不新增审计行）

    NetworkExceptionListView:
      type: object
      required: [etag, exceptions]
      properties:
        etag:
          type: string
          description: '整份例外集合的强 ETag（排序后摘要），`DELETE` 的 `If-Match` 唯一取值来源；空集合同样有稳定 ETag'
        exceptions:
          type: array
          items: { $ref: '#/components/schemas/NetworkExceptionView' }

    NetworkExceptionView:
      type: object
      required: [exception_id, kind, value, note, revision, created_at, created_by, operation_id]
      properties:
        exception_id: { type: string, description: '`exc_` + 26 位 Crockford Base32' }
        kind: { type: string, enum: [host, ip_port] }
        value: { type: string, description: '`host` 为主机名（可 `*.` 前缀）；`ip_port` 为 `IP:端口` 字面量' }
        note: { type: string, description: 必填理由；同一理由进管理审计 }
        revision: { type: integer, description: 行版本，创建为 1；删除即整行移除，不保留历史行 }
        created_at: { type: string, format: date-time }
        created_by: { type: string, description: '脱敏操作者（token:<指纹> / local_trust）；审计行缺失时为空串' }
        operation_id: { type: string, description: 创建该例外的管理操作标识 }

    NetworkExceptionCreate:
      type: object
      required: [kind, value, note]
      properties:
        kind: { type: string, enum: [host, ip_port] }
        value: { type: string }
        note: { type: string, minLength: 1, maxLength: 500, description: 必填且不能全是空白 }

    NetworkExceptionDeleteResult:
      type: object
      required: [exception_id, etag, operation_id]
      properties:
        exception_id: { type: string }
        etag: { type: string, description: 删除后整份集合的强 ETag }
        operation_id: { type: string }

    InstanceSecretsView:
      type: object
      required: [state, key_id, initialized_at, key_file, recovery_reason, can_initialize, credential_summary]
      properties:
        state:
          type: string
          enum: [uninitialized, ready, recovery_required]
          description: |
            `uninitialized` = 无初始化记录、无密钥文件、无托管密文；`ready` = 记录与密钥一致且可读；
            `recovery_required` = 记录存在但密钥缺失 / 损坏 / `key_id` 不符，或存在无法证明来源的密钥文件。
            `recovery_required` 下任何托管凭据操作返回 `SECRETS_RECOVERY_REQUIRED`，且**不生成替代密钥**
        key_id:
          type: string
          description: '仅 `ready` 时非空；不含密钥材料与指纹。页面可截断显示'
        initialized_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: 未初始化为空串 }
        key_file: { type: string, description: '密钥文件路径（供备份指引）；不含密钥材料，未解析出时为空串' }
        recovery_reason:
          type: string
          enum: ["", missing, corrupt, key_id_mismatch, unprovable_provenance, unavailable, key_path_missing]
          description: |
            仅 `recovery_required` 时非空：`missing` 文件不在；`corrupt` 格式 / 权限 / nlink 校验失败；
            `key_id_mismatch` 与 `instance_secrets` 不符；`unprovable_provenance` 密钥材料来源不可证明——
            密钥文件无法用 `os.SameFile` 证明来源，**或**无初始化记录但已存在托管密文（密钥能否解开
            现存密文不构成来源证明，D-40）；`unavailable` 库或文件系统读取失败（此时只报"无法判定"，
            不猜具体原因）；`key_path_missing` 有初始化记录但当前解析不出主密钥路径（实例名册 /
            `secrets` 配置缺失）。
            缺少 `secrets` 段本身**不**表示纯环境变量部署；纯 env 只由显式 `secrets.auto_init: false` 表达
        can_initialize:
          type: boolean
          description: |
            此刻执行 `POST /instance/secrets/init` 是否会成功：判定允许**且**已有路径或能在本次动作里
            建立实例身份与路径。页面据此显示初始化按钮；存量无名册实例为 true，显式纯 env（`auto_init: false`）为 false。
            首次保存托管凭据时的必要初始化由保存动作自动完成，不以此字段为前提
        credential_summary: { $ref: '#/components/schemas/CredentialKeySummary' }

    CredentialKeySummary:
      type: object
      required: [managed, managed_revoked, env, missing]
      properties:
        managed: { type: integer, description: 有活动托管值的占位符数（MCP 逐键 + 其它 owner） }
        managed_revoked: { type: integer }
        env: { type: integer }
        missing: { type: integer }

    InstanceSecretsInitRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, enum: [true], description: 必须显式为 true }

    FileDraft:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: 相对 Agent 目录的路径（规范化后必须仍在目录内） }
        content: { type: string }

    AgentFilesView:
      type: object
      properties:
        agent: { type: string }
        lifecycle:
          $ref: '#/components/schemas/AgentLifecycleView'
          description: '本视图只保证 `state` / `valid` / `lifecycle_error` 的内容投影；其余字段在本响应里可能为零值（空串 / 0），**不代表**状态文件缺失。字段形状仍以 `AgentLifecycleView` 为准（2026-10-22 INFO-2 A）。'
        etag: { type: string, description: '受管文件集合的强 ETag；草稿响应为空串' }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              size: { type: integer }
        changes:
          type: object
          description: '系统在本次保存中自动应用的受控工具增删（宪法约束 11 / R7）：只可能是 `notify`，且必须随保存结果返回；无变更时两个数组均为空数组（不为 `null`）。'
          properties:
            tools_added: { type: array, items: { type: string } }
            tools_removed: { type: array, items: { type: string } }

    AgentDraftView:
      type: object
      description: |
        模型草稿结果（未落盘）。`files[].content` 是 UTF-8 正文，可直接编辑后再走
        `POST /agents/{name}/files` 提交；本视图不含大小与 ETag，因为磁盘上没有对应的基础版本。
        `files` 与 `questions` **互斥**：模型信息不足时返回问题（`files` 为空数组），
        信息足够时返回文件（`questions` 为空数组）——两者都不会是 `null`。
      properties:
        agent: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              content: { type: string }
        questions:
          type: array
          maxItems: 3
          description: |
            模型要求补充信息时给出的澄清问题（最多 3 个，`id` 不重复）。页面逐项必填后把答案经
            `answers` 回传；答案只存在于页面内存，服务端不持久化。
          items:
            type: object
            properties:
              id: { type: string }
              question: { type: string }

    ScheduleDraftView:
      type: object
      description: |
        定时候选（**未保存**）。`next_runs` 由服务端复用装载期同一套 cron / 时区解析器计算
        （RFC3339 UTC，最多 3 个，不足三次就返回实际数量）；浏览器**不**自行推导触发时间。
        确认保存走既有的 `PUT /agents/{name}/content` 的 `changes.schedules` 条件写。
      properties:
        agent: { type: string }
        id: { type: string, description: '匹配 ^[a-z0-9][a-z0-9-]{0,63}$' }
        cron: { type: string, description: 6 段（秒 分 时 日 月 周），不带 CRON_TZ= 前缀 }
        zone: { type: string, description: IANA 时区名；缺省 UTC，拒绝 Local }
        message: { type: string }
        next_runs:
          type: array
          maxItems: 3
          items: { type: string, format: date-time }

    ScheduleView:
      type: object
      properties:
        id: { type: string }
        agent: { type: string }
        cron: { type: string, description: 6 段（秒 分 时 日 月 周） }
        zone: { type: string, description: 缺省 UTC }
        message: { type: string }
        deliver_to: { type: string, description: '系统代投目标通知渠道的**资源 UID**（`rs_` 前缀）；空串 = 不代投。不接受渠道名——名称只是标签（R7）。' }
        enabled: { type: boolean }
        last_run_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "零值渲染为空串（US-9 惯例）；否则为 RFC3339 date-time" }
        last_status: { type: string }

    ExecutionView:
      type: object
      properties:
        task_id: { type: string }
        run_id: { type: string }
        status: { type: string, enum: [started, completed, failed, skipped] }
        trigger: { type: string, enum: [cron, manual] }
        duration_ms: { type: integer }
        error_message: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "未结束（started）时为空串；结束后为 RFC3339 date-time" }
        delivery_status:
          type: string
          description: '系统代投结果，与执行结果**分开**展示。空串 = 本次执行没有代投记录（任务未绑定投递目标）；有值时取 pending / sent / failed / unknown / skipped。`unknown` 表示发送结果无法证明（如超时），**不会**自动重发。'
        delivery_channel: { type: string, description: 目标渠道的资源 UID；无投递记录时为空串 }
        delivery_detail: { type: string, description: '脱敏短语（如 HTTP 状态与飞书返回码），不含地址、密钥或响应正文' }

    NotifyChannelUpsert:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: 取值来自 /notify-channels/types }
        url:
          type: string
          description: 'env 模式：精确 `${ENV_VAR}`；managed 模式：write-only 完整新地址。更新时省略 = 保留原值；空串 = 400'
        description: { type: string }
        credential_mode:
          type: string
          enum: [env, managed]
          description: '可选。创建省略只按 env 规则；更新省略保持当前模式；显式切换必须给出目标模式所需值'
        scope:
          type: string
          enum: [shared, exclusive]
          description: '缺省 shared；exclusive 必须给 owner_agent'
        owner_agent: { type: string, description: 'scope=exclusive 时必填，必须是在世 Agent 名' }

    NotifyChannelView:
      type: object
      description: 地址只以 host 形式出现；原始地址与密钥没有任何载体（凭证红线）
      properties:
        name: { type: string }
        resource_uid: { type: string, description: 不可变资源身份；同名重建会生成新 UID }
        type: { type: string }
        description: { type: string }
        url_host: { type: string, description: 'scheme + host；${VAR} 引用与不可解析地址回空（空不等于未配置）' }
        url_configured: { type: boolean, description: '存储里是否有非空地址；${VAR} 引用与 managed 密文均为 true 且 url_host 可能为空' }
        address_status:
          type: string
          enum: [managed_configured, env, empty, managed_unavailable]
          description: '地址可用性；managed_unavailable = 主密钥不可用或已撤销'
        credential_mode: { type: string, enum: [env, managed] }
        credential_ref: { type: string, description: '只读凭据引用；仅 managed 模式非空' }
        credential_state: { type: string, enum: ['', active, revoked, retired], description: '空串 = env 模式或尚未写入' }
        credential_version: { type: integer, description: '当前活动凭据版本；env 模式为 0' }
        last4: { type: string, description: '托管密钥尾号；长度不足 8 位为空' }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string, description: 'exclusive 时的所有者 Agent 名；shared 为空' }
        revision: { type: integer, description: '行级修订号；资源条件 ETag 的组成之一' }
        etag: { type: string, description: '资源条件 ETag（定义 + 范围 + 凭据版本 / 状态 + revision）' }
        referenced_by:
          type: array
          items: { type: string }
          description: '文档引用扫描结果（排序去重；归档项带 archive: 前缀）；精确绑定以 resource_bindings 为准'
        availability:
          type: string
          enum: [ready, unconfigured, unavailable]
          description: '本地配置就绪（env 变量存在且非空 / managed 凭据身份 active）；**不等于**实测可用——实测结论与时间戳只来自 last_test'
        last_test:
          description: '最后一次渠道连通性测试的脱敏结果；null = 从未测过（不得用 availability 冒充）'
          oneOf:
            - $ref: '#/components/schemas/ConnectionTestView'
            - type: 'null'

    ConnectionTestView:
      type: object
      description: 一次真实连接测试的脱敏结果；unknown 表示可能已送达（超时 / 回执无法解析），不得折叠成失败或成功
      required: [status, tested_at, detail]
      properties:
        status: { type: string, enum: [success, failed, unknown] }
        tested_at: { type: string, format: date-time, description: 'RFC3339 UTC，测试完成时刻' }
        detail: { type: string, description: '只含固定短语（目标 host / 回执码 / 变量名），不含地址原值与凭据' }

    NotifyChannelTestResult:
      type: object
      description: 渠道连通性测试结果；测试会真实发出一条固定文案 `Basalt 连通性测试`
      required: [ok, status, latency_ms, detail]
      properties:
        ok: { type: boolean, description: 'true 当且仅当服务端已确认受理（飞书还要求业务回执 code == 0）' }
        status: { type: string, enum: [success, failed, unknown] }
        latency_ms: { type: integer }
        detail: { type: string, description: '脱敏明细；unknown 时提示可能已送达、请查证后手动重试' }

    WorkspaceEntry:
      type: object
      properties:
        path: { type: string, description: 相对根目录 }
        type: { type: string, enum: [file, dir, symlink] }
        size: { type: integer, description: 文件字节数；目录与软连接为 0 }

    WorkspaceFile:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
        size: { type: integer }
        truncated: { type: boolean, description: 永远为 false（超限直接 400，不截断） }

    SystemOverview:
      type: object
      properties:
        version: { type: string }
        uptime_seconds: { type: integer }
        started_at: { type: string, format: date-time }
        agents:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            disabled: { type: integer }
            archived: { type: integer }
            invalid: { type: integer, description: 加载期校验或状态文件异常 }
        runs:
          type: object
          properties:
            running: { type: integer }
            last_24h: { type: integer }
            failed_last_24h: { type: integer }
        resources:
          type: object
          properties:
            model_connections: { type: integer }
            mcp_servers: { type: integer }
            skills: { type: integer }
        database:
          type: object
          properties:
            status: { type: string, enum: [ok, unavailable] }
            schema_version: { type: integer }
        auth:
          type: object
          properties:
            mode: { type: string, enum: [token, local_trust] }
            loopback_only: { type: boolean, description: 当前监听是否仅回环 }

    SystemSample:
      type: object
      description: 平台不支持的字段为 null，并列入 unavailable；不得伪造 0。
      properties:
        sampled_at: { type: string, format: date-time }
        cpu_percent:
          description: 进程 CPU 利用率（不是宿主整机）
          oneOf: [{ type: number }, { type: "null" }]
        memory_rss_bytes:
          oneOf: [{ type: integer }, { type: "null" }]
        goroutines:
          oneOf: [{ type: integer }, { type: "null" }]
        unavailable:
          type: array
          items: { type: string }

    RunResourceManifestView:
      type: object
      properties:
        format_version: { type: integer, description: 'v1 为旧清单；v2 增加 agent_uid、凭据版本与 notify' }
        agent_uid: { type: string, description: 'v2 起必填；v1 清单为空' }
        agent_lifecycle_state: { type: string, enum: [active, disabled, archived] }
        legacy_unrecorded: { type: boolean, description: US-11 之前的 Run 无清单，不回填 }
        provider:
          oneOf:
            - $ref: '#/components/schemas/ProviderManifestView'
            - type: "null"
          description: 'v2 的单 Provider 固定；v1 清单为 null 并看 providers'
        providers:
          type: array
          items: { $ref: '#/components/schemas/ResourceVersionRef' }
          description: 'v1 兼容字段；v2 起为空'
        mcp_servers:
          type: array
          items: { $ref: '#/components/schemas/ResourceVersionRef' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillVersionRef' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileHash' }
        notify:
          oneOf:
            - $ref: '#/components/schemas/NotifyManifestView'
            - type: "null"
          description: 'v2 起必填；v1 清单为 null（旧语义：空白名单 = 不限制）'

    ProviderManifestView:
      type: object
      properties:
        name: { type: string }
        model: { type: string }
        resource_uid: { type: string }
        version_id: { type: integer }
        version_no: { type: integer }
        credential_ref: { type: string, description: '托管凭据引用；env 模式为空' }
        credential_version: { type: integer, description: '准入时固定的凭据版本；env 模式为 0' }
        target_binding: { type: string, description: '规范化目标地址的 sha256；不含明文 URL' }

    NotifyManifestView:
      type: object
      properties:
        mode: { type: string, enum: [none, all_eligible, allowlist] }
        channels:
          type: array
          description: '解析后的具体渠道；无 "*" 通配；mode=none 时为空'
          items:
            type: object
            properties:
              name: { type: string }
              resource_uid: { type: string }

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/RunView'
        - type: object
          properties:
            isolation_executions:
              type: array
              items: { $ref: '#/components/schemas/IsolationExecutionView' }
            resource_manifest:
              oneOf:
                - $ref: '#/components/schemas/RunResourceManifestView'
                - type: "null"

    ResourceVersionRef:
      type: object
      properties:
        kind: { type: string, enum: [model_connection, mcp_server] }
        name: { type: string }
        resource_uid: { type: string }
        version_id: { type: integer }
        version_no: { type: integer }
        content_hash: { type: string }

    SkillVersionRef:
      type: object
      properties:
        name: { type: string }
        version_id: { type: integer }
        version_no: { type: integer }
        content_hash: { type: string }
        skill_md_hash: { type: string }
        l1_hash: { type: string }
        l2_hash: { type: string }
        l3_hash: { type: string }

    FileHash:
      type: object
      properties:
        path: { type: string }
        sha256: { type: string }
        size: { type: integer }

    AgentContent:
      type: object
      required: [content, etag]
      properties:
        content: { type: string }
        etag: { type: string, description: '强 ETag：sha256:<64 位小写十六进制>' }

    AgentContentChanges:
      type: object
      description: |
        只允许已知 frontmatter 字段；未给出的字段、正文与注释保持逐字节不变；未知字段 → 400（严格已知键，
        不静默忽略拼写错误）。
      properties:
        description: { type: string }
        identity:
          type: object
          properties:
            agent_name: { type: string }
            prompt: { type: string }
        body:
          type: string
          description: '正文。缺省 = 不改；字符串 = 整段替换；空串 = 清空（页面二次确认）。不得用未给推断清空'
        provider:
          type: object
          properties:
            name: { type: string, description: 必须已在 resource_bindings 中绑定且 UID 是当前指针 }
            model: { type: string }
            temperature:
              type: [number, 'null']
              minimum: 0
              maximum: 2
              description: '三态：缺省 = 不修改；数字（含显式 0）= 写入；显式 null = 移除该字段回到供应商缺省。不得把缺省读成清除'
        tools: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        mcp_servers: { type: array, items: { type: string } }
        bootstrap: { type: array, items: { type: string } }
        notify_mode:
          type: string
          enum: [none, all_eligible, allowlist]
          description: '通知意图三态；none / all_eligible 时 notify_channels 必须为空；allowlist 至少一个'
        notify_channels:
          type: array
          items: { type: string }
          description: 'allowlist 模式下的渠道名；每个名字必须有同名绑定。空数组不表示「禁用通知」'
        bindings:
          type: array
          description: '表单显式选择资源时写入 resource_bindings；服务端在同一写边界合并，不按名重解析 UID'
          items:
            type: object
            required: [resource_kind, ref_name, resource_uid]
            properties:
              resource_kind: { type: string, enum: [model_connection, notify_channel] }
              ref_name: { type: string }
              resource_uid: { type: string }
        settings:
          type: object
          properties:
            max_iterations: { type: integer }
            max_history_turns: { type: integer }
            include_global_memory:
              type: [boolean, 'null']
              description: '记忆注入层选择，**声明上的四态**：省略字段 = 不修改；`true` = 全局层与 Agent 层合并注入（`## 全局记忆` 在前、`## Agent 记忆` 在后，按条目正文去重，注入期两次读层）；`false` = 只注 Agent 层、永不回退全局层；`null` = **清除该行**，文件回到未声明。未声明时运行期走兼容回退——Agent 层有内容只注 Agent 层，为空才回退全局层，两层不叠加（与升级前逐字节一致）。`null` 与 `false` 语义不同：前者是"沿用旧规则"，后者是"只要 Agent 层"，实现不得互相替代。同一补丁里同时写值与 `null` → 400 `EDIT_UNSUPPORTED`；该行本来不存在时 `null` 是幂等 no-op。'
        schedules:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              cron: { type: string, description: 6 段（秒 分 时 日 月 周） }
              zone: { type: string }
              message: { type: string }
              deliver_to:
                type: string
                description: '系统代投目标通知渠道的**资源 UID**（`rs_` 前缀）；空串 = 不代投。保存与运行两处都校验：保存期要求是合法 UID 形态，运行期要求渠道存在且对本 Agent 有资格；目标在 Run 准入时冻结（R7）。'
            required: [id, cron, message]

    AgentContentUpdate:
      oneOf:
        - type: object
          required: [content]
          properties:
            content: { type: string, description: 整份替换；必须自带完整 resource_bindings（服务端不补绑） }
        - type: object
          required: [changes]
          properties:
            changes: { $ref: '#/components/schemas/AgentContentChanges' }

    AgentConfigView:
      type: object
      description: 表单视图；与原文共用同一个 content_etag，不引入 config_etag
      properties:
        agent: { type: string }
        agent_uid: { type: string, description: 生命周期状态文件 schema v2 的稳定身份 }
        content_etag: { type: string, description: '与 GET /agents/{name}/content 完全一致；表单与原文保存共用' }
        fields: { type: object, additionalProperties: true, description: '结构化字段值与原文一致；正文只在 content 接口读取' }
        notify_mode: { type: string, enum: [none, all_eligible, allowlist], description: 有效值（显式或兼容推断） }
        notify_mode_source: { type: string, enum: [explicit, legacy_inferred] }
        references:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigReference' }
        binding_complete: { type: boolean, description: '所有引用都恰有一条有效绑定；false 时保存与准入会被拒绝并点名' }

    AgentConfigReference:
      type: object
      properties:
        resource_kind: { type: string, enum: [model_connection, notify_channel] }
        ref_name: { type: string }
        resource_uid: { type: string, description: '绑定声明的 UID；未绑定为空串' }
        resource_name: { type: string, description: '该 UID 的当前名称（同名重建后仍指向旧名 / 旧资源）' }
        binding_status: { type: string, enum: [bound, missing, stale_uid, orphan, duplicate] }
        published: { type: boolean }
        eligible: { type: boolean, description: 'shared 或属于当前 Agent；false 时保存与准入拒绝' }
        deleted: { type: boolean, description: '绑定 UID 已删除（墓碑存在）；不自动改绑同名新资源' }
        credential_state: { type: string, enum: ['', active, revoked, retired] }

    AgentLifecycleView:
      type: object
      properties:
        agent: { type: string }
        agent_uid: { type: string, description: '状态文件 schema v2 的稳定身份；缺失或损坏时为空串' }
        uid_source: { type: string, enum: ['', state_file, archive, legacy_unrecorded], description: '身份来源；空串 = 无有效状态文件' }
        state:
          oneOf:
            - { type: string, enum: [active, disabled, archived] }
            - { type: "null" }
          description: 状态文件缺失或损坏时为 null，配合 valid=false 与 lifecycle_error
        generation: { type: integer }
        updated_at: { oneOf: [{ type: string, format: date-time }, { const: "" }], description: "状态文件缺失或损坏（valid=false）时为空串；否则为 RFC3339 date-time" }
        operation_id: { type: string, description: 最近一次生命周期变更操作；状态文件缺失或损坏时为空串 }
        valid: { type: boolean, description: 状态文件是否存在且校验和正确 }
        lifecycle_error: { type: string, description: 状态文件缺失或损坏时的点名原因 }

    AgentReadiness:
      type: object
      required: [agent, ready, pending, notices]
      properties:
        agent: { type: string }
        ready: { type: boolean, description: '等价于 `pending` 为空；`notices` 不影响该值' }
        pending:
          type: array
          description: 阻断项：非空即不可启用
          items: { $ref: '#/components/schemas/AgentReadinessItem' }
        notices:
          type: array
          description: 提示项：只点名，不阻止启用
          items: { $ref: '#/components/schemas/AgentReadinessItem' }

    AgentReadinessItem:
      type: object
      required: [kind, item, detail, fix]
      properties:
        kind:
          type: string
          enum: [model_connection, credential, resource, notify_channel, budget, concurrency]
          description: '闭集；前三个只出现在 `pending`，后三个只出现在 `notices`'
        item:
          type: string
          description: '机器可认的名字（`model_connection/x` / `mcp_server/x#KEY` / `skill/x` / 配置键）；装载拒因等无名字项为空串'
        detail: { type: string, description: 一句中文原因；不含值、路径与库原文 }
        fix: { type: string, description: '控制台跳转路径（如 `/console/resources/mcp-servers`）；没有对应页面时为空串，不伪造点不通的链接' }

    AgentLifecycleTransition:
      type: object
      required: [expected_state, expected_generation]
      properties:
        expected_state: { type: string, enum: [active, disabled] }
        expected_generation: { type: integer, description: 与状态文件 generation 不一致 → 409 }

    AgentCopyRequest:
      type: object
      required: [new_name]
      properties:
        new_name: { type: string }
        resource_mapping:
          type: array
          description: '源专属资源的显式映射；目标资源必须已存在、对副本有资格，且不得沿用源 UID'
          items:
            type: object
            required: [resource_kind, source_resource_uid, target_resource_uid]
            properties:
              resource_kind: { type: string, enum: [model_connection, notify_channel] }
              source_resource_uid: { type: string }
              target_resource_uid: { type: string }

    AgentRestoreRequest:
      type: object
      properties:
        new_name: { type: string, description: 留空 = 恢复原目录名 }

    AgentArchiveView:
      type: object
      properties:
        archive_id: { type: string }
        agent: { type: string }
        archived_at: { type: string, format: date-time }
        content_hash: { type: string }
        restored_at: { type: string, description: 未恢复为空串 }
        restored_agent_name: { type: string }

    ArchivedAgentView:
      allOf:
        - $ref: '#/components/schemas/AgentArchiveView'

    ModelConnectionView:
      type: object
      properties:
        name: { type: string }
        resource_uid: { type: string, description: 不可变资源身份；同名重建会生成新 UID }
        base_url: { type: string }
        api_key_env: { type: string, description: 'env 模式只回 `${ENV_VAR}` 引用名；managed 模式为空串' }
        default_model: { type: string }
        credential_mode: { type: string, enum: [env, managed] }
        credential_ref: { type: string, description: '只读凭据引用；仅 managed 模式非空' }
        credential_state: { type: string, enum: ['', active, revoked, retired], description: '空串 = env 模式或尚未写入' }
        credential_version: { type: integer, description: '当前活动凭据版本；env 模式为 0' }
        last4: { type: string, description: '托管密钥尾号；长度不足 8 位为空' }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string, description: 'exclusive 时的所有者 Agent 名；shared 为空' }
        revision: { type: integer, description: '行级修订号；资源条件 ETag 的组成之一' }
        published_version_id: { type: integer }
        published_version_no: { type: integer }
        applied_version_id: { type: integer }
        applied_version_no: { type: integer }
        etag: { type: string, description: '资源条件 ETag（定义 + 范围 + 凭据版本 / 状态 + revision）' }
        referenced_by: { type: array, items: { type: string } }
        availability:
          type: string
          enum: [ready, unconfigured, unavailable]
          description: '本地配置就绪（env 变量存在且非空 / managed 凭据身份 active）；**不等于**实测可用——实测结论与时间戳只来自 last_test'
        last_test:
          description: '最后一次模型连接测试的脱敏结果；null = 从未测过（不得用 availability 冒充）'
          oneOf:
            - $ref: '#/components/schemas/ConnectionTestView'
            - type: 'null'

    ModelConnectionUpsert:
      type: object
      required: [name, base_url, default_model]
      properties:
        name: { type: string }
        base_url: { type: string, description: 'http/https；不含 userinfo；改地址必须给新凭据版本' }
        api_key:
          type: string
          description: 'env 模式：精确 `${ENV_VAR}`；managed 模式：write-only 完整新值。省略 = 保留；空串 = 400'
        credential_mode:
          type: string
          enum: [env, managed]
          description: '可选。创建省略只按 env 规则；更新省略保持当前模式；显式切换必须给出目标模式所需值'
        scope:
          type: string
          enum: [shared, exclusive]
          description: '仅创建时可选；缺省 shared；exclusive 必须给 owner_agent。后续切换走 /scope 端点'
        owner_agent: { type: string, description: 'scope=exclusive 时必填，必须是在世 Agent 名' }
        default_model: { type: string }

    ModelConnectionTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer }
        model: { type: string }
        error_code: { type: string }
        error_message: { type: string, description: 脱敏，不含凭证或完整请求 }

    McpServerDetail:
      allOf:
        - $ref: '#/components/schemas/McpServerView'
        - type: object
          properties:
            args: { type: array, items: { type: string } }
            url: { type: string, description: 仅 http 传输；凭证不得出现在 URL }
            env_keys: { type: array, items: { type: string } }

    McpServerUpsert:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: stdio 必填 }
        args:
          type: array
          items: { type: string }
          description: |
            stdio 参数。**新增 / 修改时出现 `${` 一律 400**（点名第几个参数），零写入、零操作行、不发布——
            秘密不进命令行参数，本轮不解析 `args` 占位符。存量条目已含占位符仍可加载，诊断持续报
            `args_placeholders_not_resolved`
        url: { type: string, description: http 必填 }
        env:
          type: object
          additionalProperties: { type: string }
          description: 值只能是整值 `${ENV_VAR}`（不拼接）；明文凭证 → 400；键名即占位符名
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            仅 http。值只能是整值 `${VAR}`（不拼接、不做前缀推导）；头名受 RFC 7230 token 约束，
            `Host` / `Content-Length` / `Transfer-Encoding` 等由客户端接管的头禁止配置；头名
            `Authorization` 装配为 `Authorization: Bearer <value>`，其它头名原样装配；跨主机重定向丢弃
            认证头。只在内存里拼接：不写日志、不进审计 detail、不进模型上下文，不回读
        credentials:
          type: array
          items: { $ref: '#/components/schemas/McpCredentialInput' }
          description: |
            逐占位符显式选择来源（`managed` / `env`），与执行档位无关；只对本次 `env` / `headers` 里出现的
            占位符生效（其余键沿用既有声明）。省略某键的条目 = 沿用既有来源声明；合并后仍有占位符没有来源
            声明 → 400 并点名该键（**不**隐式按 `env` 推断）。`managed` 模式下未取到值（无版本 / 已撤销 /
            解密失败）→ 503，预写后置 failed，文件 / 发布指针 / 版本都不变（fail-closed）

    McpServerTestResult:
      type: object
      required: [tools, operation_id, tested_version_id, stage, failure_class]
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer }
        tools:
          type: array
          items: { type: string }
          description: '`tools/list` 的实名单；失败时可为空数组，但字段必须存在'
        error_code: { type: string }
        error_message: { type: string, description: 脱敏 }
        operation_id: { type: string, description: 对应 `management_operations.operation_id` }
        tested_version_id:
          type: integer
          description: '`0` 表示无法确定（历史 / 旧记录）；正常必须等于 `OperationDetail.requested_version_id`'
        stage: { type: string, enum: [preflight, spawn, initialize, tools_list, complete] }
        failure_class:
          type: string
          enum:
            - ""
            - command_not_found
            - permission_denied
            - policy_denied
            - timeout
            - http_unauthorized
            - http_unreachable
            - handshake_failed
            - tools_list_failed
            - env_missing
            - dependency_unconfirmed
          description: |
            成功为空串。只在 200 响应里出现；503 / 504 不返回本对象，页面改用
            `AdminError.Data.operation_id` 拉 `OperationDetail` 读 `detail.stage` / `detail.failure_class`。
            分类只来自结构化失败，不解析 stderr / 日志。

    McpServerApplyRequest:
      type: object
      properties:
        version_id:
          type: integer
          description: '目标版本；`0` / 省略 = 当前 `published_version_id`（保存即发布，没有草稿分支）'

    McpServerApplyResult:
      type: object
      required: [outcome, operation_id, target_version_id, previous_version_id, drain_timeout_seconds]
      properties:
        outcome:
          type: string
          enum: [applied, superseded, failed]
          description: |
            200 只会是 `applied`；`superseded` / `failed` 以 409 / 500 返回，但同一形状会写进操作行
            `detail`（去掉 `server`），页面按 `operation_id` 查证。审计 detail 的固定字段即本对象去掉
            `server` 后的键集
        applied_version_id: { type: integer, description: 切换后运行生效的版本；`superseded` / `failed` 时保持不变 }
        previous_version_id: { type: integer, description: 切换前的 applied 版本；未曾应用为 0 }
        target_version_id: { type: integer, description: 本次冻结的目标版本（第 1 步读到的值） }
        drain_deadline:
          type: string
          description: '旧连接排空窗口截止时刻（RFC 3339，UTC）；窗口内旧连接继续服务已发出的调用。`superseded` / `failed` 为空串'
        drain_timeout_seconds: { type: integer, description: '排空窗口长度（默认 30）；窗口到点强制关闭旧连接' }
        failure_class:
          type: string
          enum:
            - ""
            - command_not_found
            - permission_denied
            - policy_denied
            - timeout
            - http_unauthorized
            - http_unreachable
            - handshake_failed
            - tools_list_failed
            - env_missing
            - dependency_unconfirmed
            - drain_timeout
          description: |
            `apply_failure_class`：复用测试的 `failure_class` 全部取值并追加 `drain_timeout`。非空只在
            `outcome=failed`，或 `outcome=applied` 但旧连接未在窗口内自然排空（`drain_timeout`）时出现；
            `superseded` 为空串（不是失败，是被更新的写取代）
        superseded_by:
          type: string
          enum: ["", publish, revoke, apply]
          description: 仅 `outcome=superseded` 时非空：本次切换是被哪类并发写取代的
        operation_id: { type: string, description: 对应 `management_operations.operation_id` }
        server: { $ref: '#/components/schemas/McpServerView' }

    SkillFileView:
      type: object
      properties:
        path: { type: string }
        size: { type: integer }
        sha256: { type: string }
        content: { type: string, description: 文本文件全文；二进制导入不进入技能库 }

    SkillDetail:
      allOf:
        - $ref: '#/components/schemas/SkillView'
        - type: object
          properties:
            files:
              type: array
              items: { $ref: '#/components/schemas/SkillFileView' }

    SkillCreate:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    SkillImport:
      type: object
      required: [name, files]
      properties:
        name: { type: string }
        files:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FileDraft' }

    SkillUpdate:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FileDraft' }

    SkillValidateResult:
      type: object
      properties:
        valid: { type: boolean }
        problems: { type: array, items: { type: string } }

    ResourceVersionView:
      type: object
      properties:
        version_id: { type: integer }
        resource_kind: { type: string, enum: [model_connection, mcp_server, skill] }
        resource_id: { type: string }
        resource_uid: { type: string, description: '该版本所属资源身份；同名重建后的新旧版本靠它区分' }
        version_no: { type: integer }
        content_hash: { type: string }
        created_at: { type: string, format: date-time }
        operation_id: { type: string }
        published: { type: boolean }
        applied: { type: boolean }
        reverted_from_version_id:
          oneOf: [{ type: integer }, { type: "null" }]
          description: 非撤回版本为 null

    ResourceVersionDetail:
      allOf:
        - $ref: '#/components/schemas/ResourceVersionView'
        - type: object
          properties:
            definition_yaml: { type: string, description: '脱敏后的定义；env 凭证只能是 `${ENV_VAR}`，managed 凭证只显示 credential_ref' }
            manifest: { type: object, additionalProperties: true }

    PublishRequest:
      type: object
      properties:
        version_id: { type: integer, description: 留空 = 发布当前最新；给旧版本则先创建同内容新版本再发布 }

    ResourcePublishResult:
      type: object
      properties:
        version: { $ref: '#/components/schemas/ResourceVersionView' }
        pending_restart: { type: boolean, description: 仅 MCP 首版可能为 true }

    CredentialRevokeRequest:
      type: object
      required: [resource_uid, confirm]
      properties:
        resource_uid: { type: string, description: 必须等于当前指针 UID；不一致 → 409 RESOURCE_UID_MISMATCH }
        confirm: { type: boolean, enum: [true], description: 必须显式为 true }
        binding_key:
          type: string
          description: |
            `kind=mcp_server` 时**必填**（占位符名，env 键或 header 名；缺失 → 400）；其它 kind 出现 → 400。
            撤销粒度是单个占位符：同一 server 的其它占位符不受影响

    CredentialRevokeResult:
      type: object
      properties:
        resource_uid: { type: string }
        binding_key: { type: string, description: 仅 `kind=mcp_server` 时非空（被撤销的占位符名）；其它 kind 为空串 }
        credential_ref: { type: string }
        credential_state: { type: string, enum: [revoked] }
        revoked_versions: { type: integer }
        revocation_epoch: { type: integer }

    ResourceScopeRequest:
      type: object
      required: [resource_uid, scope]
      properties:
        resource_uid: { type: string }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string, description: 'scope=exclusive 时必填' }

    ResourceScopeResult:
      type: object
      properties:
        resource_uid: { type: string }
        scope: { type: string, enum: [shared, exclusive] }
        owner_agent: { type: string }
        revision: { type: integer }
        etag: { type: string }
        affected_eligible_agents:
          type: array
          items: { type: string }
          description: 'all_eligible 模式下会受影响但不会被自动修改的 Agent 名（影响提示）'

    ResourceReferencesView:
      type: object
      properties:
        kind: { type: string, enum: [model_connection, mcp_server, skill] }
        id: { type: string }
        resource_uid: { type: string }
        published_version_id: { type: integer }
        agents: { type: array, items: { type: string }, description: '定义名引用（解析失败按可能引用处理）' }
        bound_agents:
          type: array
          description: '按 resource_bindings 的 UID 精确引用（含归档 Agent）'
          items:
            type: object
            properties:
              agent: { type: string }
              agent_uid: { type: string }
              archived: { type: boolean }
        active_runs: { type: array, items: { type: string, description: run_id } }

    OperationView:
      type: object
      properties:
        operation_id: { type: string }
        action: { type: string }
        target_kind: { type: string, enum: [agent, schedule, model_connection, mcp_server, skill, notify_channel, network_allowlist, network_denylist, execution_policy, network_exception, system, caller, instance, memory, knowledge_upload, knowledge_document, knowledge_collection] }
        target_id: { type: string }
        actor_subject: { type: string }
        auth_method: { type: string, enum: [bearer, local_trust, cli, migration] }
        source: { type: string, description: 脱敏来源地址 }
        status: { type: string, enum: [pending, success, failed, unknown] }
        result_code: { type: string }
        error_message: { type: string, description: 脱敏 }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, description: 未结束为空串 }

    OperationDetail:
      allOf:
        - $ref: '#/components/schemas/OperationView'
        - type: object
          properties:
            request_hash: { type: string }
            requested_version_id: { type: integer }
            expected_etag: { type: string }
            detail:
              type: object
              additionalProperties: true
              description: |
                脱敏 detail_json。`mcp_server.test` 的固定字段为 `ok` / `latency_ms` / `tools` / `error_code` /
                `error_message` / `stage` / `failure_class`；被测版本以 `requested_version_id` 为准，`detail`
                不重复版本字段。旧记录可能缺 `tools` / `stage` / `failure_class`，页面显示“历史记录字段不全，
                需重新测试”，不得据此推断通过。`mcp_server.apply` 的固定字段为
                `McpServerApplyResult` 去掉 `server` 后的键集（含冻结的 `target_version_id` 与失败分类）；
                `execution_policy.update` 为 `before_profile` / `after_profile` / `before_revision` /
                `after_revision`；`network_allowlist.update` 与 `network_denylist.update` 为
                `before_revision` / `after_revision` / `candidate_sha256`。不得写入 env 值、命令原文、
                URL 凭据、stderr 或凭据末位以外的任何凭据片段。
            recovered_at: { type: string, description: 未恢复为空串 }
            verification: { type: string, enum: [not_required, applied, not_applied, indeterminate] }

    # ==========================================================
    # US-16：知识库
    # ==========================================================
    CollectionSummary:
      type: object
      required: [collection_id, name, project, description, description_revision, declared_agents, created_at, deleted_at]
      properties:
        collection_id: { type: string, description: '`col_` + 26 位 Crockford Base32' }
        name: { type: string, description: 同一 project 内活动集合唯一 }
        project: { type: string, description: 缺省空串（全局） }
        description:
          type: string
          description: 用户维护的集合简介；未编辑时为空串（**不是** null）。写入走 `PUT /admin/knowledge/collections/{id}/description`
        description_revision:
          type: integer
          description: 简介修订号（乐观并发令牌）；未编辑过为 `0`，每次成功写入 +1
        declared_agents:
          type: array
          items: { type: string }
          description: 在 `AGENT.md` 的 `knowledge:` 块声明本集合的 Agent 名（只读投影，用于删除前自查；删除集合**不**因仍被声明而拒绝）
        document_count: { type: integer, description: 未删除文档数 }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, description: 软删时间；未删除为空串 }

    CollectionCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        project: { type: string, default: '' }

    DocumentSummary:
      type: object
      required: [document_id, collection_id, source_path, content_hash, created_at, updated_at]
      properties:
        document_id: { type: string, description: '`doc_` + 26 位 Crockford Base32' }
        collection_id: { type: string }
        source_path: { type: string, description: 工作区允许根内的相对路径 }
        content_hash: { type: string, description: 最新版本原始字节的 sha256（64 位小写十六进制） }
        latest_version_id: { type: string, description: 尚无版本为空串 }
        latest_status: { $ref: '#/components/schemas/DocumentVersionStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, description: 软删时间；未删除为空串 }

    DocumentVersionStatus:
      type: string
      enum: [pending, indexed, active, superseded, retired, failed]
      description: |
        文档版本状态机：`pending → indexed → active → superseded`；删除 / 撤权 → `retired`；
        任一步失败 → `failed`。**只有 `active` 参与检索**；`superseded` / `retired` 仅保留回溯与引用失效判定；
        `failed` 不得被检索看到，重试必须新建版本行。

    DocumentIngestRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 工作区允许根内的相对路径；仅 `.md` / `.txt`；越界或超上限 → 400

    IngestResult:
      type: object
      required: [document_id, version_id, ingest_job_id, status]
      properties:
        document_id: { type: string }
        version_id: { type: string }
        ingest_job_id: { type: string }
        status: { $ref: '#/components/schemas/DocumentVersionStatus' }
        deduplicated:
          type: boolean
          description: 同 collection 已有同 `content_hash` 的 active 版本时为 true（不新建版本）
        chunk_count: { type: integer, description: 无版本时为 0 }
        generation: { type: integer, description: 写入的索引代际；未写向量为 0 }
        error_kind:
          type: string
          description: |
            仅 `failed` 时非空：`path_rejected` / `decode_failed` / `parser_failed` / `chunker_failed` /
            `embed_failed` / `verify_failed`。文案由 UI 映射。

    DocumentVersionSummary:
      type: object
      required: [version_id, document_id, revision, content_hash, status, created_at]
      properties:
        version_id: { type: string }
        document_id: { type: string }
        revision:
          type: integer
          description: |
            同一文档内的版本序号，从 1 起单调递增；**不是**全局序号，也不做跨文档比较。
            重建产生新版本行时取「当前最大 revision + 1」，因此失败重试后的序号可能跳号。
            Per-document version ordinal, monotonic within one document only.
        content_hash: { type: string }
        status: { $ref: '#/components/schemas/DocumentVersionStatus' }
        parser_version: { type: string }
        chunker_version: { type: string }
        generation: { type: integer }
        error_kind: { type: string, description: 仅 `failed` 时非空 }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, description: 未激活为空串 }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, description: 非空；空串 → 400 }
        collections:
          type: array
          items: { type: string }
          description: 显式集合范围；缺省按 Agent 声明（未给 agent 且未给 collections → 400，不做全库检索）
        agent:
          type: string
          description: 按该 Agent 的 `AGENT.md` 集合声明解析可见范围
        top_k: { type: integer, minimum: 1, maximum: 50, default: 10 }
        budget_tokens: { type: integer, minimum: 1, description: 结果切片的 Token 预算上限 }

    SearchHit:
      type: object
      required: [chunk_id, document_id, version_id, collection_id, rank, score, snippet]
      properties:
        chunk_id: { type: string }
        document_id: { type: string }
        version_id: { type: string }
        collection_id: { type: string }
        source_path: { type: string }
        heading_path: { type: string }
        rank: { type: integer, description: 融合后的名次，从 1 起 }
        score: { type: number, description: 融合分数；不同路径的异质分数不直接相加 }
        snippet: { type: string, description: 片段；**不是**引用依据，引用须走 `POST /sources/view` }
      description: |
        **刻意不含 `content_hash`**：检索命中没有内容哈希，因此在签名层面就不可能充当引用依据
        （`ResolveCitations` 只接受精确读取的结果）。片段**不得**写进历史 / 知识摘要当作原文。

    SearchResult:
      type: object
      required: [hits, denied_count, strategy]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        denied_count:
          type: integer
          description: 因 ACL / 删除 / 项目不匹配被剔除的候选数——**只给计数**，不含标题、ID 或片段
        strategy:
          type: string
          enum: [keyword, vector, hybrid, hybrid_rerank]
        degraded_reason:
          type: string
          description: |
            非空表示单路降级：`vector_unavailable` / `keyword_unavailable` / `rerank_timeout`。
            **不得**静默降级——降级必须让调用方看见。
        generation: { type: integer, description: 本次查询使用的索引代际 }

    EvidenceRef:
      type: object
      required: [id, version_id]
      properties:
        id: { type: string, description: 文档 / 资料 ID；空值非法 }
        version_id: { type: string, description: 版本 ID；空值非法 }
        content_hash: { type: string, description: 该版本原始内容的 sha256；用于"可定位"判定 }
      description: |
        **不含正文**。资料引用就是本类型（`knowledge.EvidenceRef` 是 `core.EvidenceRef` 的类型别名）。
        版本 ID 是引用的一部分：**不得**用新原文冒充旧引用。

    EvidenceRange:
      type: object
      properties:
        start: { type: integer, minimum: 0, description: 字符偏移（含） }
        end: { type: integer, minimum: 0, description: 字符偏移（不含） }
      description: 范围必须落在该版本原文范围内；越界 → 400（不静默截断到边界）。

    SourceViewRequest:
      type: object
      required: [ref]
      properties:
        ref: { $ref: '#/components/schemas/EvidenceRef' }
        range: { $ref: '#/components/schemas/EvidenceRange' }
        budget_tokens: { type: integer, minimum: 1, description: 单次返回的 Token 上限 }
        cursor: { type: string, description: 上一页返回的 `next_cursor` }
        include_facts: { type: boolean, default: false }
        include_summary: { type: boolean, default: false }
      description: |
        **不放 Principal**：身份只从请求上下文取，不藏在请求体里（零值 Principal 直接 401，不读任何正文）。

    ValidityView:
      type: object
      required: [valid, reason]
      properties:
        valid: { type: boolean }
        reason:
          type: string
          enum: ["", revoked, deleted, version_changed, not_found]
          description: "`valid=true` 时为空串；四个取值与 `compaction.Validity` 同源"
      description: 按**当前** ACL / 删除 / 版本重查的结论；两个调用方读同一 `ref` 可以有不同结果。

    SourceFact:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string, description: 已脱敏的结构化事实；不得含凭证或完整 URL }

    SourceSummary:
      type: object
      properties:
        document_title: { type: string }
        heading_path: { type: string }
        section_summary: { type: string, description: 来源 / 章节摘要；**不含**任务进度 }
      description: 摘要只描述来源本身；把任务进度混进来会让调用方误以为摘要是任务状态。

    SourceViewResult:
      type: object
      required: [ref, validity, text, truncated]
      properties:
        ref: { $ref: '#/components/schemas/EvidenceRef' }
        validity: { $ref: '#/components/schemas/ValidityView' }
        version_id: { type: string, description: 实际读取的版本（可能因 `version_changed` 而不同于请求） }
        content_hash: { type: string, description: 实际读取内容的 sha256；`validity.valid=false` 时为空串 }
        text: { type: string, description: "`validity.valid=false` 时为空串" }
        range: { $ref: '#/components/schemas/EvidenceRange' }
        truncated: { type: boolean, description: 截断必须显式标注，不得让调用方以为是全文 }
        next_cursor: { type: string, description: 无下一页为空串 }
        conversion: { type: string, description: 转换策略标识（如按段落 / 按字符窗口） }
        parent_refs:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRef' }
          description: 父引用（章节 → 全文等）；空数组表示顶层
        facts:
          type: array
          items: { $ref: '#/components/schemas/SourceFact' }
          description: 仅在 `include_facts=true` 时返回
        summary: { $ref: '#/components/schemas/SourceSummary' }

    # ==========================================================
    # US-16：历史回查
    # ==========================================================
    HistoryHit:
      type: object
      required: [message_id, session_id, run_id, role, snippet, created_at]
      properties:
        message_id: { type: string }
        session_id: { type: string }
        run_id: { type: string }
        role: { type: string, enum: [user, assistant, tool, system] }
        snippet: { type: string, description: 命中片段；**不是**引用依据 }
        score: { type: number }
        created_at: { type: string, format: date-time }
      description: 命中只回指针与片段；点开必须走精确读取（`GET /sessions/{session_id}/messages/{message_id}`）。

    HistorySearchResult:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/HistoryHit' }
        truncated:
          type: boolean
          default: false
          description: |
            命中数超过本页上限（`limit`，缺省 50、上限 200）时为 true——本页**不是**全部。
            契约**没有**游标参数：收窄条件（`from` / `to` / `session_id` / `agent`）或提高 `limit` 重新检索，
            同一查询重复调用返回同一批结果。
            超预算**不得**静默截断（§2.10.4 / 设计 §4 `TestHistory_SearchBudgetTruncationMarked`）。
            可选字段（默认 false），旧响应不带该字段时按"未截断"解释。

    MessageEvidenceRefView:
      type: object
      required: [ref, validity]
      properties:
        ref: { $ref: '#/components/schemas/EvidenceRef' }
        validity: { $ref: '#/components/schemas/ValidityView' }

    MessageDetail:
      type: object
      required: [message_id, session_id, run_id, seq, role, content, created_at, truncated]
      properties:
        message_id: { type: string }
        session_id: { type: string }
        run_id: { type: string }
        seq: { type: integer }
        role: { type: string, enum: [user, assistant, tool, system] }
        content: { type: string, description: 原文；工具结果可能已按上限截断 }
        truncated: { type: boolean, description: 原文被截断时为 true（重查保留策略后判定） }
        tool_call_id: { type: string }
        created_at: { type: string, format: date-time }
        evidence_refs:
          type: array
          items: { $ref: '#/components/schemas/MessageEvidenceRefView' }
          description: 该消息携带的来源引用，逐个按**当前** ACL / 删除 / 版本标注；不反推、不改写已发送消息
      description: |
        历史消息是 Run 的记录，**不因资料撤权而删除**；撤权只让对应 `evidence_refs` 标为失效。
        无状态 Run 的临时标识 `msg/<run_id>/<pos>` 在 `messages` 表无对应行 → 404。

    # ==========================================================
    # US-16：调用方与配额
    # ==========================================================
    CallerSummary:
      type: object
      required: [caller_id, kind, name, status, created_at]
      properties:
        caller_id: { type: string, description: '`cal_` + 26 位 Crockford Base32；内置为 `local-admin`' }
        kind: { type: string, enum: [builtin, external] }
        name: { type: string }
        project: { type: string }
        status: { type: string, enum: [active, disabled], description: disabled 后该调用方全部 Key 认证失败 }
        created_at: { type: string, format: date-time }
        key_count: { type: integer, description: 未吊销 Key 数 }

    CallerCreateRequest:
      type: object
      required: [name]
      properties:
        caller_id: { type: string, description: 缺省由服务端生成；显式给出时不得与既有冲突 }
        name: { type: string }
        project: { type: string, default: '' }
        limits: { $ref: '#/components/schemas/CallerLimitView' }

    CallerLimitView:
      type: object
      properties:
        qps: { type: number, description: '入口 QPS 覆盖（numeric(10,3)，可小数）：按 Run / Ingest / Read 三类入口分别生效，生效值取 min(类别预算, 本值)；0 = 该列不覆盖（沿用类别预算），不是「不限流」' }
        burst: { type: integer, description: '入口突发额度覆盖：生效值取 min(类别预算, 本值)；0 = 该列不覆盖（沿用类别预算）。qps 与 burst 两列独立判断，覆盖只收紧不放宽' }
        max_concurrent: { type: integer, description: 并发 Run 名额 }
        tasks_per_period: { type: integer }
        tokens_per_period: { type: integer }
        ingest_bytes_per_period: { type: integer }
        period: { type: string, enum: [day, month] }
        timezone: { type: string, default: UTC, description: 周期按该时区本地 00:00 起算 }
      description: 缺配置即拒绝启动或拒绝签发，**不得**在代码里写默认数字冒充已配置。

    CallerKeyIssueRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CallerScope' }
          description: 空数组、未知 scope、管理面 scope → 400 `INVALID_SCOPE`，且不留 pending 操作
        expires_at: { type: string, format: date-time, description: 缺省不过期 }

    CallerScope:
      type: string
      description: |
        scope 字面量（固定枚举，运行期校验）：

        - `sessions:read`——读自己的会话历史；跨调用方一律 404
        - `sessions:write`——建会话、发消息 / 发起 Run、取消自己的 Run
        - `flows:read`——读取公共流程元数据及自己的任务；正文仍核对当前来源权限
        - `flows:write`——接受和控制自己的持久任务；不授予额外 Agent/工具/来源权限
        - `knowledge:read`——检索、来源视图、文档 / 版本列表（仍受集合 ACL 二次过滤）
        - `knowledge:write`——建集合 / 文档、删除、重建索引（仍受集合 ACL 与审计约束）
        - `agents:invoke:<name>`——调用指定 Agent；无匹配 scope → 403；`agents:invoke:*` **只允许** admin 发放
        - `diagnostics:read` / `callers:admin`——**仅**随 admin token 的内置 `local-admin` 生效，
          **不得**出现在 `caller_keys`（签发时 400 `INVALID_SCOPE`）
      pattern: '^(sessions:(read|write)|knowledge:(read|write)|agents:invoke:(\*|[A-Za-z0-9._-]+)|diagnostics:read|callers:admin)$'

    CallerKeySummary:
      type: object
      required: [key_id, caller_id, key_prefix, scopes, status, created_at]
      properties:
        key_id: { type: string, description: '`key_` + 26 位 Crockford Base32' }
        caller_id: { type: string }
        key_prefix: { type: string, description: 明文非敏感前缀，仅用于人工识别；**不是**凭据 }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/CallerScope' }
        status: { type: string, enum: [active, revoked, expired] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, description: 不过期为空串 }
        revoked_at: { type: string, description: 未吊销为空串 }

    IssuedKey:
      allOf:
        - $ref: '#/components/schemas/CallerKeySummary'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                **一次性明文**，只在签发 / 轮换响应出现这一次；服务端只存 `key_hash`。
                客户端丢失只能吊销重发。**不得**回显到日志、审计、诊断或导出。
          description: 本响应之外任何地方出现 `key` 字段都视为契约违规。

    UsageLine:
      type: object
      required: [kind, used, reserved, overage]
      properties:
        kind: { type: string, enum: [run, chat, compaction, ingest, rerank, embedding_tokens, ingest_bytes] }
        used: { type: integer }
        reserved: { type: integer, description: '`pending` 预留继续占额度；**不**按零计量' }
        overage: { type: integer, description: 已发生且不可回滚的超限；> 0 时新预留一律 429 }

    CallerUsageView:
      type: object
      required: [caller_id, period_start, period_end, timezone, limits, usage]
      properties:
        caller_id: { type: string }
        period_start: { type: string, format: date-time, description: 该周期起点（按 timezone 本地 00:00） }
        period_end: { type: string, format: date-time }
        timezone: { type: string }
        limits: { $ref: '#/components/schemas/CallerLimitView' }
        usage:
          type: array
          items: { $ref: '#/components/schemas/UsageLine' }
        pending_reservations:
          type: integer
          description: 结局未知、必须由管理员 `reconcile` 的预留数（**不**自动释放）

    ReservationView:
      type: object
      required: [reservation_id, caller_id, class, period_start, amount, status]
      properties:
        reservation_id: { type: string }
        caller_id: { type: string }
        idempotency_key: { type: string }
        class: { type: string, enum: [run, chat, compaction, ingest, rerank] }
        run_id: { type: string }
        ingest_job_id: { type: string }
        period_start: { type: string, format: date-time }
        amount: { type: integer, description: 预留量 }
        actual: { type: integer, description: 实际用量；`committed` 前为空 }
        status: { type: string, enum: [pending, committed, released, reconciled] }
        reason: { type: string, description: 释放 / 核对理由 }
        created_at: { type: string, format: date-time }
      description: |
        跨周期：`period_start` 是**创建时**的周期，`commit` / `release` / `reconcile` 总是更新该周期的行，
        **不**按当前时间重算周期。状态只允许 `pending → committed / released / reconciled`。

    ReservationReconcileRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome: { type: string, enum: [committed, released] }
        actual:
          type: integer
          minimum: 0
          description: '`outcome=committed` 时必填；大于 `amount` 时记 `overage`，不截断、不回滚调用'
        reason: { type: string, description: 必填；写入管理审计，不得含凭据 }

    ClearOverageRequest:
      type: object
      required: [reason]
      properties:
        period_start: { type: string, format: date-time, description: 缺省为当前周期起点 }
        reason: { type: string, description: 必填；写入管理审计，不得含凭据 }

    # ==========================================================
    # US-16：诊断
    # ==========================================================
    DiagnosticKind:
      type: string
      enum:
        - ingest_stage
        - index_switch
        - retrieval
        - assembly
        - embedding
        - llm_call
        - tool_call
        - permission_decision
        - quota_decision
        - migration

    DiagnosticReasonCode:
      type: string
      enum:
        - vector_unavailable
        - keyword_unavailable
        - rerank_timeout
        - permission_denied
        - budget_trimmed
        - history_trimmed
        - no_answer
        - citation_unresolved
        - chunker_failed
        - embed_failed
        - index_failed
        - quota_exhausted
        - rate_limited
        - key_revoked
        - migration_verify_failed
        - llm_call_failed
        - concurrency_limited
        - chunk_invalidated
      description: 稳定枚举；面向人的文案由 UI 映射，**不得**把自由文本写进 `reason_code`。

    DiagnosticEventView:
      type: object
      required: [event_id, schema_version, kind, occurred_at, seq, correlation]
      properties:
        event_id: { type: string, description: '`ev_` + 26 位 Crockford Base32（ULID 形态，含 48 位毫秒时间前缀，大写载荷）；全局唯一' }
        schema_version: { type: integer, description: v0 固定 0；演进只增字段 }
        kind: { $ref: '#/components/schemas/DiagnosticKind' }
        occurred_at: { type: string, format: date-time, description: 'RFC3339 UTC，毫秒精度；内部存储为 int64 Unix 毫秒（线格式仍是字符串，避免精度丢失）' }
        correlation:
          type: object
          required: [request_id, run_id, task_id, operation_id, ingest_job_id]
          properties:
            request_id: { type: string }
            run_id: { type: string }
            task_id: { type: string, description: 只是调度限定符，**不得单独**作为主锚点 }
            operation_id: { type: string }
            ingest_job_id: { type: string }
          description: 主锚点至少一个（`request_id` / `run_id` / `operation_id` / `ingest_job_id`）
        actor: { type: string, enum: ["", caller, scheduler, recovery, admin-cli] }
        step_id: { type: string }
        attempt_id: { type: string, description: 重试尝试标识；**不**使用全局序号 }
        parent_step_id: { type: string }
        seq: { type: integer, description: 同 correlation 内本地自增，**仅局部有序** }
        reason_code: { $ref: '#/components/schemas/DiagnosticReasonCode' }
        decision: { type: string, description: '`allow` / `deny` / `trim` / `degrade` 等' }
        attrs:
          type: object
          additionalProperties: true
          description: |
            按 `kind` 的白名单键。**不得**含正文、凭证、完整 URL（`url` 只存 `scheme://host`）。
            归属与授权来源用 `owner_caller_id` / `authorizing_kind` / `actor`；**不得**在这里冒充管理员。
        audit_ref:
          type: object
          properties:
            table: { type: string, enum: [llm_calls, tool_invocations, embedding_calls] }
            id: { type: string }
          description: 只引用审计行，**不替代**审计

    DiagnosticsResult:
      type: object
      required: [events, missing]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/DiagnosticEventView' }
        missing:
          type: boolean
          description: |
            **全量采样**（`SampleRate = 1`）下结果为空时为 true——显式表达"证据缺口"，
            **不得**用空集冒充"一切正常"。采样率 < 1 时无法区分"本来没有"与"被采样丢光"，
            此时 `missing=false`、改用 `sampled_out=true`（二者互斥；有记录时都为 false）。
        sampled_out: { type: boolean, description: '结果为空且采样率 < 1 时为 true——此时无法区分"本来没有"与"被采样丢光"；全量采样下的空结果用 `missing` 表达缺口（二者互斥）' }
        retention_days: { type: integer, description: 本实例的诊断保留期（配置值，不是承诺） }

    # ==========================================================
    # US-16：会话压缩只读视图
    # ==========================================================
    CompactionSummaryView:
      type: object
      required: [compaction_id, summary, truncated]
      properties:
        compaction_id: { type: string }
        summary: { type: string, description: 摘要正文；**派生视图**，不得当消息原文或引用依据 }
        truncated: { type: boolean }

    CompactionView:
      type: object
      required: [compaction_id, chain_epoch, covered_from_message_id, cut_message_id, first_kept_message_id, status, created_at]
      properties:
        compaction_id: { type: string }
        scope_session_id: { type: string }
        scope_run_id: { type: string }
        chain_epoch: { type: integer, minimum: 1, description: 链代次；重建新根 = 当前最大 + 1 }
        parent_compaction_id: { type: string, description: 根条目为空串 }
        trigger_run_id: { type: string }
        attempt_id: { type: string }
        covered_from_message_id: { type: string }
        cut_message_id: { type: string }
        first_kept_message_id: { type: string }
        strategy_version: { type: string }
        prompt_version: { type: string }
        model: { type: string }
        tokens_before: { type: integer }
        tokens_after: { type: integer }
        status: { type: string, enum: [committed, failed, stale] }
        reason_code: { type: string, description: 失败 / 失效原因（`compaction_timeout` 等） }
        source_refs:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRef' }
          description: |
            **审计集**：生成时涉及的**全部**引用（含此后失效、含被剔除的）。
            只证明"这条摘要曾涉及什么"，**不**参与注入判定。
        included_refs:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRef' }
          description: |
            **当前依赖集**：正文里真正含其原文的来源。注入资格只看它 + 链资格。
            失效校验用这个集合，**不得**用审计集冒充。
        created_at: { type: string, format: date-time }
        stale_at: { type: string, description: 未失效为空串 }
        summary_view: { $ref: '#/components/schemas/CompactionSummaryView' }
      description: |
        只读派生视图。**不提供**手动触发；压缩失败显示降级原因。
        `source_refs` 与 `included_refs` 两个集合**不得**合并展示成一个布尔。
