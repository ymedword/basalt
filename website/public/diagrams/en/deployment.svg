<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1180" viewBox="0 0 1320 1180" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="deployment" data-source-commit="2bfcede9db06baf7cec27f1adb825a8e1ffb3969" data-working-tree-feature="US25C">
<title id="diagram-title">Basalt Compose multi-Worker deployment</title>
<desc id="diagram-desc">Current supported deployment topology for the first release: Compose multi-Worker. Host A runs the serve control plane with the HTTP API and embedded console, PostgreSQL on a private address, the workspace volume and the exported master key. Host B runs a gateway Worker with no HTTP listener and no admin token; it connects directly to host A PostgreSQL, uses copies of the DSN and master key, and never generates a new database password or its own master key. Every Worker installs the same content-addressed asset bundles and never publishes assets; each claimed execution is pinned to one bundle. The single-instance Compose file stays the default. Kubernetes, database high availability and cross-node workspace or business-state sharing remain outside this version. Remote management requires deployment-managed TLS or a trusted channel; serve has no built-in TLS. Base commit 2bfcede9db06baf7cec27f1adb825a8e1ffb3969.</desc>
