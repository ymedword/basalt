<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1120" viewBox="0 0 1320 1120" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="deployment" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="diagram-title">Self-hosted, on a single node.</title>
<desc id="diagram-desc">Current supported product topology: a single self-hosted Go binary with the embedded management console, basalt.yaml and the .basalt workspace containing SQLite, Agent definitions, skills and memory. The console listens on loopback by default. CLI commands and serve share one workspace instance lock and must not write concurrently. Remote management requires deployment-managed TLS/reverse proxy or a trusted encrypted channel; TLS is not built into serve. Model and external tool endpoints remain external configured services. Managed-credential master keys live outside the workspace and require separate backup. No container or multi-worker topology is claimed.</desc>
