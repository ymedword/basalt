<text x="36" y="918" font-size="20" fill="#151e2b" font-weight="600">First-release profile · Compose multi-Worker</text>
<text x="36" y="950" font-size="15" fill="#151e2b">Single-instance Compose stays the default; the multi-Worker file adds a control plane and one or more gateways.</text>
<text x="36" y="978" font-size="15" fill="#151e2b">Workers install the same content-addressed bundles, never publish assets, and pin each claimed execution to one bundle.</text>
<text x="36" y="1006" font-size="15" fill="#151e2b">Kubernetes, database HA and cross-node workspace or business-state sharing remain outside this version.</text>
<text x="40" y="1070" font-size="15" fill="#59687a">Remote management needs deployment-managed TLS or a trusted channel; serve has no built-in TLS.</text>
<text x="40" y="1096" font-size="15" fill="#59687a">Upgrade: stop all old processes; back up the database, every workspace, the keys and the images.</text>
