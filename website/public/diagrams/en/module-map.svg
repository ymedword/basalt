<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="module-map" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="diagram-title">Small packages, explicit responsibilities.</title>
<desc id="diagram-desc">cmd/basalt starts internal/app, the composition root. CLI and HTTP entry adapters submit work to core AgentService and ReActLoop through injected ports. core owns Provider/Tool/Session contracts, admission, execution budgets and orchestration. Concrete provider, tool, memory, workspace and storage packages implement the consumer ports. The cron adapter provides scheduler mechanics. This responsibility map is distinct from the actual Go package import graph.</desc>
