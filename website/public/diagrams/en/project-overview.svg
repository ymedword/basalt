<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1690" role="img" aria-labelledby="overview-title overview-desc" data-diagram-id="project-overview" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="overview-title">Basalt project architecture</title><desc id="overview-desc">Basalt project overview of the current single-node implementation: entry points and triggers, independently defined Agent scopes, management and admission, shared PromptBuilder/ReActLoop/ToolExecutor, Provider/Memory/tool/notification capabilities, embedded SQLite and workspace files. External users, model APIs, local processes, MCP/HTTP systems and notification destinations are outside the Go runtime boundary. Lifecycle and resource scope checks, published Run snapshots, execution budgets, cancellation, fail-closed two-phase audit, instance locking and non-replay recovery cut across the layers. Logical scopes are not container isolation; CLI and serve writers share an exclusive workspace lock. External model and tool requests follow configured data boundaries. This is a logical project map, not a claimed dynamic workflow or future distributed architecture.</desc>
<metadata>{&quot;evidence&quot;:[&quot;internal/app/wire.go&quot;,&quot;internal/app/web.go&quot;,&quot;internal/core/service.go&quot;,&quot;internal/core/prompt.go&quot;,&quot;internal/core/resources.go&quot;,&quot;internal/tool/policy.go&quot;,&quot;internal/storage/migrations&quot;]}</metadata>
