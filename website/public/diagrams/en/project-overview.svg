<text x="350" y="559" font-size="18" fill="#59687a">Each Agent has its own declaration and scoped business state.</text>
<text x="350" y="606" font-size="18" fill="#59687a">Application services · lifecycle / resources / task scheduling</text>
<text x="350" y="1426" font-size="18" fill="#59687a">Admin token · scoped bindings · execution budgets / cancellation</text>
<text x="350" y="1453" font-size="18" fill="#59687a">Two-phase call audit · instance lock · recovery without replay</text>
<text x="40" y="1530" font-size="18" fill="#2447df">SOLID: in-process dependency     DASHED: configured boundary crossing</text>
<text x="40" y="1560" font-size="18" fill="#2447df">Logical layers, not an execution sequence. CLI and serve share an exclusive workspace lock.</text>
<text x="40" y="1600" font-size="18" fill="#59687a">Agent scopes are logical. Collaboration, multi-node execution and container isolation are outside this view.</text>
<text x="40" y="1629" font-size="18" fill="#59687a">Models and MCP may process data outside the host. Local tool policies do not contain an external MCP server.</text>
<text x="40" y="1665" font-size="15" fill="#59687a">Current implementation · source eb97cd539e51</text>
</g></svg>
