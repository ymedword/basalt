<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1690" viewBox="0 0 1380 1690" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="execution-flow" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="diagram-title">One Run, with evidence at every boundary.</title>
<desc id="diagram-desc">Current execution flow: request admission, lifecycle and resource eligibility, frozen Run resources and budgets, PromptBuilder, fail-closed pending model audit, Provider protocol call, model audit success/failed, persisted assistant message, tool ownership/input checks, pending tool audit, policy-controlled execution, tool audit success/failed and appended result. Failure, denial, cancel and recovery branches are explicit. Run terminal outcomes are completed, limit_reached, cancelled and failed. limit_reached preserves partial results and is not an error. Tool denial/failure is model feedback and does not automatically fail the Run. Cancellation is checked before budgets. Startup recovery holds the instance lock: pending call audits become unknown; unfinished Runs become failed; partial tool groups are repaired, never replayed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244bd8"/></marker></defs>
<rect width="1380" height="1690" fill="#f7f4eb"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#202b30">
<text x="40" y="38" font-size="14" letter-spacing="2" fill="#244bd8">BASALT / EXECUTION FLOW</text>
<text x="40" y="85" font-size="32" font-weight="600">One Run, with evidence at every boundary.</text>
<text x="40" y="115" font-size="17" fill="#5d6a70">Run outcomes and model / tool audit outcomes are separate state machines</text>
