<text x="65" y="163" font-size="13" letter-spacing="1" fill="#244bd8" stroke="#f7f4eb" stroke-width="5" paint-order="stroke">RUNTIME AND MESSAGE PATH</text>
<text x="800" y="163" font-size="13" letter-spacing="1" fill="#244bd8" stroke="#f7f4eb" stroke-width="5" paint-order="stroke">AUDIT AND EXCEPTION PATHS</text>
<g data-node-id="request"><rect x="80" y="190" width="620" height="70" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="218" font-size="20" font-weight="600">Agent request</text>
<text x="98" y="243" font-size="16" fill="#5d6a70">CLI / HTTP / scheduler → AgentService</text>
</g>
<g data-node-id="admission"><rect x="80" y="305" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="333" font-size="20" font-weight="600">Admission and Run snapshot</text>
<text x="98" y="358" font-size="16" fill="#5d6a70">Lifecycle active, eligibility, concurrency and budgets</text>
<text x="98" y="381" font-size="16" fill="#5d6a70">Freeze published resources for this Run</text>
</g>
<g data-node-id="rejected"><rect x="815" y="305" width="485" height="96" rx="7" fill="#f0eee7" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="333" font-size="20" font-weight="600">Request denied</text>
<text x="833" y="358" font-size="16" fill="#5d6a70">No model or tool call is issued</text>
<text x="833" y="381" font-size="16" fill="#5d6a70">A rejected request is not a Run terminal state</text>
</g>
<g data-node-id="prompt"><rect x="80" y="450" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="478" font-size="20" font-weight="600">PromptBuilder</text>
<text x="98" y="503" font-size="16" fill="#5d6a70">Build context; retain constraints; trim complete groups</text>
</g>
<g data-node-id="model-pending"><rect x="815" y="450" width="485" height="78" rx="7" fill="#e9edf9" stroke="#244bd8" stroke-width="1.2"/>
<text x="833" y="478" font-size="20" font-weight="600">llm_calls → pending</text>
<text x="833" y="503" font-size="16" fill="#5d6a70">Pre-write first; failure prevents the request</text>
</g>
<g data-node-id="provider"><rect x="80" y="585" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="613" font-size="20" font-weight="600">Provider protocol call</text>
<text x="98" y="638" font-size="16" fill="#5d6a70">Lookup the frozen explicit Provider mapping</text>
</g>
<g data-node-id="model-terminal"><rect x="815" y="585" width="485" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="613" font-size="20" font-weight="600">llm_calls → success / failed</text>
<text x="833" y="638" font-size="16" fill="#5d6a70">Update the same audit row after the call</text>
</g>
<g data-node-id="assistant"><rect x="80" y="720" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="748" font-size="20" font-weight="600">Persist assistant message</text>
<text x="98" y="773" font-size="16" fill="#5d6a70">Persist tool_calls before any tool executes</text>
</g>
<g data-node-id="fatal"><rect x="815" y="720" width="485" height="78" rx="7" fill="#f0eee7" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="748" font-size="20" font-weight="600">Fatal failure → Run failed</text>
<text x="833" y="773" font-size="16" fill="#5d6a70">Model / context / message persistence failure</text>
</g>
<g data-node-id="tool-check"><rect x="80" y="855" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="883" font-size="20" font-weight="600">Tool resolution and input checks</text>
<text x="98" y="908" font-size="16" fill="#5d6a70">Registry, Agent tool set and argument validation</text>
</g>
<g data-node-id="tool-pending"><rect x="815" y="855" width="485" height="78" rx="7" fill="#e9edf9" stroke="#244bd8" stroke-width="1.2"/>
<text x="833" y="883" font-size="20" font-weight="600">tool_invocations → pending</text>
<text x="833" y="908" font-size="16" fill="#5d6a70">Pre-write before Tool.Execute; fail closed</text>
</g>
<g data-node-id="execute"><rect x="80" y="990" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="1018" font-size="20" font-weight="600">Tool.Execute</text>
<text x="98" y="1043" font-size="16" fill="#5d6a70">Policy.Check → controlled action / CommandRunner</text>
<text x="98" y="1066" font-size="16" fill="#5d6a70">Tool timeout and bounded output</text>
</g>
<g data-node-id="tool-terminal"><rect x="815" y="990" width="485" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="1018" font-size="20" font-weight="600">tool_invocations → success / failed</text>
<text x="833" y="1043" font-size="16" fill="#5d6a70">A policy denial is failed / sandbox_denied</text>
<text x="833" y="1066" font-size="16" fill="#5d6a70">Failure is feedback; the Run may continue</text>
</g>
<g data-node-id="result"><rect x="80" y="1140" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="1168" font-size="20" font-weight="600">Append tool result; check cancel and budgets</text>
<text x="98" y="1193" font-size="16" fill="#5d6a70">Next round rebuilds the prompt</text>
<text x="98" y="1216" font-size="16" fill="#5d6a70">Only ReActLoop appends assistant / tool messages</text>
</g>
<g data-node-id="recovery"><rect x="815" y="1140" width="485" height="128" rx="7" fill="#f0eee7" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="1168" font-size="20" font-weight="600">Crash recovery · instance lock required</text>
<text x="833" y="1193" font-size="16" fill="#5d6a70">pending audit → unknown; running Run → failed</text>
<text x="833" y="1216" font-size="16" fill="#5d6a70">Repair partial tool groups; no automatic replay</text>
<text x="833" y="1239" font-size="16" fill="#5d6a70">Management-operation recovery uses its own proof</text>
</g>
<g data-node-id="budget"><rect x="80" y="1290" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="1318" font-size="20" font-weight="600">Budget stop / cancellation</text>
<text x="98" y="1343" font-size="16" fill="#5d6a70">Iterations or tool-call cap → limit_reached (partial)</text>
<text x="98" y="1366" font-size="16" fill="#5d6a70">Cancellation / Run deadline → cancelled</text>
</g>
<g data-node-id="outcome"><rect x="80" y="1510" width="1220" height="102" rx="7" fill="#e9edf9" stroke="#244bd8" stroke-width="1.2"/>
<text x="98" y="1538" font-size="20" font-weight="600">Run terminal outcome</text>
<text x="98" y="1563" font-size="16" fill="#5d6a70">completed  ·  limit_reached (partial, not an error)  ·  cancelled  ·  failed</text>
<text x="98" y="1586" font-size="16" fill="#5d6a70">Persist outcome and release resource references; audit terminal states remain separate</text>
</g>
<text x="40" y="1645" font-size="15" fill="#5d6a70">Budget checks are bounds, not retries. A tool failure is not automatically a failed Run; cancellation has priority.</text>
<text x="40" y="1671" font-size="12" fill="#5d6a70">Source commit: eb97cd539e51 · Current implementation</text>
</g></svg>
