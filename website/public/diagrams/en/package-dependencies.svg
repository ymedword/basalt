<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1450" viewBox="0 0 1320 1450" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="package-dependencies" data-source-commit="2bfcede9db06baf7cec27f1adb825a8e1ffb3969">
<title id="diagram-title">Imports point toward the core.</title>
<desc id="diagram-desc">Actual local Go import graph (complete production set at this commit): cmd/basalt imports internal/app. app imports adapters/cron, assets, builtin, callers, catalog, cli, compaction, core, dbmigrate, diagnostics, flow, history, historyretention, isolation, knowledge, memory, observability, provider, storage, storage/postgres, tool, web and workspace. cli imports assets, builtin, channel, core and flow. web imports callers, compaction, core, diagnostics, flow, history, knowledge and observability. storage/postgres imports assets, callers, compaction, core, diagnostics, flow, history, historyretention, knowledge, memory and observability. dbmigrate imports builtin, storage/postgres and workspace. observability imports core, diagnostics and historyretention. memory and builtin import core and workspace; workspace imports assets and core; assets imports core. provider, tool, storage, adapters/cron, callers, catalog, compaction, flow, history, knowledge and isolation import core. channel imports no local production package; core imports only standard-library packages. Standard-library, external protocol SDK and test-only edges are omitted. Arrows point from importer to dependency; the dashed group lists the small feature packages app imports directly, so this description is the authoritative edge list. US19: sequential Flow uses the same Run, messages and audit path. Unknown actions block; no parallel or distributed graph.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244bd8"/></marker></defs>
