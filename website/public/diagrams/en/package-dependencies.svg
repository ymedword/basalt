</g><g id="us19-flow" font-family="Arial, Microsoft YaHei, sans-serif"><rect x="18" y="1310" width="1284" height="128" rx="8" fill="#eef1fb" stroke="#244bd8"/><text x="36" y="1340" font-size="21" fill="#202b30">US19 · optional durable sequential Flow</text><text x="36" y="1375" font-size="18" fill="#202b30">Published contract → bounded Worker → original Run / ToolExecutor → verification</text><text x="36" y="1410" font-size="18" fill="#202b30">Self-hosted PostgreSQL holds checkpoints, actions and evidence; unknown side effects are never replayed.</text></g>
