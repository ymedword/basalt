<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="system-architecture" data-source-commit="2bfcede9db06baf7cec27f1adb825a8e1ffb3969" data-working-tree-feature="US25C">
<title id="diagram-title">Basalt system architecture summary</title>
<desc id="diagram-desc">Compact Basalt architecture for the project README. Five logical layers: access (CLI, HTTP API and the embedded console on the control plane); application (Agent definitions and published bundles, the serve control plane and gateway Workers); execution engine (PromptBuilder, ReActLoop and ToolExecutor on every Worker); infrastructure services (model adapters, tools, MCP, skills, memory and notifications); storage (one self-hosted PostgreSQL shared by all nodes, plus per-node workspaces and content-addressed asset bundles). The control plane publishes immutable bundles; Workers install them by hash and never publish. Each claimed execution pins its bundle hash, and admission verifies that exact directory before dispatch. Skills materialize from published versions. Authentication, budgets and persistent audit cross the layers. Cross-node business-state sharing, database HA and Kubernetes remain outside this version; logical Agent scopes are not process isolation. Base commit 2bfcede9db06baf7cec27f1adb825a8e1ffb3969.</desc>
