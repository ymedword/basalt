<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" role="img" aria-labelledby="summary-title summary-desc" data-diagram-id="system-architecture" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77"><title id="summary-title">Basalt system architecture summary</title><desc id="summary-desc">Compact Basalt architecture for the project README. Five conventional logical layers: access (CLI, HTTP API, embedded console); application (independent Agent definitions/state and lifecycle/resource/scheduling services); execution engine (PromptBuilder, ReActLoop, ToolExecutor); infrastructure services (model adapters, tools/MCP/skills, memory and notifications); storage (embedded SQLite and workspace files). Authentication, resource scopes, execution limits and persistent audit are cross-cutting. This shows the current single-node Go implementation; logical Agent scopes are not process or container isolation, and external endpoints remain configured services. Detailed execution and deployment views are documented separately.</desc><rect width="1360" height="640" fill="#faf8f1"/><g font-family="sans-serif">
