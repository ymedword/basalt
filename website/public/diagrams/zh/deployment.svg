<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1180" viewBox="0 0 1320 1180" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="deployment" data-source-commit="2bfcede9db06baf7cec27f1adb825a8e1ffb3969" data-working-tree-feature="US25C">
<title id="diagram-title">Basalt Compose 多 Worker 部署</title>
<desc id="diagram-desc">首发支持的部署拓扑：Compose 多 Worker。主机 A 运行 serve 控制面、HTTP API 与内嵌管理台、私网 PostgreSQL、工作区卷和导出的主密钥；主机 B 运行 gateway Worker，无 HTTP 监听、无管理 token，直连主机 A 的 PostgreSQL，使用 DSN 与主密钥副本，绝不重新生成数据库密码或自建主密钥。每个 Worker 安装相同的内容寻址资产包，不发布资产；每个领取的执行固定一个 bundle。单实例 Compose 仍是默认档。K8s、数据库 HA 与跨节点工作区或业务状态共享仍不属于本版本。远程管理需部署侧 TLS 或可信通道，serve 不内置 TLS。基线提交 2bfcede9db06baf7cec27f1adb825a8e1ffb3969。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2447df"/></marker></defs>
