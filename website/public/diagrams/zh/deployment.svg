<text x="40" y="38" font-size="14" fill="#2447df">BASALT / 部署结构</text>
<text x="40" y="85" font-size="32" fill="#151e2b" font-weight="600">控制面与 Worker，共用一个 PostgreSQL。</text>
<text x="40" y="115" font-size="17" fill="#59687a">Compose 多 Worker · 首发部署档</text>
<text x="60" y="195" font-size="13" fill="#2447df">主机 A · 控制面</text>
<text x="690" y="195" font-size="13" fill="#2447df">主机 B · Worker</text>
<text x="88" y="248" font-size="19" fill="#151e2b" font-weight="600">本地浏览器</text>
<text x="88" y="272" font-size="14" fill="#59687a">管理台</text>
<text x="358" y="248" font-size="19" fill="#151e2b" font-weight="600">远程管理员</text>
<text x="358" y="272" font-size="14" fill="#59687a">部署侧 HTTPS</text>
<text x="358" y="348" font-size="18" fill="#151e2b" font-weight="600">可选反向代理 / TLS</text>
<text x="358" y="373" font-size="14" fill="#59687a">管理认证保持开启</text>
<text x="108" y="468" font-size="19" fill="#151e2b" font-weight="600">basalt-control · serve</text>
<text x="108" y="492" font-size="15" fill="#59687a">HTTP 8080 + 内嵌 /console/</text>
<text x="108" y="514" font-size="15" fill="#59687a">调度 · 生命周期 · 资产发布</text>
<text x="108" y="628" font-size="18" fill="#151e2b" font-weight="600">工作区卷</text>
<text x="108" y="653" font-size="14" fill="#59687a">种子导入 + 本地文件</text>
<text x="358" y="628" font-size="18" fill="#151e2b" font-weight="600">PostgreSQL</text>
<text x="358" y="651" font-size="14" fill="#59687a">私网地址</text>
<text x="358" y="671" font-size="14" fill="#59687a">运行状态 + 审计</text>
<text x="108" y="758" font-size="18" fill="#151e2b" font-weight="600">主密钥（导出一次）</text>
<text x="108" y="783" font-size="14" fill="#59687a">只读挂载 · 原样复制到每个 Worker</text>
<text x="728" y="318" font-size="19" fill="#151e2b" font-weight="600">basalt-worker · gateway</text>
<text x="728" y="343" font-size="15" fill="#59687a">无 HTTP 监听 · 无管理 token</text>
<text x="728" y="367" font-size="15" fill="#59687a">领取到期执行 · 按哈希安装资产包</text>
<text x="710" y="455" font-size="13" fill="#2447df">Worker 经私网直连主机 A 的 PostgreSQL；绝不重新生成数据库密码。</text>
<text x="728" y="508" font-size="18" fill="#151e2b" font-weight="600">Worker 工作区</text>
<text x="728" y="533" font-size="14" fill="#59687a">种子导入 + 本节点文件</text>
<text x="1008" y="508" font-size="18" fill="#151e2b" font-weight="600">资产包</text>
<text x="1008" y="533" font-size="14" fill="#59687a">按内容哈希安装</text>
<text x="728" y="658" font-size="18" fill="#151e2b" font-weight="600">DSN 与主密钥副本</text>
<text x="728" y="683" font-size="14" fill="#59687a">不含 PostgreSQL 密码 · 不发布资产</text>
<text x="205" y="372" font-size="13" fill="#2447df">loopback HTTP</text>
<text x="490" y="312" font-size="13" fill="#2447df">HTTPS</text>
<text x="490" y="428" font-size="13" fill="#2447df">HTTP</text>
<text x="36" y="918" font-size="20" fill="#151e2b" font-weight="600">首发部署档 · Compose 多 Worker</text>
<text x="36" y="950" font-size="15" fill="#151e2b">单实例 Compose 仍是默认档；多 Worker 文件增加控制面与一个或多个 gateway。</text>
<text x="36" y="978" font-size="15" fill="#151e2b">所有 Worker 安装相同的内容寻址资产包，不发布资产，每个领取的执行固定一个 bundle。</text>
<text x="36" y="1006" font-size="15" fill="#151e2b">K8s、数据库 HA 与跨节点工作区或业务状态共享仍不属于本版本。</text>
<text x="40" y="1070" font-size="15" fill="#59687a">远程管理需部署侧 TLS 或可信通道；serve 不内置 TLS。</text>
<text x="40" y="1096" font-size="15" fill="#59687a">升级：先停全部旧进程；备份数据库、每个工作区、密钥与旧镜像。</text>
