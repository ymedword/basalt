<rect x="846" y="703" width="58" height="21" rx="3" fill="#f7f4eb"/>
<text x="875" y="717" text-anchor="middle" font-size="13" fill="#244bd8">按需读取</text>
<text x="60" y="257" font-size="13" letter-spacing="1" fill="#244bd8" stroke="#f7f4eb" stroke-width="5" paint-order="stroke">自托管主机 · 同一工作区一把实例锁</text>
