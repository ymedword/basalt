<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1120" viewBox="0 0 1320 1120" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="deployment" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="diagram-title">当前部署：单节点，自托管。</title>
<desc id="diagram-desc">当前产品拓扑为单节点：自托管 Go 二进制内嵌管理台，读取 basalt.yaml，使用 .basalt 工作区中的 SQLite、Agent 定义、技能和记忆。管理台默认仅回环监听。CLI 写命令与 serve 共用工作区实例锁，不能并行写同一工作区。远程管理需由部署方提供 TLS／反向代理或可信加密通道，serve 不内置 TLS。模型与外部工具端点按配置连接。托管凭据主密钥位于工作区之外，单独备份。不承诺容器或多 Worker 拓扑。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244bd8"/></marker></defs>
