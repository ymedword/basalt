<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="module-map" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="diagram-title">职责明确的包，显式装配的依赖。</title>
<desc id="diagram-desc">cmd/basalt 启动装配根 internal/app。CLI 与 HTTP 入口适配器通过注入端口调用 core 的 AgentService 与 ReActLoop。core 持有消费方端口、准入、预算和运行循环；provider、tool、memory、workspace、storage 提供对应实现，cron 适配器提供调度机制。本图表达职责协作，Go 的实际导入方向另图展示。</desc>
