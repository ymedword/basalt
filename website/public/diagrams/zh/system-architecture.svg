<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="system-architecture" data-source-commit="2bfcede9db06baf7cec27f1adb825a8e1ffb3969" data-working-tree-feature="US25C">
<title id="diagram-title">Basalt 系统架构简图</title>
<desc id="diagram-desc">用于 README 的紧凑架构图。五个逻辑层：接入层（控制面上的命令行、HTTP API 与内嵌管理台）；应用层（Agent 定义与已发布资产包、serve 控制面与 gateway Worker）；执行引擎层（每个 Worker 上的 PromptBuilder、ReActLoop 与 ToolExecutor）；基础服务层（模型适配、工具、MCP、技能、记忆与通知）；存储层（所有节点共享的自托管 PostgreSQL，以及每节点工作区与内容寻址资产包）。控制面发布不可变资产包，Worker 按哈希安装且不发布；每个领取的执行固定 bundle 哈希，准入先校验这一份目录再发出调用。技能从已发布版本物化。认证、预算与持久审计贯穿各层。跨节点业务状态共享、数据库 HA 与 K8s 仍不属于本版本；逻辑作用域不等同于进程隔离。基线提交 2bfcede9db06baf7cec27f1adb825a8e1ffb3969。</desc>
