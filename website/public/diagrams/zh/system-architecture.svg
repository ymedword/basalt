<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" role="img" aria-labelledby="summary-title summary-desc" data-diagram-id="system-architecture" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77"><title id="summary-title">Basalt 简化系统架构</title><desc id="summary-desc">用于项目 README 的 Basalt 简化架构。按常见五层划分：接入层（CLI、HTTP API、内嵌管理台）、应用层（独立 Agent 定义与状态，以及生命周期、资源和调度服务）、执行引擎层（PromptBuilder、ReActLoop、ToolExecutor）、基础服务层（模型适配、工具／MCP／技能、记忆与通知）、存储层（内嵌 SQLite、工作区文件）。认证、资源作用域、执行约束与持久审计贯穿各层。展示当前单节点 Go 实现；Agent 逻辑作用域不等于进程或容器隔离，外部端点按配置接入。详细执行和部署视图由官网文档承接。</desc><rect width="1360" height="640" fill="#faf8f1"/><g font-family="sans-serif">
