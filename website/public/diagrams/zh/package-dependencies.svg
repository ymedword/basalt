<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1300" viewBox="0 0 1320 1300" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="package-dependencies" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="diagram-title">依赖指向内核，内核不依赖实现。</title>
<desc id="diagram-desc">实际本地 Go 导入图：cmd/basalt 导入 internal/app；app 导入 cli、web、provider、tool、storage、memory、workspace、adapters/cron、core 和 assets；cli 导入 core 与 channel；web、provider、tool、storage、memory、workspace、adapters/cron 导入 core；memory 还导入 workspace。channel 与 assets 不导入其他本地生产包，core 只导入标准库。省略标准库、外部协议 SDK 与测试专用依赖。箭头由导入者指向依赖。</desc>
