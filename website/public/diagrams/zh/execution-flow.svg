<text x="1055" y="1381" text-anchor="middle" font-size="13" fill="#244bd8">恢复；不重放</text>
<text x="65" y="163" font-size="13" letter-spacing="1" fill="#244bd8" stroke="#f7f4eb" stroke-width="5" paint-order="stroke">运行与消息路径</text>
<text x="800" y="163" font-size="13" letter-spacing="1" fill="#244bd8" stroke="#f7f4eb" stroke-width="5" paint-order="stroke">审计与异常路径</text>
<g data-node-id="request"><rect x="80" y="190" width="620" height="70" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="218" font-size="20" font-weight="600">Agent 请求</text>
<text x="98" y="243" font-size="16" fill="#5d6a70">CLI／HTTP／定时 → AgentService</text>
</g>
<g data-node-id="admission"><rect x="80" y="305" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="333" font-size="20" font-weight="600">准入与 Run 快照</text>
<text x="98" y="358" font-size="16" fill="#5d6a70">生命周期 active、资格、并发与预算</text>
<text x="98" y="381" font-size="16" fill="#5d6a70">固定本轮使用的已发布资源版本</text>
</g>
<g data-node-id="rejected"><rect x="815" y="305" width="485" height="96" rx="7" fill="#f0eee7" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="333" font-size="20" font-weight="600">请求被拒绝</text>
<text x="833" y="358" font-size="16" fill="#5d6a70">不发出模型或工具调用</text>
<text x="833" y="381" font-size="16" fill="#5d6a70">请求拒绝不是 Run 的第五种终态</text>
</g>
<g data-node-id="prompt"><rect x="80" y="450" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="478" font-size="20" font-weight="600">PromptBuilder</text>
<text x="98" y="503" font-size="16" fill="#5d6a70">组装上下文、保留约束、按完整交互组裁剪</text>
</g>
<g data-node-id="model-pending"><rect x="815" y="450" width="485" height="78" rx="7" fill="#e9edf9" stroke="#244bd8" stroke-width="1.2"/>
<text x="833" y="478" font-size="20" font-weight="600">llm_calls → pending</text>
<text x="833" y="503" font-size="16" fill="#5d6a70">先预写；预写失败不发出模型请求</text>
</g>
<g data-node-id="provider"><rect x="80" y="585" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="613" font-size="20" font-weight="600">Provider 协议调用</text>
<text x="98" y="638" font-size="16" fill="#5d6a70">仅查询本 Run 固定的显式 Provider 映射</text>
</g>
<g data-node-id="model-terminal"><rect x="815" y="585" width="485" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="613" font-size="20" font-weight="600">llm_calls → success / failed</text>
<text x="833" y="638" font-size="16" fill="#5d6a70">调用结束后更新同一审计行</text>
</g>
<g data-node-id="assistant"><rect x="80" y="720" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="748" font-size="20" font-weight="600">追加 assistant 消息</text>
<text x="98" y="773" font-size="16" fill="#5d6a70">执行工具前先保存包含 tool_calls 的消息</text>
</g>
<g data-node-id="fatal"><rect x="815" y="720" width="485" height="78" rx="7" fill="#f0eee7" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="748" font-size="20" font-weight="600">致命失败 → Run failed</text>
<text x="833" y="773" font-size="16" fill="#5d6a70">模型、上下文或消息持久化的致命失败</text>
</g>
<g data-node-id="tool-check"><rect x="80" y="855" width="620" height="78" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="883" font-size="20" font-weight="600">工具解析与入参检查</text>
<text x="98" y="908" font-size="16" fill="#5d6a70">检查注册工具、Agent 声明工具集与参数</text>
</g>
<g data-node-id="tool-pending"><rect x="815" y="855" width="485" height="78" rx="7" fill="#e9edf9" stroke="#244bd8" stroke-width="1.2"/>
<text x="833" y="883" font-size="20" font-weight="600">tool_invocations → pending</text>
<text x="833" y="908" font-size="16" fill="#5d6a70">Tool.Execute 前预写；失败则拒绝执行</text>
</g>
<g data-node-id="execute"><rect x="80" y="990" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="1018" font-size="20" font-weight="600">Tool.Execute</text>
<text x="98" y="1043" font-size="16" fill="#5d6a70">Policy.Check → 受控动作／CommandRunner</text>
<text x="98" y="1066" font-size="16" fill="#5d6a70">单工具超时与有界输出</text>
</g>
<g data-node-id="tool-terminal"><rect x="815" y="990" width="485" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="1018" font-size="20" font-weight="600">tool_invocations → success / failed</text>
<text x="833" y="1043" font-size="16" fill="#5d6a70">策略拒绝记 failed／sandbox_denied</text>
<text x="833" y="1066" font-size="16" fill="#5d6a70">失败回填模型，Run 可以继续</text>
</g>
<g data-node-id="result"><rect x="80" y="1140" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="1168" font-size="20" font-weight="600">追加工具结果，检查取消与预算</text>
<text x="98" y="1193" font-size="16" fill="#5d6a70">进入下一轮时重新组装提示词</text>
<text x="98" y="1216" font-size="16" fill="#5d6a70">assistant／tool 消息仅由 ReActLoop 追加</text>
</g>
<g data-node-id="recovery"><rect x="815" y="1140" width="485" height="128" rx="7" fill="#f0eee7" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="833" y="1168" font-size="20" font-weight="600">崩溃恢复 · 必须持有实例锁</text>
<text x="833" y="1193" font-size="16" fill="#5d6a70">pending 审计 → unknown；running Run → failed</text>
<text x="833" y="1216" font-size="16" fill="#5d6a70">补齐半截工具组；不自动重放</text>
<text x="833" y="1239" font-size="16" fill="#5d6a70">管理操作按独立契约查证实际结果</text>
</g>
<g data-node-id="budget"><rect x="80" y="1290" width="620" height="96" rx="7" fill="#fffdf8" stroke="#bfc9cc" stroke-width="1.2"/>
<text x="98" y="1318" font-size="20" font-weight="600">预算停止／取消</text>
<text x="98" y="1343" font-size="16" fill="#5d6a70">迭代或工具次数上限 → limit_reached（部分结果）</text>
<text x="98" y="1366" font-size="16" fill="#5d6a70">取消或 Run 截止时间 → cancelled</text>
</g>
<g data-node-id="outcome"><rect x="80" y="1510" width="1220" height="102" rx="7" fill="#e9edf9" stroke="#244bd8" stroke-width="1.2"/>
<text x="98" y="1538" font-size="20" font-weight="600">Run 终态</text>
<text x="98" y="1563" font-size="16" fill="#5d6a70">completed  ·  limit_reached（部分结果，非错误）  ·  cancelled  ·  failed</text>
<text x="98" y="1586" font-size="16" fill="#5d6a70">持久化运行结果并释放资源引用；调用审计仍使用独立状态机</text>
</g>
<text x="40" y="1645" font-size="15" fill="#5d6a70">预算用于约束执行，不触发重试。工具失败不自动等于 Run 失败；取消判断优先。</text>
<text x="40" y="1671" font-size="12" fill="#5d6a70">源码提交: eb97cd539e51 · 当前实现</text>
</g></svg>
