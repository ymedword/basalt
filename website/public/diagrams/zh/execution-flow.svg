<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1690" viewBox="0 0 1380 1690" role="img" aria-labelledby="diagram-title diagram-desc" data-diagram-id="execution-flow" data-source-commit="eb97cd539e51e2b3db15afcfcc1dfa295eaebe77">
<title id="diagram-title">一次 Run，边界清楚，记录可查。</title>
<desc id="diagram-desc">当前执行流程包含请求准入、生命周期与资源资格、Run 资源和预算固定、PromptBuilder、模型审计 pending 预写、Provider 协议调用、模型审计 success/failed、assistant 消息追加、工具归属与入参检查、工具审计 pending 预写、受策略约束的执行、工具审计 success/failed 与工具结果追加。明确展示失败、拒绝、取消、恢复分支。Run 的四个终态为 completed、limit_reached、cancelled、failed。limit_reached 保留部分结果，不是错误；工具拒绝或失败会回填模型，不自动使 Run 失败；取消判断优先于预算。启动恢复先持有实例锁：pending 调用审计归为 unknown，未完成 Run 归为 failed，补齐半截工具组，绝不自动重放。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244bd8"/></marker></defs>
<rect width="1380" height="1690" fill="#f7f4eb"/>
