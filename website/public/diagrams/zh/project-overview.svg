<text x="350" y="559" font-size="18" fill="#59687a">每个 Agent 有独立声明，按作用域管理业务状态。</text>
<text x="350" y="606" font-size="18" fill="#59687a">应用服务：生命周期／资源管理／任务调度</text>
<text x="350" y="1426" font-size="18" fill="#59687a">管理 token · 作用域绑定 · 执行预算／取消</text>
<text x="350" y="1453" font-size="18" fill="#59687a">两阶段调用审计 · 实例锁 · 恢复时不自动重放</text>
<text x="40" y="1530" font-size="18" fill="#2447df">实线：进程内调用或依赖     虚线：按配置跨越运行边界</text>
<text x="40" y="1560" font-size="18" fill="#2447df">这里展示逻辑分层，不是执行时序；CLI 写命令与 serve 共用工作区实例锁。</text>
<text x="40" y="1600" font-size="18" fill="#59687a">Agent 按逻辑作用域管理；当前图不承诺 Agent 协作、多节点执行或容器隔离。</text>
<text x="40" y="1629" font-size="18" fill="#59687a">模型与 MCP 可按配置在主机外处理数据；本地工具策略不能约束外部 MCP 服务自身的 I/O。</text>
<text x="40" y="1665" font-size="15" fill="#59687a">当前实现 · 源码 eb97cd539e51</text>
</g></svg>
